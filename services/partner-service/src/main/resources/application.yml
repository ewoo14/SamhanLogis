server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_PARTNER_PORT:8095}}

spring:
  application:
    name: partner-service
  servlet:
    multipart:
      # P1 거래처 첨부 사진 업로드 — 단일 파일 ≤10MB (이미지/PDF 허용, partner-attachments 버킷).
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    # 시크릿 placeholder — DB 자격증명은 반드시 환경변수로 주입.
    # default 값은 로컬 docker-compose 와의 호환을 위한 자리 표시자이며 실제 환경에서는 override 필수.
    # Phase 8 2차 chained-default — SAMHAN_PARTNER_DB_* 우선, LEGACY_DB_* legacy fallback (Phase 10 cutover 시점 단일화).
    url: jdbc:postgresql://${SAMHAN_PARTNER_DB_HOST:${LEGACY_DB_HOST:localhost}}:${SAMHAN_PARTNER_DB_PORT:${LEGACY_DB_PORT:5432}}/${SAMHAN_PARTNER_DB_NAME:${LEGACY_DB_NAME:partner_db}}
    # W10-5 회고 — chained-default + samhan default fallback (다른 service 와 동일 패턴, env 미설정 시 connection refused 회피)
    username: ${SAMHAN_PARTNER_DB_USER:${LEGACY_DB_USER:${DB_USER}}}
    password: ${SAMHAN_PARTNER_DB_PASSWORD:${LEGACY_DB_PASSWORD:${DB_PASSWORD}}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Phase 8 2차 — ServiceDiscoveryClient provider toggle. eureka default (Phase 10 시점 aws-cloud-map 으로 전환).
samhan:
  discovery:
    provider: ${SAMHAN_DISCOVERY_PROVIDER:eureka}
  security:
    department:
      enabled: true
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 표준, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화).
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:CHANGE_ME_LOCAL_ONLY}}
  # Stage 1 local-test seed (PartnerSeeder) toggle. dev profile + 본 toggle 모두 true 인 경우만 50건 seed.
  # 운영 / staging 데이터 오염 방지 — default false.
  partner:
    seed-test-data: ${SAMHAN_PARTNER_SEED_TEST_DATA:false}
    # 거래처 첨부 placeholder seed (PartnerAttachmentSeeder) toggle — 30 partner × ~2.5 = 75건.
    seed-test-attachments: ${SAMHAN_PARTNER_SEED_TEST_ATTACHMENTS:false}
    # MinIO (S3 호환) — partner-attachments 버킷. enabled=false 시 NoopAttachmentStorage fallback.
    minio:
      enabled: ${SAMHAN_PARTNER_MINIO_ENABLED:false}
      endpoint: ${SAMHAN_PARTNER_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${SAMHAN_PARTNER_MINIO_ACCESS_KEY:${SAMHAN_S3_ACCESS_KEY}}
      secret-key: ${SAMHAN_PARTNER_MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
      bucket: ${SAMHAN_PARTNER_MINIO_BUCKET:partner-attachments}
      presigned-expiry-seconds: ${SAMHAN_PARTNER_MINIO_PRESIGNED_EXPIRY:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:partner_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
