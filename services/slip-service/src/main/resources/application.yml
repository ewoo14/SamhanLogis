server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (예: InfluxDB 가 8086 점유 시 SERVER_PORT=8186).
  # SAMHAN_SLIP_PORT 도 chained-default 로 호환 (기존 4개 service 패턴 일관).
  port: ${SERVER_PORT:${SAMHAN_SLIP_PORT:8086}}

spring:
  application:
    name: slip-service
  servlet:
    multipart:
      # P1-8 (Stage 4) 슬립 첨부 사진 — 단일 파일 ≤5MB, 배송 사진 자동 압축 권장.
      # Controller 레이어에서 endpoint 별 가드 적용 (attachment ≤5MB).
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:slip_db}
    username: ${DB_USER:samhan}
    password: ${DB_PASSWORD:samhan_dev_pw}
    hikari:
      # 보상 감사(CompensationAuditWriter)는 REQUIRES_NEW 로 외부 트랜잭션과 별도 커넥션을 점유한다.
      # 보상 실패 다발(inventory 일시 다운 등) 시 스레드당 2 커넥션 소모 → 기본값(10) 고갈 방지로 상향. (D-SER-22 후속, DevOps P1)
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # [D-R8-2] fleet 표준 30초(Hikari 기본) 복원. 종전에는 가격기억 worker 를 빨리 fail-soft
      # 시키려고 4초를 전역에 걸었으나, 그 4초는 slip-service 의 모든 사용자 요청에도 적용되어
      # pool 포화 시 SQLTransientConnectionException → HTTP 500 을 유발했다 (fleet 26모듈 중 유일).
      # 가격기억의 4초 정책은 아래 app.slip.price-memory.datasource.hikari 전용 pool 로 격리했다.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # Phase 12 Step 2 (PR-H2) — Redis 연결 설정 (samhan.realtime.broker=redis 일 때만 사용).
  # in-memory broker (default) 에서는 사용되지 않으나, RedisAutoConfiguration 이 classpath
  # 미존재 시 NoOp 이고 BE 의 RedisRealtimeBroker 는 @ConditionalOnProperty 로 격리되므로
  # default in-memory 운영 환경에서는 Redis 미가용도 무해 (heartbeat / publish 정상).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

samhan:
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
    # 동적 권한은 사용자 요청 critical path 이므로 게이트웨이 600초 timeout 을 상속하지 않는다.
    # repo 내 동기 RestClient 표준(연결 2초/응답 3초)과 맞춰 auth 장애를 빠르게 fail-closed 한다.
    connect-timeout-ms: ${SAMHAN_AUTH_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SAMHAN_AUTH_READ_TIMEOUT_MS:3000}
  compensation:
    retention:
      # D-SER-25 — 보상 실패 감사 retention. 기본 비활성, 운영에서 명시 활성.
      enabled: ${SAMHAN_COMPENSATION_RETENTION_ENABLED:false}
      cron: ${SAMHAN_COMPENSATION_RETENTION_CRON:0 30 3 * * *}
      zone: ${SAMHAN_COMPENSATION_RETENTION_ZONE:Asia/Seoul}
      retention-days: ${SAMHAN_COMPENSATION_RETENTION_DAYS:90}
    purge:
      # D-SER-28 — retention soft-delete 후 grace 경과 행만 물리 삭제. 기본 비활성.
      enabled: ${SAMHAN_COMPENSATION_PURGE_ENABLED:false}
      cron: ${SAMHAN_COMPENSATION_PURGE_CRON:0 0 4 * * *}
      zone: ${SAMHAN_COMPENSATION_PURGE_ZONE:Asia/Seoul}
      grace-days: ${SAMHAN_COMPENSATION_PURGE_GRACE_DAYS:30}
      batch-size: ${SAMHAN_COMPENSATION_PURGE_BATCH_SIZE:500}
    alert:
      # D-SER-26 — 보상 실패 운영 알림 푸시. 기본 비활성, 운영에서 enabled=true + recipient 지정 시 발송.
      enabled: ${SAMHAN_COMPENSATION_ALERT_ENABLED:false}
      recipient-user-id: ${SAMHAN_COMPENSATION_ALERT_RECIPIENT_USER_ID:}
    retry:
      # D-SER-27 — 보상 실패 자동 재시도(outbox/Saga). 기본 비활성, 운영에서 명시 활성.
      enabled: ${SAMHAN_COMPENSATION_RETRY_ENABLED:false}
      cron: ${SAMHAN_COMPENSATION_RETRY_CRON:0 */10 * * * *}
      max-retries: ${SAMHAN_COMPENSATION_RETRY_MAX:5}
      backoff-base-minutes: ${SAMHAN_COMPENSATION_RETRY_BACKOFF_MIN:10}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:dev-internal-token-change-me}}
  slip:
    price-memory:
      # [D-R8-2 / R8-BE-4] 가격기억 전용 DataSource — 메인 pool 과 격리된 별도 Hikari pool.
      # SlipDataSourceConfig 의 priceMemoryDataSource 빈이 아래 키를 바인딩하며, url/username/
      # password/driver 는 spring.datasource.* 를 공유한다(같은 DB, 다른 pool).
      # 4초 connection-timeout 을 여기에 가둬 사용자 요청 경로(전역 30초)를 오염시키지 않는다.
      # max 4 = async-max-pool-size 4 와 1:1. minimum-idle 0 = 유휴 시 커넥션 미점유.
      datasource:
        hikari:
          pool-name: price-memory-pool
          maximum-pool-size: ${SAMHAN_PRICE_MEMORY_DB_POOL_MAX:4}
          minimum-idle: ${SAMHAN_PRICE_MEMORY_DB_POOL_MIN_IDLE:0}
          connection-timeout: ${SAMHAN_PRICE_MEMORY_DB_CONNECTION_TIMEOUT_MS:4000}
      # 커넥션 획득 대기는 위 전용 pool 의 connection-timeout(기본 4초), 아래 timeout 은
      # 획득 후 REQUIRES_NEW 트랜잭션에 각각 적용된다. 둘을 합친 단일 wall-clock 상한은 아니다.
      lock-timeout-ms: ${SAMHAN_PRICE_MEMORY_LOCK_TIMEOUT_MS:1000}
      statement-timeout-ms: ${SAMHAN_PRICE_MEMORY_STATEMENT_TIMEOUT_MS:3000}
      transaction-timeout-seconds: ${SAMHAN_PRICE_MEMORY_TRANSACTION_TIMEOUT_SECONDS:4}
      async-core-pool-size: ${SAMHAN_PRICE_MEMORY_ASYNC_CORE_POOL_SIZE:2}
      async-max-pool-size: ${SAMHAN_PRICE_MEMORY_ASYNC_MAX_POOL_SIZE:4}
      async-queue-capacity: ${SAMHAN_PRICE_MEMORY_ASYNC_QUEUE_CAPACITY:100}
      async-shutdown-await-seconds: ${SAMHAN_PRICE_MEMORY_ASYNC_SHUTDOWN_AWAIT_SECONDS:5}
    # PR-G1 backlog #1 — partner-service 거래처 strict 검증 toggle (hybrid policy).
    # default true → 발행 시 partner-service 미등록 (404) 거래처 reject (BusinessException NOT_FOUND).
    # false → lookup skip + warning log (data-migration / disaster-recovery 시점만 사용 권장).
    # 5xx / 404 외 4xx(401/403/408/429 등 검증 불가) / 연결 실패는 strict 모드에서도 fail-open
    # (회계 critical path 보호).
    # ⚠️ 위 정책은 estimate 발행(DRAFT 생성) 경로에만 적용된다. 주문→전표 committed 발행
    #    (SlipPublishService.resolveCommittedPartnerId)은 전표 거래처 필수화 불변식상
    #    이 toggle 과 무관하게 항상 fail-closed (FOUND+partnerId 만 성공·NOT_FOUND/SERVER_ERROR/SKIPPED/
    #    FOUND-empty 는 발행 차단). 거래처 없는 committed 전표(#823 오귀속) 원천 차단 우선.
    partner-strict-validation: ${SAMHAN_SLIP_PARTNER_STRICT:true}
    # P1-8 (Stage 4) — 슬립 첨부 MinIO bucket. default false → NoopSlipAttachmentStorage fallback.
    # DevOps 가 별도 dispatch 로 bucket `slip-attachments` 생성. 활성 시 MinioSlipAttachmentStorage 주입.
    minio:
      enabled: ${SAMHAN_SLIP_MINIO_ENABLED:false}
      endpoint: ${SAMHAN_SLIP_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${SAMHAN_SLIP_MINIO_ACCESS_KEY:samhan}
      secret-key: ${SAMHAN_SLIP_MINIO_SECRET_KEY:samhan_dev_pw}
      bucket: ${SAMHAN_SLIP_MINIO_BUCKET:slip-attachments}
      presigned-expiry-seconds: 3600
  # P1 범용 사진 첨부 (samhan-attachments bucket, AttachmentService).
  # 입고 검수 / 배송 완료 / 영업 방문 현장 사진 단일 파일 ≤5MB — presigned URL 방식.
  # chained-default 패턴: SAMHAN_S3_* 표준 env. 빈 endpoint → AWS SDK default (Phase 11 cutover 자동 전환).
  # 버킷 생성: infrastructure/scripts/setup-minio-buckets.ps1 (start-local-full.ps1 자동 호출).
  # Phase 11 AWS S3 cutover: SAMHAN_S3_ENDPOINT 빈 값 + SAMHAN_AWS_REGION=ap-northeast-2 설정으로 전환.
  s3:
    endpoint: ${SAMHAN_S3_ENDPOINT:http://localhost:9000}
    access-key: ${SAMHAN_S3_ACCESS_KEY:samhan}
    secret-key: ${SAMHAN_S3_SECRET_KEY:samhan_dev_pw}
    bucket: ${SAMHAN_S3_BUCKET:samhan-attachments}
    presigned-expiry-seconds: ${SAMHAN_S3_PRESIGNED_EXPIRY:300}
    region: ${SAMHAN_AWS_REGION:us-east-1}
    # path-style-access: MinIO = true (S3 호환 경로 스타일). AWS S3 cutover 시 false 로 전환.
    # Phase 11: SAMHAN_S3_PATH_STYLE_ACCESS=false (virtual-hosted-style — AWS S3 기본).
    path-style-access: ${SAMHAN_S3_PATH_STYLE_ACCESS:true}
    # feature/local-test-setup Stage 2 — Slip 100건 + SlipLine ~300건 + DeliveryBatch 30건 시드.
    # SlipSeeder + DeliveryBatchSeeder 가 동일 toggle 공유 (slip → batch 순서, @Order 20/30).
    # dev profile + true 시에만 활성. CI/prod 기본 OFF (idempotent — 안전 재실행).
    # W10-5 회고 — env 변수 prefix 통일 (SAMHAN_SLIP_SEED_TEST_DATA 우선, SLIP_SEED_TEST_DATA legacy fallback).
    seed-test-data: ${SAMHAN_SLIP_SEED_TEST_DATA:${SLIP_SEED_TEST_DATA:false}}
    # Phase 12 Step 3 (PR-H3) — 슬립 수정 요청 만료 시간 (시간 단위, default 24h).
    # 영업직원이 발행 후 슬립 수정 요청 발송 → 관리자 무응답 시 본 임계 초과 후 자동 EXPIRED.
    # SlipEditRequest.requestedAt + expires-hours < now() → status = EXPIRED 전환 (스케줄러).
    # 운영 알림 가이드 (Aligo SMS / Expo push 후속): docs/devops/slip-edit-request-notification.md
    edit-request:
      expires-hours: ${SAMHAN_SLIP_EDIT_REQUEST_EXPIRES_HOURS:24}
  # Phase 12 Step 1 (PR-H1) — Realtime SSE heartbeat 주기 (초).
  # BE-1 의 SSE keep-alive ScheduledExecutor 가 참조 — Reverse Proxy / LB idle
  # timeout 보다 짧게 유지 필요 (default 30s). api-gateway response-timeout
  # 600s 와 정합. 운영 적용 가이드: docs/devops/realtime-sse-production.md
  realtime:
    heartbeat-seconds: ${SAMHAN_REALTIME_HEARTBEAT_SECONDS:30}
    # Phase 12 Step 2 (PR-H2) — SSE broker 구현체 toggle.
    # - in-memory (default) : 단일 노드 ConcurrentHashMap 기반 (현재 운영 모델, 추가 의존 0).
    # - redis              : Redis pub/sub 기반 다중 노드 fan-out (Phase 11 AWS 다중 EC2/ECS 시 적용).
    # 운영 가이드: docs/devops/redis-realtime-broker.md (단일 vs 다중 노드 / ElastiCache 비용).
    broker: ${SAMHAN_REALTIME_BROKER:in-memory}
  # Slice B SMS 게이트웨이 — Aligo (한국 SMS 게이트웨이, Solapi 에서 마이그)
  sms:
    vendor: ${SMS_VENDOR:aligo}
    api-key: ${ALIGO_API_KEY:dev-key}
    user-id: ${ALIGO_USER_ID:dev-user}
    sender-phone: ${ALIGO_SENDER_PHONE:01000000000}
    base-url: ${ALIGO_BASE_URL:https://apis.aligo.in}
  # Slice B — 공개 모바일 페이지 base URL (SMS 본문 토큰 링크용)
  public:
    base-url: ${PUBLIC_BASE_URL:https://sign.samhan-air.com}
  # Phase 6 M5 (slip-service-integration) — legacy ecount warehouseCode → 내부 warehouse UUID 매핑.
  # 값은 inventory_db.warehouses 실재 행이며, 환경별로 반드시 주입한다.
  publish:
    warehouse-code-map:
      "[00003]": ${WAREHOUSE_UUID_HQ}
      "[2]":     ${WAREHOUSE_UUID_HUBAL}
      "[14]":    ${WAREHOUSE_UUID_ANSEONG}
      "[1]":     ${WAREHOUSE_UUID_CHANGWON}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:slip_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false


# 로컬 개발은 운영 환경변수 없이도 기동할 수 있도록 테스트용 고정 UUID를 사용한다.
# 운영 문서의 env 필수 매핑은 이 프로파일에서만 같은 키로 덮어쓴다.
app:
  publish:
    warehouse-code-map:
      "[00003]": 11111111-1111-1111-1111-000000000001
      "[2]":     11111111-1111-1111-1111-000000000002
      "[14]":    11111111-1111-1111-1111-000000000003
      "[1]":     11111111-1111-1111-1111-000000000004

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
