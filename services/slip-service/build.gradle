/*
 * services:slip-service — Slip(Single Table Inheritance) + SlipLine + SlipNumberSequence
 * (plan §3.1 전표 관리 시스템 — 첫 슬라이스: 출고/입고 전표만).
 *
 * Owns the `slips`, `slip_lines`, `slip_number_sequences` tables in PostgreSQL (`slip_db`).
 *
 * Inventory 연계: accept → /inventory/reserve, complete → /inventory/deduct(fromReservation=true)
 * 또는 /inventory/lots/inbound (입고전표), reject/cancel(after ACCEPTED) → /inventory/release.
 * Product 마스터 검증: ProductClient (inventory-service 와 동일 패턴).
 *
 * Flyway 는 day-one 부터 활성 — src/main/resources/db/migration 참조.
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // springdoc-openapi — /v3/api-docs (JSON) + /swagger-ui.html (대화형 UI) 자동 노출
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // P1-6 Excel export — 전표 목록/상세 .xlsx 다운로드 (GET /slips/export.xlsx).
    // poi-ooxml 이 poi-core 를 전이 의존으로 포함하므로 별도 poi 선언 불필요.
    // 버전 5.2.5 = accounting-service / inventory-service / arologis-service 와 동일.
    implementation 'org.apache.poi:poi-ooxml:5.4.0'

    // P1-8 슬립 첨부 사진 — MinIO (S3 호환) 백엔드. partner-service 와 동일 패턴.
    // app.slip.minio.enabled=true 일 때만 활성, default false → NoopSlipAttachmentStorage fallback.
    // bucket = `slip-attachments` (DevOps 가 별도 dispatch 로 생성).
    implementation 'io.minio:minio:8.5.12'

    // PR-H2 (Phase 12 Step 2) — Redis pub/sub 옵션 multi-node broker.
    // SAMHAN_REALTIME_BROKER=redis 시 RedisRealtimeBroker 활성, default in-memory SlipRealtimeBroker 만.
    // Redis 미연결 시 startup 정상 (auto-config 자체는 implementation 으로 포함되지만 broker bean 은
    // @ConditionalOnProperty 로 단일 노드 환경에서 무효).
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation project(':shared:common')
    implementation project(':shared:ecount-io')
    implementation project(':shared:security')
    // PR-H4a (Phase 12 Step 4a) — shared:realtime-abstraction module. SSE broker / audit overlay /
    // edit-request lock 정책 추출. slip-service 가 시범 활용 사례 (다른 13 service 는 PR-H4b 에서 활성).
    implementation project(':shared:realtime-abstraction')
    implementation project(':shared:collab-core')

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'slip-service.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    maxParallelForks = 1
    // 컨텍스트별 주/가격/inventory 풀을 무제한으로 보유하면 공유 Testcontainer의
    // PostgreSQL 연결을 고갈시킨다. 작은 캐시로 닫힌 컨텍스트의 풀을 즉시 반환한다.
    systemProperty 'spring.test.context.cache.maxSize', '1'
    // slip-service 테스트 스위트(800+ 테스트, 다수 @SpringBootTest 컨텍스트 + Testcontainers)가
    // 포크 테스트 JVM 기본 heap 을 초과해 OOM 하므로 상향(빌드 인프라 설정, 프로덕션 무관).
    maxHeapSize = '2g'
}
