server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_DC_CONFIG_PORT:8089}}

spring:
  application:
    name: dc-config-service
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
  datasource:
    # 시크릿 placeholder — DB 자격증명은 반드시 환경변수로 주입.
    # default 값은 로컬 docker-compose 와의 호환을 위한 자리 표시자이며 실제 환경에서는 override 필수.
    # W10-5 회고 — chained-default 표준 통일 (SAMHAN_DC_CONFIG_DB_* 우선, LEGACY_DB_* fallback, samhan default).
    url: jdbc:postgresql://${SAMHAN_DC_CONFIG_DB_HOST:${LEGACY_DB_HOST:${DB_HOST:localhost}}}:${SAMHAN_DC_CONFIG_DB_PORT:${LEGACY_DB_PORT:${DB_PORT:5432}}}/${SAMHAN_DC_CONFIG_DB_NAME:${LEGACY_DB_NAME:${DB_NAME:dc_config_db}}}
    username: ${SAMHAN_DC_CONFIG_DB_USER:${LEGACY_DB_USER:${DB_USER:samhan}}}
    password: ${SAMHAN_DC_CONFIG_DB_PASSWORD:${LEGACY_DB_PASSWORD:${DB_PASSWORD:samhan_dev_pw}}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

samhan:
  audit:
    publisher:
      enabled: true
    request-capture:
      enabled: true
  security:
    department:
      enabled: true
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:dev-only-token-replace}}
      # W10-4 (PR #99) DV-3 — dc-config 도 missing 토큰 즉시 401 (auth/product 와 동일 가드)
      allow-missing-token: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:dc_config_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
