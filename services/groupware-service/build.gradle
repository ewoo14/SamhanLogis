/*
 * services:groupware-service — Phase 9 W2
 *
 * 결재선 + 메신저 + 일정 도메인 (ApprovalLine + Message + Schedule + 2 부속 entity).
 * 외부 의존성 = user-service (직원 정보 lookup), ServiceDiscoveryClient 두 번째 소비자.
 *
 * 주요 책임:
 *   - ApprovalLine + ApprovalStep (결재선 chain)
 *   - Message (1:1 메신저)
 *   - Schedule + ScheduleParticipant (일정 + 참여자)
 *   - 3 enum (ApprovalStatus / MessageStatus / ScheduleStatus)
 *   - Internal endpoint (X-Internal-Token, 형제 service lookup 용)
 *   - Admin endpoint (관리자 권한, 결재 흐름 + 메신저 + 일정 CRUD)
 *
 * Owns the `groupware_db` schema in PostgreSQL.
 * Flyway 는 day-one 부터 활성 — src/main/resources/db/migration 참조.
 *
 * Phase 8 2차 정착 — `shared:discovery-abstraction` 의존성 추가 (provider toggle = eureka default).
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // springdoc-openapi — /v3/api-docs (JSON) + /swagger-ui.html (대화형 UI) 자동 노출
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // §7 그룹웨어 결재 첨부 — MinIO (S3 호환) 백엔드. samhan.minio.enabled=true 일 때 활성.
    implementation 'io.minio:minio:8.5.12'

    implementation project(':shared:common')
    implementation project(':shared:security')
    implementation project(':shared:notification-publisher')
    implementation project(':shared:collab-core')
    implementation project(':shared:approval-core')
    // Phase 8 2차 — vendor 추상화 wrapper (provider=eureka default, Phase 10 시점 aws-cloud-map 토글)
    implementation project(':shared:discovery-abstraction')
    // Phase 9 W4 — UserVerifier 표준 abstraction (W3 backlog #1 채택, Caffeine TTL 60s 일원화)
    implementation project(':shared:user-client-abstraction')
    // PR-H4b (Phase 12 Step 4b) BE-E — shared:realtime-abstraction module 의존 추가.
    // groupware-service 는 결재선/메신저/일정 도메인 — 게시 후 변경 신중 정책 일관 (slip-service
    // PR-H3 의 잠금 패턴 참조). 본 PR 범위:
    //   - shared module 의존 + autoconfig 활성 (broker bean + EditLockGuard)
    //   - groupware_audit_logs 테이블 (AuditLogEntry @MappedSuperclass 적용)
    //   - groupware_edit_requests 테이블 (EditRequestRecord @MappedSuperclass 적용)
    //   - 도메인 service 의 mutation 호출자에서 실제 audit/lock 활용은 향후 PR (entity 별 단계)
    implementation project(':shared:realtime-abstraction')

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'groupware-service.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'samhan.security.gateway-attestation-enforcement', System.getProperty('samhan.security.gateway-attestation-enforcement', 'false')
}
