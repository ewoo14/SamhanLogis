server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_GROUPWARE_PORT:8092}}

spring:
  application:
    name: groupware-service
  servlet:
    multipart:
      # §7 결재 첨부 파일 — ApprovalAttachmentService 가드(10MB)에 여유. slip-service 와 동일 한도.
      max-file-size: 12MB
      max-request-size: 13MB
  datasource:
    # 시크릿 placeholder — DB 자격증명은 반드시 환경변수로 주입.
    # default 값은 로컬 docker-compose 와의 호환을 위한 자리 표시자이며 실제 환경에서는 override 필수.
    # Phase 8 2차 chained-default — SAMHAN_GROUPWARE_DB_* 우선, LEGACY_DB_* legacy fallback (Phase 10 cutover 시점 단일화).
    url: jdbc:postgresql://${SAMHAN_GROUPWARE_DB_HOST:${LEGACY_DB_HOST:localhost}}:${SAMHAN_GROUPWARE_DB_PORT:${LEGACY_DB_PORT:5432}}/${SAMHAN_GROUPWARE_DB_NAME:${LEGACY_DB_NAME:groupware_db}}
    # W10-5 회고 — chained-default + samhan default fallback (env 미설정 시 connection refused 회피)
    username: ${SAMHAN_GROUPWARE_DB_USER:${LEGACY_DB_USER:${DB_USER}}}
    password: ${SAMHAN_GROUPWARE_DB_PASSWORD:${LEGACY_DB_PASSWORD:${DB_PASSWORD}}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Phase 8 2차 — ServiceDiscoveryClient provider toggle. eureka default (Phase 10 시점 aws-cloud-map 으로 전환).
samhan:
  discovery:
    provider: ${SAMHAN_DISCOVERY_PROVIDER:eureka}
  security:
    department:
      enabled: true
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
  user-service:
    url: ${SAMHAN_USER_SERVICE_URL:http://localhost:8083}
  user-client:
    # OPEN = fail-soft (local/default), STRICT = fail-fast (prod compose cutover).
    fail-mode: ${SAMHAN_USER_CLIENT_FAIL_MODE:OPEN}
  minio:
    # §7 결재 첨부 파일 storage. false/default 에서는 NoopApprovalAttachmentStorage fallback.
    enabled: ${SAMHAN_MINIO_ENABLED:false}
    endpoint: ${SAMHAN_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${SAMHAN_MINIO_ACCESS_KEY:${SAMHAN_S3_ACCESS_KEY}}
    secret-key: ${SAMHAN_MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
    groupware-approval-bucket: ${SAMHAN_GROUPWARE_APPROVAL_MINIO_BUCKET:groupware-approval-attachments}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 표준, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화).
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:CHANGE_ME_LOCAL_ONLY}}
  # Stage 4 local-test seed (GroupwareSeeder) toggle. dev profile + 본 toggle 모두 true 인 경우만 seed.
  # 운영 / staging 데이터 오염 방지 — default false.
  groupware:
    seed-test-data: ${SAMHAN_GROUPWARE_SEED_TEST_DATA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:groupware_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
samhan:
  security:
    gateway-attestation-enforcement: ${SAMHAN_GATEWAY_ATTESTATION_ENFORCEMENT:true}
