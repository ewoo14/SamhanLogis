server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_PRODUCT_PORT:8084}}

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    # FE-LOW2 (#688 S3 R1 리뷰) — partner-order-service application.yml 과 동일 가드.
    # EstimateCatalogInternalController.priceChangeSchedule()/priceBaseline() 등이 반환하는
    # LocalDate 필드가 기본값(write-dates-as-timestamps: true)에서는 [2026, 4, 1] 배열 형식으로
    # 직렬화될 수 있어, partner-order-service EstimateCatalogClient 의
    # LocalDate.parse(v.toString()) cross-service 계약이 깨질 위험을 명시적으로 차단한다.
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:CHANGE_ME_LOCAL_ONLY}}
      # W10-4 (PR #99) DV-3 — product-service 자체 prefix /products/internal/ + ROLE_INTERNAL + missing 토큰 즉시 401
      path-prefix: /products/internal/
      role: INTERNAL
      allow-missing-token: false
  # product/inventory 공통 local-test seed toggle. dev profile + 본 toggle 모두 true 인 경우만
  # Samsung HVAC 100건 seed. 운영 / staging 데이터 오염 방지 — default false.
  seed-test-data: ${SAMHAN_SEED_TEST_DATA:false}
  product:
    # PR-H4b (Phase 12 Step 4b BE-C) — 제품 마스터 수정/삭제 요청 자동 만료 (시간 단위, default 24h).
    # ProductEditRequest.requestedAt + expires-hours < now() → status = EXPIRED 전환 (스케줄러 1h 주기).
    edit-request:
      expires-hours: ${SAMHAN_PRODUCT_EDIT_REQUEST_EXPIRES_HOURS:24}

samhan:
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
# Phase 6 M1a 시드 스크립트 — dry-run mode 우선 (G13)
# (legacy 보존: cron 가용 전 fallback. ProductSheetSyncService 가 1회 sync 후 시트 데이터로 덮어쓰기)
seed:
  dry-run: ${SEED_DRY_RUN_MODE:true}
  report-dir: ${SEED_REPORT_DIR:docs/dev-reports}
  sheet-dir: ${SEED_SHEET_DIR:../../migration/source/sheet}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:product_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
