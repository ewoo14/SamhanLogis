server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_PRODUCT_PORT:8084}}

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    # FE-LOW2 (#688 S3 R1 리뷰) — partner-order-service application.yml 과 동일 가드.
    # EstimateCatalogInternalController.priceChangeSchedule()/priceBaseline() 등이 반환하는
    # LocalDate 필드가 기본값(write-dates-as-timestamps: true)에서는 [2026, 4, 1] 배열 형식으로
    # 직렬화될 수 있어, partner-order-service EstimateCatalogClient 의
    # LocalDate.parse(v.toString()) cross-service 계약이 깨질 위험을 명시적으로 차단한다.
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:CHANGE_ME_LOCAL_ONLY}}
      # W10-4 (PR #99) DV-3 — product-service 자체 prefix /products/internal/ + ROLE_INTERNAL + missing 토큰 즉시 401
      path-prefix: /products/internal/
      role: INTERNAL
      allow-missing-token: false
  scheduling:
    # 옵션 C-2 (PR-D Part 1 정정): 시트 → DB cron 5분 주기 sync.
    # 6 tab × 12회/시간 = 72 read/시간 → Sheets API quota 60 read/min 안전 마진 50배.
    enabled: ${PRODUCT_SYNC_SCHEDULING_ENABLED:true}
    product-sync-cron: ${PRODUCT_SYNC_CRON:0 */5 * * * *}
  # product/inventory 공통 local-test seed toggle. dev profile + 본 toggle 모두 true 인 경우만
  # Samsung HVAC 100건 seed. 운영 / staging 데이터 오염 방지 — default false.
  seed-test-data: ${SAMHAN_SEED_TEST_DATA:false}
  product:
    # PR-H4b (Phase 12 Step 4b BE-C) — 제품 마스터 수정/삭제 요청 자동 만료 (시간 단위, default 24h).
    # ProductEditRequest.requestedAt + expires-hours < now() → status = EXPIRED 전환 (스케줄러 1h 주기).
    edit-request:
      expires-hours: ${SAMHAN_PRODUCT_EDIT_REQUEST_EXPIRES_HOURS:24}

samhan:
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
  product:
    sheet-sync:
      # P2-1 (2026-06-11): @Value("${samhan.product.sheet-sync.cron-enabled:false}") 와 키 일치.
      # 구글 시트는 최초 시드 전용 — 자동 cron 기본 비활성.
      # 시드 재적재 비상 수단으로 수동 trigger(POST /api/v1/products/admin/sync)만 유지.
      cron-enabled: ${SAMHAN_PRODUCT_SHEET_SYNC_CRON_ENABLED:false}

# Google Sheets 연동 (옵션 C-2 sync source-of-truth)
# 시크릿: GOOGLE_SERVICE_ACCOUNT_KEY 환경변수 → JSON path. 본 코드 placeholder 만 보유 (.env 별도)
google:
  sheets:
    sheet-id: ${GOOGLE_SHEETS_SHEET_ID:1RJqO3jT-yJTi3NDBhL60o_cZWlVETGTU7UlvIKXuVNQ}
    service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY:/etc/samhan/sa-key.json}
    cache-ttl-minutes: ${GOOGLE_SHEETS_CACHE_TTL_MIN:5}
    endpoint-override: ${GOOGLE_SHEETS_ENDPOINT_OVERRIDE:}

# Phase 6 M1a 시드 스크립트 — dry-run mode 우선 (G13)
# (legacy 보존: cron 가용 전 fallback. ProductSheetSyncService 가 1회 sync 후 시트 데이터로 덮어쓰기)
seed:
  dry-run: ${SEED_DRY_RUN_MODE:true}
  report-dir: ${SEED_REPORT_DIR:docs/dev-reports}
  sheet-dir: ${SEED_SHEET_DIR:../../migration/source/sheet}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:product_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# local profile 에서는 시트 sync 비활성 (Service Account JSON 부재 가능)
app:
  scheduling:
    enabled: false

samhan:
  product:
    sheet-sync:
      cron-enabled: false
      # local profile: 시트 API / Service Account JSON 부재 가능 — 강제 비활성
