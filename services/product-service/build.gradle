/*
 * services:product-service — Product + Category aggregate (plan §3.5 first slice).
 *
 * Owns the `products` and `categories` tables in PostgreSQL (`product_db`).
 * Persists product master data (name / model / category / 가격 / 단종 상태 / 태그)
 * with self-referencing Category tree. 단종 처리는 별도 ProductStatus enum 으로
 * soft-delete 와 직교하게 운용한다 (개발책임자 결재 결정).
 *
 * 외부 서비스 호출이 없으므로 internal-token (X-Internal-Token) 의존성은 제외.
 *
 * Flyway 는 day-one 부터 활성 — src/main/resources/db/migration 참조.
 * jsonb 매핑은 Hibernate 6 native 의 {@code @JdbcTypeCode(SqlTypes.JSON)} 를 사용
 * (별도 com.vladmihalcea hibernate-types 의존성 불필요).
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // springdoc-openapi — /v3/api-docs (JSON) + /swagger-ui.html (대화형 UI) 자동 노출
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Google Sheets API (옵션 C-2: cron 1시간 시트 → DB 동기화)
    // 출처: 개발책임자 결정 2026-05-05 — 견적서/주문서는 legacy 구글 시트 source-of-truth.
    implementation 'com.google.api-client:google-api-client:2.4.0'
    implementation 'com.google.apis:google-api-services-sheets:v4-rev20240514-2.0.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'

    // Caffeine — 시트 응답 캐시 (5분 TTL, 반복 호출 절감)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    implementation project(':shared:common')
    implementation project(':shared:ecount-io')
    implementation project(':shared:security')
    // PR-H4b (Phase 12 Step 4b BE-C) — shared:realtime-abstraction module 적용.
    // Product master mutation 흐름에 audit overlay + SSE + EditLockGuard (DISCONTINUED 후 잠금)
    // 활성. slip-service (PR-H4a 시범) / partner-order-service (PR-H4b 함께) 와 동일 패턴.
    implementation project(':shared:realtime-abstraction')

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    // WireMock — 구글 Sheets API mock (ProductSheetSyncServiceIT)
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'product-service.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'samhan.security.gateway-attestation-enforcement', System.getProperty('samhan.security.gateway-attestation-enforcement', 'true')
}
