server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_PARTNER_ORDER_PORT:8088}}

spring:
  application:
    name: partner-order-service
  datasource:
    # 시크릿 placeholder — DB 자격증명은 반드시 환경변수로 주입.
    # default 값은 로컬 docker-compose 와의 호환을 위한 자리 표시자이며 실제 환경에서는 override 필수.
    # W10-5 회고 — chained-default 표준 통일 (SAMHAN_PARTNER_ORDER_DB_* 우선, LEGACY_DB_* fallback, samhan default).
    url: jdbc:postgresql://${SAMHAN_PARTNER_ORDER_DB_HOST:${LEGACY_DB_HOST:${DB_HOST:localhost}}}:${SAMHAN_PARTNER_ORDER_DB_PORT:${LEGACY_DB_PORT:${DB_PORT:5432}}}/${SAMHAN_PARTNER_ORDER_DB_NAME:${LEGACY_DB_NAME:${DB_NAME:partner_order_db}}}
    username: ${SAMHAN_PARTNER_ORDER_DB_USER:${LEGACY_DB_USER:${DB_USER:samhan}}}
    password: ${SAMHAN_PARTNER_ORDER_DB_PASSWORD:${LEGACY_DB_PASSWORD:${DB_PASSWORD:samhan_dev_pw}}}
  jackson:
    # P1-2 (Phase 2.4) — createdAt(LocalDateTime) 을 ISO-8601 문자열로 직렬화.
    # 기본값(write-dates-as-timestamps: true) 은 [2026, 5, 30, 12, 0, 0] 배열 형식으로 직렬화되어
    # FE formatLocalDateTime() 파싱 오작동 위험. false 로 강제하여 "2026-05-30T12:00:00" 형식 보장.
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  # #888 — outbox 스케줄러(SlipPublishOutboxScheduler, 5분)는 outboxTaskScheduler 전용 풀을
  # 사용한다. 나머지 @Scheduled 형제는 기본 taskScheduler를 공유하므로 형제 작업이 오래 걸려도
  # outbox tick이 같은 풀의 큐에서 굶지 않는다. TaskSchedulerPoolSizeIT가 형제 5개 완전 점유와
  # outbox 장기 점유의 양방향 격리를 실제 애플리케이션 컨텍스트에서 검증한다.
  #
  # 이 서비스의 @Scheduled 는 실제로 6개다: SlipPublishOutboxScheduler(5분)·
  # BootstrapCacheRefreshScheduler(10분)·DraftCleanupScheduler(매일 03시)·
  # PartnerOrderEditRequestService.expirePending(1시간) 4개 외에, shared:realtime-abstraction 의
  # RealtimeAutoConfiguration(SseEmitter 클래스패스 조건만으로 자동 활성화 — 이 서비스가 PR-H4b
  # SSE/presence 기능에 이 모듈을 쓰기 때문에 등록됨)이 InMemoryRealtimeBroker.heartbeat(30초)·
  # PresenceService.scheduledPruneExpired(30초) 2개를 더 추가한다.
  #
  # pool.size=5 는 현재 운영값으로 유지하며 outbox를 제외한 형제 풀의 크기다. 형제 5개가 동시에
  # 점유해도 outbox 전용 풀의 1개 worker가 보장되고, 반대로 outbox가 오래 걸려도 형제 pool 5의
  # 주기는 밀리지 않는다. 형제 수가 늘어나도 outbox 풀은 영향을 받지 않는다.
  # BootstrapCacheRefreshScheduler(product-service/Google Sheets 외부 네트워크 호출)의 실제
  # 소요 시간은 bootstrap_cache_refresh_duration Timer(Prometheus에서는 _seconds 시계열)로
  # 운영 이식 후 별도 코드 변경 없이 관측한다.
  task:
    scheduling:
      pool:
        size: 5

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# W10-4 (PR #99) DV-3 — shared:security InternalAuthProperties 통합 (app.security.internal.token).
# samhan.internal-token 은 legacy 보존 (PartnerOrder 외 client 가 system 호출용으로 직접 참조 가능).
# app.partner-order.* — Stage 3 local-test seed toggle (PartnerOrderSeeder).
#   운영/CI 에서는 반드시 false (또는 미설정) 유지. dev profile + 본 토글 양쪽 활성 시에만 30건 시드 진입.
app:
  security:
    internal:
      # SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_TOKEN legacy fallback
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_TOKEN:dev-only-token-replace}}
  partner-order:
    seed-test-data: ${SAMHAN_PARTNER_ORDER_SEED_TEST_DATA:false}
    # PR-H4b (Phase 12 Step 4b BE-C) — 거래처 주문 수정/삭제 요청 자동 만료 (시간 단위, default 24h).
    # PartnerOrderEditRequest.requestedAt + expires-hours < now() → status = EXPIRED 전환 (스케줄러 1h 주기).
    edit-request:
      expires-hours: ${SAMHAN_PARTNER_ORDER_EDIT_REQUEST_EXPIRES_HOURS:24}
  # PR-D Part 1 — BootstrapService 부팅 prefetch 시 시트 직접 read.
  # 매핑이 있는 cacheKey 만 시트 read; 매핑 없거나 read 실패 시 V2 seed fallback.
  # legacy estimate-app 과 동일 sheet ID. 운영에서는 BOOTSTRAP_SHEET_ID 로 override.
  bootstrap:
    sheet-id: ${BOOTSTRAP_SHEET_ID:1RJqO3jT-yJTi3NDBhL60o_cZWlVETGTU7UlvIKXuVNQ}
    sheet-prefetch-enabled: ${BOOTSTRAP_SHEET_PREFETCH_ENABLED:true}
    cache-refresh-minutes: ${BOOTSTRAP_CACHE_REFRESH_MINUTES:10}
    # cacheKey → A1 range 매핑. 거래처 발송 주문서 GAS 와 동일하게 base payload 와
    # *_단가인상 helper map 을 둘 다 읽는다. UI/계산 흐름은 그대로 두고 Notion 통신만 DB/API 로 치환한다.
    # `전표생성폼` 은 API 인증키/계정값이 있는 제어 폼이고, `전표업로드목록`/`종합견적서` 는 출력 양식이다.
    # config 는 DB seed fallback 만 사용하며, 존재하지 않는 `설정` tab 을 runtime read 하지 않는다.
    # SpEL Map literal — 빈 매핑 시 prefetch skip (V2 seed fallback only).
    range-map: "{homemulti:'홈멀티!A1:Z',singleSets:'싱글 세트!A1:Z',singleParts:'싱글 구성품!A1:Z',commercialMulti:'상업멀티!A1:Z',commercialParts:'상업멀티 구성!A1:Z',oldProducts:'구형!A1:Z',homeInc:'홈멀티_단가인상!A1:Z',commInc:'상업멀티_단가인상!A1:Z',singleInc:'싱글 세트_단가인상!A1:Z',singlePartsInc:'싱글 구성품_단가인상!A1:Z'}"

# PR-D Part 1 — Google Sheets 연동 (BootstrapService 부팅 prefetch + 5분 TTL 캐시).
# 시크릿: GOOGLE_SERVICE_ACCOUNT_KEY 환경변수 → JSON path. 본 코드 placeholder 만 보유 (.env 별도)
google:
  sheets:
    service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY:/etc/samhan/sa-key.json}
    cache-ttl-minutes: ${GOOGLE_SHEETS_CACHE_TTL_MIN:5}
    endpoint-override: ${GOOGLE_SHEETS_ENDPOINT_OVERRIDE:}

# samhan.* — partner-order-service 전용 옵션 (PartnerOrderProperties / OutboxProperties)
samhan:
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
  # legacy 호환 (Phase 11 cutover 시점 제거 가능)
  internal-token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_TOKEN:dev-only-token-replace}}
  draft:
    ttl-days: 30
    cleanup-cron: "0 0 3 * * *"
  outbox:
    cron: "0 */5 * * * *"
    max-retry-hours: 24
    # lease/batch 불변식: lease-seconds >= batch-size * 7(perRow connect2s+read5s). 10*7=70 < 120.
    lease-seconds: 120
    batch-size: 10
    # 복구 불가 4xx(INVALID_INPUT·CONFLICT)를 영구 실패로 확정하기 전 최소 시도 횟수. 1=즉시 fail-fast.
    permanent-error-min-attempts: 2
  partner-order:
    vendor:
      # PR-F2 + SP-04 재검증 — 종합견적서/주문서 Google Sheet 원본 tab modelCode → 단가 lookup.
      # `종합견적서` tab 자체는 출력 양식이므로 기본값은 range override 없이
      # ProductCatalogLookupClient 의 legacy tab 매핑(홈멀티/싱글/상업멀티/구형)을 사용한다.
      catalog-sheet-id: ${INTEGRATED_QUOTE_SHEET_ID:${BOOTSTRAP_SHEET_ID:1RJqO3jT-yJTi3NDBhL60o_cZWlVETGTU7UlvIKXuVNQ}}
      # 선택 override: modelCode/productName/unitPrice 3열 flat range 를 별도로 만든 경우만 지정.
      catalog-range: ${INTEGRATED_QUOTE_RANGE:}

# Resilience4J — slipServiceClient 가 가장 중요 (M5 §3 옵션 A)
resilience4j:
  circuitbreaker:
    instances:
      slipServiceClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      dcConfigClient:
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 20s
      productClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      inventoryClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      partnerAuthClient:
        slidingWindowSize: 10
        failureRateThreshold: 70
        waitDurationInOpenState: 20s
  timelimiter:
    instances:
      slipServiceClient:
        timeoutDuration: 5s
      dcConfigClient:
        timeoutDuration: 3s
      productClient:
        timeoutDuration: 3s
      inventoryClient:
        timeoutDuration: 3s
      partnerAuthClient:
        timeoutDuration: 3s

# 외부 서비스 base URL (Eureka 비활성 환경 fallback. 일반적으로는 lb:// + service-id 사용).
# Phase 8 2차 — full URL 표준 (SAMHAN_<SERVICE>_SERVICE_URL 우선, <NAME>_HOST legacy fallback (host only) — Phase 10 cutover 시점 단일화).
external:
  product-service: ${SAMHAN_PRODUCT_SERVICE_URL:http://${PRODUCT_HOST:product-service}:8084}
  inventory-service: ${SAMHAN_INVENTORY_SERVICE_URL:http://${INVENTORY_HOST:inventory-service}:8085}
  slip-service: ${SAMHAN_SLIP_SERVICE_URL:http://${SLIP_HOST:slip-service}:8086}
  dc-config-service: ${SAMHAN_DC_CONFIG_SERVICE_URL:http://${DC_CONFIG_HOST:dc-config-service}:8089}
  partner-auth-service: ${SAMHAN_PARTNER_AUTH_SERVICE_URL:http://${PARTNER_AUTH_HOST:partner-auth-service}:8091}

management:
  # CloudWatch 활성화 여부와 무관하게 Prometheus scrape registry/endpoint는 항상 유지한다.
  # Spring Boot 3.3의 exporter 조건이 management.defaults.metrics.export.enabled=false 환경에서도
  # Prometheus를 켜도록 새 명시 property를 사용한다.
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  metrics.export.cloudwatch:
    # 운영에서는 애플리케이션이 상태 게이지를 CloudWatch custom metric으로 직접 전송한다.
    # 로컬/테스트는 AWS 호출을 하지 않고 Prometheus scrape만 사용한다.
    enabled: ${CLOUDWATCH_METRICS_ENABLED:false}
    namespace: SamhanLogis/PartnerOrder
    step: 60s
    batch-size: 20

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:partner_order_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# PR-D Part 1 — local profile 에서는 시트 prefetch 비활성 (Service Account JSON 부재 가능)
app:
  bootstrap:
    sheet-prefetch-enabled: false
