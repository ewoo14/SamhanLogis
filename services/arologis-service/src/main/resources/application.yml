server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_AROLOGIS_PORT:8097}}

spring:
  application:
    name: arologis-service
  servlet:
    multipart:
      # PR-F1 BE-2 — 운송사 실배차 비교 multi-vendor .xlsx 업로드 (Plan 명시 50MB).
      # 단일 vendor 엑셀 ≤50MB, 전체 multipart 합산 ≤300MB (6 vendor 동시 가정).
      max-file-size: 50MB
      max-request-size: 300MB
  datasource:
    # 시크릿 placeholder — DB 자격증명은 반드시 환경변수로 주입.
    # Phase 10 W10-1 chained-default — SAMHAN_AROLOGIS_DB_* 우선, LEGACY_DB_* legacy fallback.
    url: jdbc:postgresql://${SAMHAN_AROLOGIS_DB_HOST:${LEGACY_DB_HOST:localhost}}:${SAMHAN_AROLOGIS_DB_PORT:${LEGACY_DB_PORT:5432}}/${SAMHAN_AROLOGIS_DB_NAME:${LEGACY_DB_NAME:arologis_db}}
    # W10-5 회고 — chained-default + samhan default fallback (env 미설정 시 connection refused 회피)
    username: ${SAMHAN_AROLOGIS_DB_USER:${LEGACY_DB_USER:${DB_USER}}}
    password: ${SAMHAN_AROLOGIS_DB_PASSWORD:${LEGACY_DB_PASSWORD:${DB_PASSWORD}}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

samhan:
  security:
    # gateway ingress attestation은 자체 JWT 및 internal RPC token과 별도 자격이다.
    # 값은 로컬 infrastructure/.env.local 또는 운영 secret manager에서만 주입한다.
    gateway-attestation: ${SAMHAN_GATEWAY_ATTESTATION:}
    permission:
      # 아로로지스는 auth-service accounts 를 사용하지 않는 독립 auth 이므로
      # Phase 1 account-based 전환에서 제외하고 기존 role_page_permissions 기반 enforcement 를 유지한다.
      enforcement-mode: role
  discovery:
    provider: ${SAMHAN_DISCOVERY_PROVIDER:eureka}
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
  partner-service:
    url: ${SAMHAN_PARTNER_SERVICE_URL:http://localhost:8095}
  user-service:
    url: ${SAMHAN_USER_SERVICE_URL:http://localhost:8083}
  slip-service:
    url: ${SAMHAN_SLIP_SERVICE_URL:http://localhost:8086}
  notification-service:
    url: ${SAMHAN_NOTIFICATION_SERVICE_URL:http://localhost:8093}
  arologis:
    # Phase 10 W10-1 — 4 client skeleton-mode 토글. true (default) 시 외부 호출 회피.
    # W10-2 시점 인성데이타 vendor 통합 + W10-4 시점 slip 통합 시점에 false 활성.
    client:
      skeleton-mode: ${SAMHAN_AROLOGIS_CLIENT_SKELETON_MODE:true}
    # 2026-05-14 — 아로로지스 독립 분리 (자체 JWT 발급/검증).
    # secret 64+ char 의무 (HS256 안전성). prod/production 은 반드시 SAMHAN_AROLOGIS_JWT_SECRET 환경변수 주입.
    jwt:
      secret: ${SAMHAN_AROLOGIS_JWT_SECRET}
      access-expiry-seconds: ${SAMHAN_AROLOGIS_JWT_ACCESS_EXPIRY_SECONDS:3600}
      refresh-expiry-seconds: ${SAMHAN_AROLOGIS_JWT_REFRESH_EXPIRY_SECONDS:2592000}
      issuer: ${SAMHAN_AROLOGIS_JWT_ISSUER:arologis-service}
    matcher:
      # mock (W10-1 default) | insung-quick (W10-2 통합 시점)
      provider: ${SAMHAN_AROLOGIS_MATCHER_PROVIDER:mock}
      insung-quick:
        api-url: ${SAMHAN_INSUNG_QUICK_API_URL:}
        api-key: ${SAMHAN_INSUNG_QUICK_API_KEY:}
        partner-id: ${SAMHAN_INSUNG_QUICK_PARTNER_ID:}
        # sandbox-mode=true (default) — 실 API 미호출. prod cutover 시 false 전환.
        sandbox-mode: ${SAMHAN_INSUNG_QUICK_SANDBOX_MODE:true}
        # HMAC SHA-256 webhook 검증 secret. 빈 값 = sandbox-mode 우회.
        webhook-secret: ${SAMHAN_INSUNG_QUICK_WEBHOOK_SECRET:}
        # API 호출 타임아웃 (ms). 기본 5000ms.
        request-timeout-ms: ${SAMHAN_INSUNG_QUICK_TIMEOUT_MS:5000}
      notify:
        # RESERVED(현재 미사용) — vendor-채널 라우팅 설계 예약 필드. DispatchService 는 현재
        # dispatch-channel/invite-channel 값을 읽지 않고 배차 매칭 알림을 aligo 로 하드코딩
        # 발송한다. 인성데이타 알림톡 등 실제 vendor-채널 라우팅 구현(W10-2) 전까지 삭제 금지
        # (PR #816 ③-B 리뷰 FIX 3). 하드코딩 현황과 일치시키기 위해 기본값도 aligo 로 통일.
        dispatch-channel: ${SAMHAN_AROLOGIS_NOTIFY_DISPATCH_CHANNEL:aligo}
        # 기사 어플 invite 채널 — 위와 동일하게 RESERVED. 기본 aligo.
        invite-channel: ${SAMHAN_AROLOGIS_NOTIFY_INVITE_CHANNEL:aligo}
      gps:
        priority: ${SAMHAN_AROLOGIS_GPS_PRIORITY:insung-lbs,app-gps,manual}
        stale-threshold-ms: ${SAMHAN_AROLOGIS_GPS_STALE_THRESHOLD_MS:60000}
    location-cleanup:
      retention-days: ${SAMHAN_AROLOGIS_LOCATION_RETENTION_DAYS:30}
    # Phase F (D-DF-10) — 사본 PNG 디스크 저장 경로. Phase 11 cutover 시 S3 키로 갈아탐.
    signature-copy:
      dir: ${AROLOGIS_SIGNATURE_COPY_DIR:/var/lib/arologis/signature-copies}
    # Phase F (D-DF-06) — Playwright Chromium 출고전표 사본 PNG 합성 설정.
    playwright:
      copy:
        # print-renderer 정적 빌드 file:// 경로 (Docker COPY 동봉).
        base-url: ${AROLOGIS_PRINT_RENDERER_URL:file:///app/print-renderer/index.html}
        # 단일 페이지 렌더 timeout (Chromium goto + load 완료까지) ms.
        timeout-ms: ${AROLOGIS_PLAYWRIGHT_TIMEOUT_MS:8000}
        viewport-width: ${AROLOGIS_PLAYWRIGHT_VIEWPORT_W:600}
        viewport-height: ${AROLOGIS_PLAYWRIGHT_VIEWPORT_H:850}

app:
  security:
    internal:
      # Phase 10 — SAMHAN_INTERNAL_TOKEN 표준 (chained-default).
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:CHANGE_ME_LOCAL_ONLY}}
  # Stage 3 local-test seed toggle (DriverSeeder + DispatchSeeder).
  # 운영/CI 에서는 반드시 false (또는 미설정) 유지. dev profile + 본 토글 양쪽 활성 시에만 시드 진입.
  arologis:
    seed-test-data: ${SAMHAN_AROLOGIS_SEED_TEST_DATA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:arologis_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
