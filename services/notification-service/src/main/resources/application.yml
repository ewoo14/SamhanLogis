server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_NOTIFICATION_PORT:8093}}

spring:
  application:
    name: notification-service
  datasource:
    # 시크릿 placeholder — DB 자격증명은 반드시 환경변수로 주입.
    # default 값은 로컬 docker-compose 와의 호환을 위한 자리 표시자이며 실제 환경에서는 override 필수.
    # Phase 8 2차 chained-default — SAMHAN_NOTIFICATION_DB_* 우선, LEGACY_DB_* legacy fallback (Phase 10 cutover 시점 단일화).
    url: jdbc:postgresql://${SAMHAN_NOTIFICATION_DB_HOST:${LEGACY_DB_HOST:localhost}}:${SAMHAN_NOTIFICATION_DB_PORT:${LEGACY_DB_PORT:5432}}/${SAMHAN_NOTIFICATION_DB_NAME:${LEGACY_DB_NAME:notification_db}}
    # W10-5 회고 — chained-default + samhan default fallback (env 미설정 시 connection refused 회피)
    username: ${SAMHAN_NOTIFICATION_DB_USER:${LEGACY_DB_USER:${DB_USER:samhan}}}
    password: ${SAMHAN_NOTIFICATION_DB_PASSWORD:${LEGACY_DB_PASSWORD:${DB_PASSWORD:samhan_dev_pw}}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
  cache:
    type: caffeine

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Phase 8 2차 — ServiceDiscoveryClient provider toggle. eureka default (Phase 10 시점 aws-cloud-map 으로 전환).
samhan:
  discovery:
    provider: ${SAMHAN_DISCOVERY_PROVIDER:eureka}
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
  user-service:
    url: ${SAMHAN_USER_SERVICE_URL:http://localhost:8083}
  user-client:
    # OPEN = fail-soft (local/default), STRICT = fail-fast (prod compose cutover).
    fail-mode: ${SAMHAN_USER_CLIENT_FAIL_MODE:OPEN}
  # PR-E 진입 전 선행 BE-E — RestClientPartnerLookupClient 활성. partner-service base URL.
  partner-service:
    url: ${SAMHAN_PARTNER_SERVICE_URL:http://localhost:8095}
  slip-service:
    url: ${SAMHAN_SLIP_SERVICE_URL:http://localhost:8084}
  notification:
    aligo:
      api-url: ${SAMHAN_ALIGO_API_URL:https://apis.aligo.in/send/}
      key: ${SAMHAN_ALIGO_KEY:CHANGE_ME_LOCAL_ONLY}
      userid: ${SAMHAN_ALIGO_USERID:CHANGE_ME_LOCAL_ONLY}
      sender: ${SAMHAN_ALIGO_SENDER:CHANGE_ME_LOCAL_ONLY}
    fcm:
      project-id: ${SAMHAN_FCM_PROJECT_ID:CHANGE_ME_LOCAL_ONLY}
      credentials-path: ${SAMHAN_FCM_CREDENTIALS_PATH:CHANGE_ME_LOCAL_ONLY}
      credentials-base64: ${SAMHAN_FCM_CREDENTIALS_BASE64:CHANGE_ME_LOCAL_ONLY}
    # P0-2 슬라이스 1 — 비밀번호 재설정 이메일 발송 (SmtpEmailAdapter 우선, SES adapter 는 Phase 11 cutover 시점).
    # 매뉴얼 출처: docs/manual/06-트러블슈팅/01-로그인-실패.md §1-3 (P0-2 정식 fix).
    # username/password 미설정 (local dev) 시 SmtpEmailAdapter 가 NoOp 동작 — 본문/수신자 로그만 출력.
    smtp:
      host: ${SMTP_HOST:smtp.cafe24.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:noreply@samhan-air.com}
      starttls: ${SMTP_STARTTLS:true}
    # Phase 9 W3 — UserClient bulk verify Caffeine cache TTL (BE backlog #4 채택)
    user-cache:
      ttl-seconds: ${SAMHAN_USER_CACHE_TTL:60}
      max-size: ${SAMHAN_USER_CACHE_MAX:10000}
    # post-W5 backlog cleanup (Q-W3-1 채택, D-P9-21) — 발송 재시도 최대 횟수.
    # NotificationService.retry() 시점에 본 임계 초과 시 영구 FAILED 처리 (DEAD_LETTER 의미).
    retry:
      max-attempts: ${SAMHAN_NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
    # PR-E 진입 전 선행 BE-E — RestClientPartnerLookupClient 토글. default true.
    # false 시 RestClient 빈 비활성 → NoopPartnerLookupClient (@Profile("!test")) 만 활성.
    partner-lookup:
      enabled: ${SAMHAN_NOTIFICATION_PARTNER_LOOKUP_ENABLED:true}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 표준, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화).
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:dev-internal-token-change-me}}
  # Stage 4 local-test seed (NotificationHistorySeeder) toggle. dev profile + 본 toggle 모두 true 인 경우만 seed.
  # 운영 / staging 데이터 오염 방지 — default false. 50건 발송 이력 + 40건 attempt log.
  notification:
    seed-test-data: ${SAMHAN_NOTIFICATION_SEED_TEST_DATA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:notification_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
