/*
 * services:inventory-service — Warehouse + StockLot + StockBalance + StockMovement +
 * StockTransfer 집합 (plan §3 Inventory first slice).
 *
 * Owns the `warehouses`, `stock_lots`, `stock_balances`, `stock_movements`,
 * `stock_transfers`, `stock_transfer_lines` tables in PostgreSQL (`inventory_db`).
 *
 * Product 마스터 검증을 위해 product-service 의 internal endpoint 를 호출 — 공유
 * {@code X-Internal-Token} 으로 서비스 간 신뢰. RestClient + Spring Cloud
 * LoadBalancer 패턴은 user-service 와 동일.
 *
 * Flyway 는 day-one 부터 활성 — src/main/resources/db/migration 참조.
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // springdoc-openapi — /v3/api-docs (JSON) + /swagger-ui.html (대화형 UI) 자동 노출
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // MinIO (S3 호환) — 검수 사진 첨부 (inspection-attachments bucket) 객체 스토리지.
    // app.inventory.minio.enabled=true 일 때만 활성화 (default false → NoopInspectionAttachmentStorage fallback).
    // Phase 11 AWS 마이그레이션 시 endpoint/credentials 만 S3 값으로 교체.
    implementation 'io.minio:minio:8.5.12'

    // Apache POI — DPS 입고 비교 endpoint 의 .xlsx parse + template 다운로드 (PR-E1 BE-2)
    implementation 'org.apache.poi:poi-ooxml:5.4.0'

    implementation project(':shared:common')
    implementation project(':shared:ecount-io')
    implementation project(':shared:security')
    implementation project(':shared:notification-publisher')
    // PR-H4b (Phase 12 Step 4b) — shared:realtime-abstraction module 활성.
    // InventoryAudit / Stock 변경 시 audit overlay + SSE broadcast + Audit COMPLETED 후 잠금.
    implementation project(':shared:realtime-abstraction')

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'inventory-service.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'samhan.security.gateway-attestation-enforcement', 'false'
}
