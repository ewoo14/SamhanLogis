server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_INVENTORY_PORT:8085}}

spring:
  application:
    name: inventory-service
  servlet:
    multipart:
      # P1 검수 사진 첨부 — 단일 파일 ≤5MB (이미지 전용, PDF 제외)
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

samhan:
  security:
    department:
      enabled: true
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:CHANGE_ME_LOCAL_ONLY}}
  seed-test-data: ${SAMHAN_SEED_TEST_DATA:false}
  inventory:
    # feature/local-test-setup Stage 2 — StockBalance 200건 시드 (100 product × 2 warehouse).
    # dev profile + true 시에만 활성. CI/prod 기본 OFF (idempotent — 안전 재실행).
    # P1 검수 사진 첨부 — MinIO bucket `samhan-attachments` (단일 bucket 통합 전략, setup-minio-buckets.ps1 동기화).
    # default false → NoopInspectionAttachmentStorage fallback (CI / 단위 테스트 안전).
    # DevOps 가 별도 dispatch 로 bucket 생성 후 활성화.
    # presigned-expiry-seconds: 300 (5분 — 보안 정책 준수, SAMHAN_S3_PRESIGNED_EXPIRY 재사용 가능).
    minio:
      enabled: ${SAMHAN_INVENTORY_MINIO_ENABLED:false}
      endpoint: ${SAMHAN_INVENTORY_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${SAMHAN_INVENTORY_MINIO_ACCESS_KEY:${SAMHAN_S3_ACCESS_KEY}}
      secret-key: ${SAMHAN_INVENTORY_MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
      bucket: ${SAMHAN_INVENTORY_MINIO_BUCKET:samhan-attachments}
      presigned-expiry-seconds: ${SAMHAN_S3_PRESIGNED_EXPIRY:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:inventory_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
