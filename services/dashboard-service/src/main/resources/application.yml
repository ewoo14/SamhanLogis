server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_DASHBOARD_PORT:8094}}

spring:
  application:
    name: dashboard-service
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  datasource:
    # 시크릿 placeholder — DB 자격증명은 반드시 환경변수로 주입.
    # default 값은 로컬 docker-compose 와의 호환을 위한 자리 표시자이며 실제 환경에서는 override 필수.
    # Phase 8 2차 chained-default — SAMHAN_DASHBOARD_DB_* 우선, LEGACY_DB_* legacy fallback (Phase 10 cutover 시점 단일화).
    url: jdbc:postgresql://${SAMHAN_DASHBOARD_DB_HOST:${LEGACY_DB_HOST:localhost}}:${SAMHAN_DASHBOARD_DB_PORT:${LEGACY_DB_PORT:5432}}/${SAMHAN_DASHBOARD_DB_NAME:${LEGACY_DB_NAME:dashboard_db}}
    # 통합테스트·로컬 실행 자격은 환경변수로만 주입한다. 미설정 시 조용한 기본 자격으로 우회하지 않는다.
    username: ${SAMHAN_DASHBOARD_DB_USER:${LEGACY_DB_USER:${DB_USER}}}
    password: ${SAMHAN_DASHBOARD_DB_PASSWORD:${LEGACY_DB_PASSWORD:${DB_PASSWORD}}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
  cache:
    type: caffeine

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Phase 8 2차 — ServiceDiscoveryClient provider toggle. eureka default (Phase 10 시점 aws-cloud-map 으로 전환).
samhan:
  audit:
    publisher:
      enabled: ${SAMHAN_AUDIT_PUBLISHER_ENABLED:true}
    request-capture:
      enabled: ${SAMHAN_AUDIT_REQUEST_CAPTURE_ENABLED:true}
  discovery:
    provider: ${SAMHAN_DISCOVERY_PROVIDER:eureka}
  # Phase 9 W4 — DevOps W3 backlog #4 채택 (D-P9-12) — Caffeine 일관 유지 + Redis 토글 약속.
  cache:
    provider: ${SAMHAN_CACHE_PROVIDER:caffeine}  # caffeine|redis
    kpi:
      ttl-seconds: ${SAMHAN_DASHBOARD_KPI_CACHE_TTL:60}
      max-size: ${SAMHAN_DASHBOARD_KPI_CACHE_MAX:5000}
  inventory-service:
    url: ${SAMHAN_INVENTORY_SERVICE_URL:http://localhost:8085}
  accounting-service:
    url: ${SAMHAN_ACCOUNTING_SERVICE_URL:http://localhost:8087}
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
  partner-order-service:
    url: ${SAMHAN_PARTNER_ORDER_SERVICE_URL:http://localhost:8088}
  partner-service:
    url: ${SAMHAN_PARTNER_SERVICE_URL:http://localhost:8095}
  dashboard:
    refresh:
      # Materialized view REFRESH 주기 (분 단위). 기본 5 — D-P9-13.
      interval-minutes: ${SAMHAN_DASHBOARD_REFRESH_INTERVAL:5}
    # Phase 9 W4 후속 fix (BE 의견 2 채택) — 4 외부 client skeleton-mode 토글.
    # true (default, W4 skeleton) — 4 client (Inventory/Accounting/PartnerOrder/Partner) 의 fetch 가
    #   외부 호출을 회피하고 default (Optional.empty / BigDecimal.ZERO / 0) 즉시 반환.
    # false — Phase 10 cutover 시점 활성. 외부 호출 + 응답 파싱 활성 (UnsupportedOperationException 회피용
    #   본문 파싱 미구현 client 는 Phase 10 BE 슬라이스에서 구현 의무).
    client:
      skeleton-mode: ${SAMHAN_DASHBOARD_CLIENT_SKELETON_MODE:true}
    # Phase 9 W4 후속 fix (QA Q-W4-2 채택) — partnerCode → UUID resolve cache TTL.
    partner-resolve:
      cache-ttl-seconds: ${SAMHAN_DASHBOARD_PARTNER_RESOLVE_TTL:300}
      cache-max-size: ${SAMHAN_DASHBOARD_PARTNER_RESOLVE_MAX:1000}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 표준, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화).
      token: ${SAMHAN_INTERNAL_TOKEN}
      # 일반 서비스의 기존 계약: 토큰 누락은 SecurityConfig의 /internal/** authorization에서 403.
      allow-missing-token: true
  # Stage 4 local-test seed (DashboardSnapshotSeeder) toggle. dev profile + 본 toggle 모두 true 인 경우만 seed.
  # 운영 / staging 데이터 오염 방지 — default false. KPI 135 + 실시간재고 200 + 매출집계 150 + MV refresh.
  dashboard:
    seed-test-data: ${SAMHAN_DASHBOARD_SEED_TEST_DATA:false}
  notice:
    minio:
      enabled: ${SAMHAN_NOTICE_MINIO_ENABLED:false}
      endpoint: ${SAMHAN_NOTICE_MINIO_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
      access-key: ${SAMHAN_NOTICE_MINIO_ACCESS_KEY:${SAMHAN_S3_ACCESS_KEY}}
      secret-key: ${SAMHAN_NOTICE_MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
      bucket: ${SAMHAN_NOTICE_MINIO_BUCKET:samhan-attachments}
      presigned-expiry-seconds: ${SAMHAN_NOTICE_MINIO_PRESIGNED_EXPIRY:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:dashboard_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
