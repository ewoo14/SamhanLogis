/*
 * services:dashboard-service — Phase 9 W4
 *
 * KPI 일/주/월 스냅샷 + 실시간 재고 캐시 + 매출 집계 도메인. ServiceDiscoveryClient 네 번째 소비자
 * (W1 partner / W2 groupware / W3 notification → W4 dashboard).
 *
 * 외부 의존성 = 4 service:
 *   - inventory-service (8085) — 실시간 재고 lookup
 *   - accounting-service (8087) — 매출 데이터 집계
 *   - partner-order-service (8088) — 주문 건수 집계
 *   - partner-service (8095, W1) — 거래처 정보 lookup
 *
 * 주요 책임:
 *   - KpiSnapshot (KPI 일/주/월 스냅샷)
 *   - RealTimeStock (실시간 재고 캐시)
 *   - SalesAggregate (매출 집계)
 *   - 2 PostgreSQL materialized view (mv_realtime_stock_summary / mv_sales_daily_summary)
 *   - 5분 간격 scheduled REFRESH MATERIALIZED VIEW CONCURRENTLY (admin trigger 가능)
 *   - Internal endpoint (X-Internal-Token, KPI lookup 용)
 *   - Admin endpoint (KPI / 실시간 재고 / 매출 / refresh)
 *   - Caffeine cache (KPI 응답 60s TTL — DevOps W3 backlog #4 채택, Phase 10 시점 Redis 토글 약속)
 *
 * Owns the `dashboard_db` schema in PostgreSQL.
 * Flyway 는 day-one 부터 활성 — src/main/resources/db/migration 참조.
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Phase 9 W4 — Caffeine cache (KPI 응답 60s TTL, DevOps W3 backlog #4 채택)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Phase 9 W4 후속 fix (DevOps DV-W4-3) — multi-instance REFRESH MATERIALIZED VIEW race 가드.
    // ShedLock 으로 분산 lock 획득 (PostgreSQL JDBC provider). single-instance 환경에서도 안전.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.13.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.13.0'

    // springdoc-openapi — /v3/api-docs (JSON) + /swagger-ui.html (대화형 UI) 자동 노출
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // DEV-2 팝업공지 이미지 — slip-service 첨부와 동일한 MinIO(S3 호환) storage 패턴.
    // app.notice.minio.enabled=true 일 때만 실 MinIO, default false → Noop fallback.
    implementation 'io.minio:minio:8.5.12'

    implementation project(':shared:common')
    implementation project(':shared:security')
    // Phase 8 2차 — vendor 추상화 wrapper (provider=eureka default, Phase 10 시점 aws-cloud-map 토글)
    implementation project(':shared:discovery-abstraction')
    // Phase 9 W4 — UserVerifier 표준 abstraction (W3 backlog #1 채택)
    implementation project(':shared:user-client-abstraction')
    // PR-H4b (Phase 12 Step 4b) BE-E — shared:realtime-abstraction module 의존 추가.
    // dashboard-service 는 read-only 위주 (KPI/매출/실시간재고 집계) — 본 PR 범위는 broker bean 만
    // 활성. 향후 PR 에서 다른 service (slip-service / inventory-service 등) 의 SSE 이벤트 구독 →
    // 대시보드 위젯 실시간 갱신 가능. 본 service 자체의 audit_log/edit_request 도메인 entity 는 등록 X
    // (read-only 라 mutation 가드 불필요).
    implementation project(':shared:realtime-abstraction')
    implementation project(':shared:audit-publisher')

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:rabbitmq:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'dashboard-service.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
