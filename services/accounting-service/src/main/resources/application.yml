server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_ACCOUNTING_PORT:8087}}

spring:
  application:
    name: accounting-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:accounting_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:CHANGE_ME_LOCAL_ONLY}}
      # MIG-21 — 재무 migration metrics 는 dashboard-service 내부 scrape 만 허용.
      path-prefix: /actuator/prometheus
      allow-missing-token: false
  # Stage 4 local-test seed (JournalSeeder) toggle. dev profile + 본 toggle 모두 true 인 경우만 50건 seed.
  # 운영 / staging 데이터 오염 방지 — default false. 복식부기 invariant 강제 (sum(debit)==sum(credit) per journal).
  accounting:
    seed-test-data: ${SAMHAN_ACCOUNTING_SEED_TEST_DATA:false}
  services:
    product-service:
      base-url: ${PRODUCT_SERVICE_BASE_URL:http://product-service}
  # 세금계산서 인쇄용 공급자 (우리 회사) 정보 — P0-4
  company:
    name: ${SAMHAN_COMPANY_NAME:(주)삼한공조시스템}
    business-number: ${SAMHAN_COMPANY_BUSINESS_NUMBER:000-00-00000}
    ceo: ${SAMHAN_COMPANY_CEO:김미선}
    address: ${SAMHAN_COMPANY_ADDRESS:서울특별시}
    business-type: ${SAMHAN_COMPANY_BUSINESS_TYPE:도소매}
    business-item: ${SAMHAN_COMPANY_BUSINESS_ITEM:공조기기}

# e-Tax NTS 홈택스 실 발행 설정 (SP-09-1)
# submit-method: DRY_RUN (기본, Phase 11 이전) | NTS (실 발행, Phase 11 sandbox 연동 시 변경)
# nts-api-key: 운영 PC .env 또는 AWS SSM 에서 주입 (코드 내 하드코딩 금지)
# nts-base-url: NTS 홈택스 API endpoint (Phase 11 sandbox: https://sandbox.etax.nts.go.kr)
etax:
  submit-method: ${ETAX_SUBMIT_METHOD:DRY_RUN}
  nts-api-key: ${NTS_API_KEY:}
  nts-base-url: ${NTS_BASE_URL:}

# KFTC 오픈뱅킹 입금 자동 매칭 설정 (SP-09-4)
# submit-method: DRY_RUN (기본, Phase 11 이전) | KFTC (실 API, Phase 11 sandbox 연동 시 변경)
# api-key / client-id / client-secret: 운영 PC .env 또는 AWS SSM 에서 주입 (코드 내 하드코딩 금지)
# base-url: KFTC 오픈뱅킹 API endpoint (Phase 11 sandbox: https://testapi.openbanking.or.kr)
kftc:
  submit-method: ${KFTC_SUBMIT_METHOD:DRY_RUN}
  api-key: ${KFTC_API_KEY:}
  client-id: ${KFTC_CLIENT_ID:}
  client-secret: ${KFTC_CLIENT_SECRET:}
  base-url: ${KFTC_BASE_URL:https://testapi.openbanking.or.kr}

# CODEF 은행·카드 거래내역 연동 설정 (BC1)
# submit-method: DRY_RUN (기본, Phase 11 이전) | CODEF (실 API, 회사 명의 계약·키 발급 후 변경)
# api-key / client-id / client-secret / public-key: 운영 PC .env 또는 AWS SSM 에서 주입 (코드 내 하드코딩 금지)
# base-url: CODEF API endpoint
codef:
  submit-method: ${CODEF_SUBMIT_METHOD:DRY_RUN}
  api-key: ${CODEF_API_KEY:}
  client-id: ${CODEF_CLIENT_ID:}
  client-secret: ${CODEF_CLIENT_SECRET:}
  public-key: ${CODEF_PUBLIC_KEY:}
  base-url: ${CODEF_BASE_URL:https://api.codef.io}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:accounting_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
