/*
 * services:accounting-service — 회계 서비스 (Phase 4 Slice A — A1+A2 통합 MVP).
 *
 * Owns the `chart_of_accounts`, `journals`, `journal_lines`, `journal_number_sequences`
 * tables in PostgreSQL (`accounting_db`). 한국 일반기업회계기준 표준 계정과목 시드 + 분개장
 * 도메인 + 시산표 service-layer 집계.
 *
 * Slice A 범위 (Plan §6):
 *   - 골격 + Flyway V1 시드 (50+ 계정과목)
 *   - Journal/JournalLine 도메인 (DRAFT → POSTED → REVERSED)
 *   - Manual 분개 입력 + post/reverse + 시산표
 *
 * Slice A 미포함 (deferred):
 *   - A3: slip-service 자동 분개 (RestClient 미사용 → ProductClient/InventoryClient 의존성 0)
 *   - A4: AR/AP 만기 관리 + Partner 연계
 *
 * Flyway 는 day-one 부터 활성 — src/main/resources/db/migration 참조.
 * RabbitMQ 미포함 (Plan §1).
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.codef.api:easycodef-java:1.0.6'

    // springdoc-openapi — /v3/api-docs (JSON) + /swagger-ui.html (대화형 UI) 자동 노출
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    implementation project(':shared:common')
    implementation project(':shared:ecount-io')
    implementation project(':shared:collab-core')
    implementation project(':shared:security')
    // PR-H4b (Phase 12 Step 4b) — shared:realtime-abstraction 활용. SSE broker / audit overlay /
    // edit-request lock 정책 통합. accounting-service 의 TaxInvoice / Journal / AccountingPeriod
    // mutation 시 audit_log 1행 + SSE broadcast + 잠금 가드 (ISSUED/POSTED/CLOSED 후).
    implementation project(':shared:realtime-abstraction')
    implementation project(':shared:notification-publisher')

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'accounting-service.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'samhan.security.gateway-attestation-enforcement', System.getProperty('samhan.security.gateway-attestation-enforcement', 'true')
    // TaxInvoiceBatchEndToEndIT 의 POI XSSFWorkbook 생성이 CI 기본 test worker heap 에서 OOM 될 수 있어 상향.
    // slip-service 의 2g 상향 컨벤션을 따르되 accounting+partner CI 그룹의 7GB 러너 예산을 남기기 위해 1536m 로 제한한다.
    maxHeapSize = '1536m'
}
