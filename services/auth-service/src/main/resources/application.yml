server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_AUTH_PORT:8081}}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SAMHAN_SMTP_HOST:localhost}
    port: ${SAMHAN_SMTP_PORT:25}
    username: ${SAMHAN_SMTP_USERNAME:}
    password: ${SAMHAN_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SAMHAN_SMTP_AUTH:false}
          starttls:
            enable: ${SAMHAN_SMTP_STARTTLS:false}

samhan:
  password-reset:
    from-email: ${SAMHAN_PASSWORD_RESET_FROM_EMAIL:no-reply@samhanair.com}
    token-ttl-minutes: 10
    rate-limit-per-minute: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    jwt:
      # Phase 8 2차 — SAMHAN_JWT_SECRET 우선, JWT_SECRET legacy fallback (Phase 10 cutover 시점 단일화)
      secret: ${SAMHAN_JWT_SECRET:${JWT_SECRET:dev-secret-change-me-in-production-32bytes-min!}}
      ttl-seconds: 3600
    cookie:
      secure: ${COOKIE_SECURE:false}
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:CHANGE_ME_LOCAL_ONLY}}
      # W10-4 (PR #99) DV-3 — auth-service 만 /auth/internal/ prefix + ROLE_INTERNAL + 토큰 누락 시 즉시 401
      path-prefix: /auth/internal/
      role: INTERNAL
      allow-missing-token: false

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}
  api-url: ${ANTHROPIC_API_URL:https://api.anthropic.com/v1/messages}

claude:
  virtual-agent:
    enabled: ${CLAUDE_VIRTUAL_AGENT_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:auth_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
