server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_PARTNER_AUTH_PORT:8091}}

spring:
  application:
    name: partner-auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:partner_auth_db}
    username: ${DB_USER:samhan}
    # ggignore - dev-only placeholder, env var override required in prod
    password: ${DB_PASSWORD:dev-pw-change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

samhan:
  audit:
    trusted-gateway-addresses: ${SAMHAN_AUDIT_TRUSTED_GATEWAY_ADDRESSES:private}
    publisher:
      enabled: true
  jwt:
    # Phase 8 2차 — SAMHAN_JWT_SECRET 우선, JWT_SECRET legacy fallback (Phase 10 cutover 시점 단일화)
    secret: ${SAMHAN_JWT_SECRET:${JWT_SECRET:dev-only-partner-jwt-secret-replace-in-prod-32bytes-min!!}}
    expiration-hours: 8
  # PR #462 Round C #4 — 주문서 승인 controller @RequirePermission 동적 RBAC 가드용 auth-service 호출 (13 service 표준).
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}
  dc-config:
    # Phase 8 2차 — full URL 표준 (SAMHAN_DC_CONFIG_SERVICE_URL 우선, DC_CONFIG_URL legacy fallback)
    url: ${SAMHAN_DC_CONFIG_SERVICE_URL:${DC_CONFIG_URL:http://dc-config-service:8089}}
    timeout-ms: 3000
    # 3d backlog — dc-config-service /internal/** 가드 통과용 X-Internal-Token (dc-config 의 SAMHAN_INTERNAL_TOKEN 와 동일 값)
    internal-token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:dev-only-token-replace}}
  partner-activity:
    order-url: ${SAMHAN_PARTNER_ORDER_SERVICE_URL:http://partner-order-service:8088}
    slip-url: ${SAMHAN_SLIP_SERVICE_URL:http://slip-service:8086}
    internal-token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:dev-internal-token-change-me}}

# PR #462 Round C #4 — DefaultDynamicPermissionClient 가 auth-service /auth/internal/** 호출 시 보내는 X-Internal-Token.
# auth-service 의 SAMHAN_INTERNAL_TOKEN 와 동일 값이어야 한다 (auth-service 는 allow-missing-token=false → 토큰 누락/불일치 시 401).
# 재리뷰 #4/#11/#12 — dev 기본값을 13 service 표준 'dev-internal-token-change-me' 로 통일한다(= auth-service default
#   + InternalTokenGuard.DEV_DEFAULT + docker-compose SAMHAN_INTERNAL_TOKEN). 이전 'dev-only-token-replace' 는
#   ① auth-service default 와 불일치 → env 미주입 로컬부팅 시 권한조회 401, ② InternalTokenGuard 의 prod 부팅 차단가드가
#   무력화(DEV_DEFAULT 불일치로 isDevDefault=false)되는 두 문제가 있었다. prod 는 SAMHAN_INTERNAL_TOKEN env 주입이 기성.
app:
  security:
    internal:
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:dev-internal-token-change-me}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:partner_auth_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
