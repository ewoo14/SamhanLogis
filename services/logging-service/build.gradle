/*
 * services:logging-service — central audit log sink (Phase 1, plan §3.7).
 *
 * Consumes audit events from RabbitMQ exchange `samhan.audit.exchange`
 * (queue `samhan.audit.queue`, routing pattern `audit.#`) and persists
 * them into Elasticsearch index `samhan-audit-logs`. Exposes REST search
 * endpoints for MASTER / MANAGER (role enforcement at the gateway).
 *
 * NOTE: testcontainers BOM is intentionally not imported here — versions
 * are intentionally left off so they can be wired in later (or aligned with
 * a project-wide testcontainers BOM when one is introduced).
 */

plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    implementation project(':shared:common')
    implementation project(':shared:security')
    // PR-H4b (Phase 12 Step 4b) BE-E — shared:realtime-abstraction module 의존 추가.
    // logging-service 는 audit log sink (Elasticsearch) 역할이라 본 PR 범위는 broker bean 만 활성
    // (다른 service 의 SSE 이벤트를 본 service 가 소비하는 향후 시나리오 대비).
    // audit_log/edit_request 도메인 entity 는 본 service 에서는 등록 X (Postgres JPA 미사용).
    // shared module 이 transitive 로 spring-boot-starter-data-jpa 를 가져오지만 application.yml
    // 에서 DataSource/JPA autoconfig 를 명시 exclude → 정상 startup.
    implementation project(':shared:realtime-abstraction')
    implementation project(':shared:audit-publisher')

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:elasticsearch'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
    archiveFileName = 'logging-service.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'samhan.security.gateway-attestation-enforcement', System.getProperty('samhan.security.gateway-attestation-enforcement', 'true')
}
