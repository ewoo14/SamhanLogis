server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_LOGGING_PORT:8082}}

spring:
  application:
    name: logging-service
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:samhan}
    password: ${RABBIT_PASSWORD:samhan_dev_pw}
  # PR-H4b BE-E — shared:realtime-abstraction module 이 transitive 로 starter-data-jpa 를 가져오지만
  # logging-service 는 Postgres JPA 를 사용하지 않음 (audit sink = Elasticsearch). DataSource/JPA
  # autoconfig 를 명시 exclude 하여 startup 시 DB connection 시도 차단.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

samhan:
  audit:
    # 잠정 운영 초기값. 법적/업무 보존기간 확정 전에는 이 설정만 변경한다.
    retention:
      change-retention: ${SAMHAN_AUDIT_RETENTION_CHANGE:8760h}
      failure-retention: ${SAMHAN_AUDIT_RETENTION_FAILURE:8760h}
      read-retention: ${SAMHAN_AUDIT_RETENTION_READ:720h}
    rabbit:
      audit-queue-max-length: ${SAMHAN_AUDIT_QUEUE_MAX_LENGTH:10000}
      audit-queue-message-ttl-ms: ${SAMHAN_AUDIT_QUEUE_MESSAGE_TTL_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
# `local` profile is for offline code editing only.
# Elasticsearch + RabbitMQ + Eureka autoconfig are disabled so the app can
# boot without those services running. Integration tests still need the
# real services (or testcontainers).
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      # PR-H4b BE-E — shared:realtime-abstraction transitive JPA exclude (default 프로필과 일관)
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
