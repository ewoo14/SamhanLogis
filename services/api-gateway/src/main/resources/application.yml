# SamhanLogis — API Gateway configuration.
#
# Reactive Spring Cloud Gateway. All ingress traffic enters here; routes are
# matched by path prefix and proxied to the corresponding Eureka-registered
# service via load-balancer URIs (lb://).
#
# Each protected route applies the custom `JwtAuthentication` filter — see
# `JwtAuthenticationGatewayFilterFactory`. The auth-service login endpoint
# is intentionally exempt so users can obtain a token in the first place.
server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_API_GATEWAY_PORT:8080}}

spring:
  application:
    name: api-gateway
  codec:
    # 파일 업로드(예: 그룹웨어 결재 첨부 ≤10MB) WebFlux 메모리 버퍼 상향 — 기본 256KB 초과 시 413/DataBufferLimit.
    max-in-memory-size: 12MB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # PR-H1 (Phase 12 Step 1) — slip-service SSE realtime endpoint
      # (/api/v1/slips/{id}/realtime) 의 30s heartbeat keep-alive 보존.
      # 기본 response-timeout (없음) 이면 일부 환경 idle timeout 으로 stream 끊김.
      # 600s = SseEmitter 무한 timeout + 30s heartbeat 와 충분한 여유.
      httpclient:
        response-timeout: 600s
      # [CORS 중복] arologis-service 등 일부 서비스가 자체 CORS(ACAO) 헤더를 설정해 게이트웨이
      # CorsWebFilter 와 중복되면 브라우저/Electron 이 "multiple values" 로 차단한다. 전 라우트 응답에서
      # ACAO/ACAC 중복을 제거(고유값 유지) — 서비스 직접접근용 CORS 는 보존된다.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # ============================================================
        # Legacy `/api/*` routes (Phase 1~9). 단일 prefix `/api`. StripPrefix=1
        # 후 controller `/{service}/...` 와 매칭. 기존 client 호환을 위해 보존.
        # 신규 client 는 아래 `/api/v1/*` 표준화 routing 사용 권장.
        # ============================================================

        # Login / token endpoints — must be reachable WITHOUT a JWT filter.
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripInboundIdentityHeaders
            - name: ForwardedClientIp
              args:
                trustedPeerAddresses: ${SAMHAN_AUDIT_TRUSTED_INGRESS_ADDRESSES:private}
            - StripPrefix=1

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: slip-service
          uri: lb://slip-service
          predicates:
            - Path=/api/slips/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        # Slice B (notification-slice-B) — 배송 배치 관리자 endpoint (slip-service 내부)
        - id: slip-service-delivery-batches
          uri: lb://slip-service
          predicates:
            - Path=/api/delivery-batches/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        # slice C1b — 사원 서명 공개 제출 (no auth, 토큰만 검증).
        # Spring Cloud Gateway 는 선언 순서(first-match-wins) 기준이므로
        # /api/public/** slip-service-public catch-all 보다 반드시 먼저 선언.
        # JwtAuthentication 미적용 + identity 헤더 strip (위조 차단).
        - id: user-service-employee-signatures-public
          uri: lb://user-service
          predicates:
            - Path=/api/public/employee-signatures/**
          filters:
            - StripInboundIdentityHeaders
            - StripPrefix=1

        # Slice B — 공개 모바일 endpoint (no auth, 토큰만 검증)
        # JwtAuthentication 필터 미적용 — 기사 모바일 직접 접근.
        - id: slip-service-public
          uri: lb://slip-service
          predicates:
            - Path=/api/public/**
          filters:
            - StripInboundIdentityHeaders
            - StripPrefix=1

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: accounting-service
          uri: lb://accounting-service
          predicates:
            - Path=/api/accounting/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        # Issue 4 Slice 1 — 통합 알림 센터 (notification-service NotificationCenterController)
        # /api/notifications/** → StripPrefix=1 → notification-service /notifications/** mapping
        - id: notification-center
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        # Logging service — restricted to MASTER + MANAGER per audit policy.
        # Phase C5-4: role 클레임 제거와 함께 allowedGroups 단독으로 전환.
        # 빌트인 그룹 UUID: MASTER=100, MANAGER=101 (V43 BuiltinRoleGroupIds).
        - id: logging-service
          uri: lb://logging-service
          predicates:
            - Path=/api/logs/**
          filters:
            - StripPrefix=1
            - name: JwtAuthentication
              args:
                allowedGroups:
                  - 00000000-0000-0000-0000-000000000100
                  - 00000000-0000-0000-0000-000000000101
                allowSystemMaster: true
            - AddRequestHeader=X-Internal-Token, ${SAMHAN_INTERNAL_TOKEN}

        # DEV-3 활동 로그 뷰어 — gateway 는 인증만 수행하고 logging-service @RequirePermission(dev.activity-log)가 최종 게이팅.
        - id: logging-activity-dev-menu
          uri: lb://logging-service
          predicates:
            - Path=/logs/activity,/logs/front
          filters:
            - JwtAuthentication
            - AddRequestHeader=X-Internal-Token, ${SAMHAN_INTERNAL_TOKEN}

        # desktop preload legacy 감사 경로 호환 — /api/v1/audit-logs/front → logging-service /logs/front.
        - id: logging-front-legacy-v1
          uri: lb://logging-service
          predicates:
            - Path=/api/v1/audit-logs/front
          filters:
            - JwtAuthentication
            - AddRequestHeader=X-Internal-Token, ${SAMHAN_INTERNAL_TOKEN}
            - SetPath=/logs/front

        # ============================================================
        # `/api/v1/*` 표준 routing (Phase 10 W10-6 도입). 14 service 일관.
        # StripPrefix=2 ('api', 'v1') 후 controller `/{service}/...` 매칭.
        # 일부 controller (partner-order-service, slip-service SlipPublishController
        # 등) 는 `/api/v1/...` 풀패스로 등록 → 본 gateway 에서 StripPrefix=2 후
        # 다시 controller 측 prefix 적용 필요. 해당 service 는 별도 route 분기
        # (NoStripPrefix). 기본 14 service routing 은 아래.
        # ============================================================

        # partner-auth-service — 거래처 주문서 인증 controller 가 `/api/v1/auth/*`
        # 풀패스를 보유하므로 StripPrefix 없음. auth-service `/api/v1/auth/**`
        # generic route 보다 먼저 선언해 거래처 인증 요청을 가로채지 않게 한다.
        - id: partner-auth-public-v1
          uri: lb://partner-auth-service
          predicates:
            - Path=/api/v1/auth/partner-status,/api/v1/auth/partner-register,/api/v1/auth/partner-password,/api/v1/auth/partner-login,/api/v1/auth/partner-temp-password,/api/v1/auth/partner-expiration,/api/v1/auth/partner-tutorial
          filters:
            - StripInboundIdentityHeaders
            - name: ForwardedClientIp
              args:
                trustedPeerAddresses: ${SAMHAN_AUDIT_TRUSTED_INGRESS_ADDRESSES:private}

        # 모바일 슬1 웹 bootstrap: GET /api/v1/auth/me 는 쿠키/Bearer JWT 검증 후
        # auth-service /auth/me 로 전달해야 한다. public auth-service-v1 catch-all 보다 먼저 선언.
        - id: auth-service-me-v1-authenticated
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/me
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # auth-service — login/token endpoint, JWT 필터 미적용
        - id: auth-service-v1
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripInboundIdentityHeaders
            - StripPrefix=2

        # [RC1] 인증 필요 auth-service endpoint(권한 admin / 비밀번호 변경 / 결재라인 구조 read) — JwtAuthentication 필터로
        # X-User-Id/Role 헤더를 주입해야 auth-service HeaderAuthenticationFilter 가 인증을 세운다.
        # /auth/** catch-all(아래 auth-service-legacy)보다 먼저 선언(더 구체적 경로 우선 매칭).
        # login/password/policy/password-reset 등 public 은 catch-all 이 필터 없이 처리.
        # 슬3/슬4a: /auth/approval-line-configs/{docType}/structure/default-approvers 는 비-admin
        #      (인증만, @RequirePermission 없음)이지만 X-User-Id 주입이 필요하므로 본 인증 라우트에 포함
        #      (catch-all 의 무필터 401 회피).
        # 모바일 슬1 웹 bootstrap: GET /auth/me 는 쿠키/Bearer JWT 검증 후 식별헤더를 주입해야 하므로
        # /auth/** legacy catch-all 보다 먼저 선언한다.
        - id: auth-service-me-authenticated
          uri: lb://auth-service
          predicates:
            - Path=/auth/me
          filters:
            - JwtAuthentication

        - id: auth-service-menu-catalog-arologis
          uri: lb://auth-service
          predicates:
            - Path=/auth/admin/menu-catalog
          filters:
            # Samhan Public 직원 메뉴 catalog는 일반 auth-service JWT를 사용한다.
            # Arologis 전용 secret을 지정하면 정상 MANAGER 직원 토큰이 gateway에서 401이 된다.
            - JwtAuthentication

        - id: auth-service-admin-authenticated
          uri: lb://auth-service
          predicates:
            - Path=/auth/admin/**,/auth/password/change,/auth/approval-line-configs/*/structure,/auth/approval-line-configs/*/default-approvers
          filters:
            - JwtAuthentication

        # Legacy /auth/** routing — desktop renderer 의 axios 가 baseURL=http://localhost:8080
        # + path=/auth/login (PR #100 BE controller @RequestMapping("/auth")) 호출 시 매핑.
        # PR #110 (manual Stage 2) capture-desktop.js 의 auth 자동 로그인 navigation fix 의무.
        # StripPrefix=0 으로 그대로 auth-service 에 전달 (controller 가 /auth prefix 보유).
        - id: auth-service-legacy
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripInboundIdentityHeaders

        # [RC3] UserMeController 는 풀패스 @RequestMapping("/api/v1/users/me") → strip=2 면 불일치.
        # generic user-service-v1(/api/v1/users/**, strip=2)보다 먼저 no-strip 으로 선언.
        - id: user-me-v1
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/me,/api/v1/users/me/**
          filters:
            - JwtAuthentication

        - id: user-service-v1
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # [RC3] user-service AdminUserController 는 풀패스 @RequestMapping("/api/v1/admin/users")
        # 라 generic /api/v1/users/** (strip=2) 로는 도달 불가. no-strip 으로 그대로 전달.
        - id: user-admin-v1
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admin/users,/api/v1/admin/users/**
          filters:
            - JwtAuthentication

        # partner-service — 발송금지리스트는 Notion 원본 CSV 를 partner DB 로 이관한 뒤
        # `/api/v1/partners/admin/blocks` 풀패스 CRUD 로 운영한다. controller 가
        # `/api/v1/...` 를 보유하므로 generic StripPrefix route 보다 먼저 no-strip.
        - id: partner-blocks-v1
          uri: lb://partner-service
          predicates:
            - Path=/api/v1/partners/admin/blocks/**
          filters:
            - JwtAuthentication

        # [RC2] partner-service 의 /api/v1/partners 컨트롤러(4tab/revision/attachment/blocks)는 전부
        # 풀패스 @RequestMapping("/api/v1/partners...") 라 StripPrefix 를 적용하면 안 된다(strip 시
        # /partners/... 로 변형되어 "No static resource" 404/500). no-strip 으로 그대로 전달.
        - id: partner-service-v1
          uri: lb://partner-service
          predicates:
            - Path=/api/v1/partners/**
          filters:
            - JwtAuthentication

        # [RC2] product-service — admin(/api/v1/products/admin) 은 풀패스 컨트롤러라 no-strip 필요.
        # generic product-service-v1(strip=2, 카탈로그 /products 컨트롤러용)보다 먼저 선언.
        - id: product-admin-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/admin/**
          filters:
            - JwtAuthentication

        # [RC9 후속] catalog 정확 경로와 usage PATCH 는 풀패스 컨트롤러라 strip 라우트 진입 시 오매칭/404.
        - id: product-catalog-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products
          filters:
            - JwtAuthentication

        - id: product-usage-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/*/usage
          filters:
            - JwtAuthentication

        # [슬3-1] 변동DC 토글 PATCH/DELETE 도 풀패스 컨트롤러(@RequestMapping("/api/v1"))라
        # generic strip=2 라우트 진입 시 /products/... 로 변형돼 "No static resource" 500.
        # usage 와 동일하게 no-strip 으로 그대로 전달.
        - id: product-variable-discount-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/*/variable-discount
          filters:
            - JwtAuthentication

        # F1 정정: 고정DC 인라인 자동저장 PATCH — ProductCatalogController 풀패스라 no-strip.
        - id: product-fixed-discount-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/*/fixed-discount
          filters:
            - JwtAuthentication

        # F1-a 품목별 분류 PATCH — ProductCatalogController 풀패스라 no-strip.
        - id: product-classification-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/*/classification
          filters:
            - JwtAuthentication

        # [#1152] 상품→비상품 토글 PATCH 는 ProductCatalogController 풀패스라 no-strip.
        # generic product-service-v1(strip=2)보다 먼저 선언하지 않으면 /products/...로 변형된다.
        - id: product-goods-type-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/*/goods-type
          filters:
            - JwtAuthentication

        # F1-a 분류 마스터 CRUD — ClassificationController 가 /api/v1/classifications 풀패스 보유.
        # product-service-v1(strip=2) 보다 먼저 no-strip 으로 그대로 전달.
        - id: product-classifications-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/classifications,/api/v1/classifications/**
          filters:
            - JwtAuthentication

        # [잔여] ProductCatalogController 풀패스(@RequestMapping("/api/v1") + /products/{code}/specs,
        # /spec-key-templates). strip=2 면 깨지므로 specs/template 표적 no-strip.
        - id: product-specs-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/*/specs,/api/v1/products/*/specs/**,/api/v1/spec-key-templates,/api/v1/spec-key-templates/**
          filters:
            - JwtAuthentication

        # [RC9 후속] 구성품 CRUD — /products/*/components 는 specs 패턴과 세그먼트가 달라
        # product-specs-v1 에 미매칭. 풀패스 컨트롤러라 strip 금지. product-service-v1(strip=2) 보다 먼저 선언.
        - id: product-components-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/*/components
          filters:
            - JwtAuthentication

        # [RC9 후속] 표시 순서 일괄 갱신 — /products/display-orders 는 strip=2 통과 시
        # /products/display-orders 가 되어 컨트롤러 매핑 /api/v1/products/display-orders 불일치.
        # 풀패스 no-strip. product-service-v1(strip=2) 보다 먼저 선언.
        - id: product-display-orders-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/display-orders
          filters:
            - JwtAuthentication

        # [RC9 후속] 카탈로그 목록 레벨 SSE 구독 (§2-2) — catalog-realtime 고정 세그먼트.
        # product-service-v1(strip=2) 보다 먼저 선언. 풀패스 no-strip.
        - id: product-catalog-realtime-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/catalog-realtime
          filters:
            - JwtAuthentication

        # [RC9] product-service lookup 3종 — 풀패스 컨트롤러 — strip 금지.
        - id: product-lookups-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/material-prices,/api/v1/material-prices/**,/api/v1/odu-recommendations,/api/v1/odu-recommendations/**,/api/v1/branch-pipes,/api/v1/branch-pipes/**
          filters:
            - JwtAuthentication

        # [#896 슬2] 수량 동기화 규칙 CRUD — product-service 컨트롤러가 /api/v1 풀패스를 사용하므로 no-strip.
        - id: product-quantity-sync-rules-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/quantity-sync-rules,/api/v1/quantity-sync-rules/**
          filters:
            - JwtAuthentication

        - id: product-service-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        - id: inventory-service-v1
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # P0-A 하드닝(2026-06-10): 종합견적서 견적 snapshot 은 /internal/estimates/snapshots 로
        # 이전 + X-Internal-Token 인증. /internal/** 는 게이트웨이 비노출(estimate-app 직결)이라
        # 기존 /api/v1/estimates/** NoStripPrefix 무인증 라우트 폐기.

        # SlipPublishController 는 /api/v1/slips 풀패스를 유지한다. generic StripPrefix route보다
        # 먼저 배치해 공개 발행 3경로가 /slips/from-*로 잘리지 않도록 한다.
        - id: slip-service-publish-v1-noprefix
          uri: lb://slip-service
          predicates:
            - Path=/api/v1/slips/from-estimate,/api/v1/slips/from-partner-order,/api/v1/slips/from-orders-merge
          filters:
            - JwtAuthentication

        # MobileSalesController 는 /mobile/sales 풀패스 컨트롤러다.
        - id: slip-service-mobile-sales-noprefix
          uri: lb://slip-service
          predicates:
            - Path=/mobile/sales/**
          filters:
            - JwtAuthentication

        - id: slip-service-v1
          uri: lb://slip-service
          predicates:
            - Path=/api/v1/slips/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # Desktop 견적 통합 목록의 웹 snapshot 조회. 컨트롤러 full path를 그대로 전달한다.
        - id: slip-service-estimate-snapshots-v1
          uri: lb://slip-service
          predicates:
            - Path=/api/v1/estimates/web-snapshots,/api/v1/estimates/web-snapshots/**
          filters:
            - JwtAuthentication

        - id: accounting-service-v1
          uri: lb://accounting-service
          predicates:
            - Path=/api/v1/accounting/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # 데스크톱 그룹웨어 관리자 CRUD의 기존 계약(/admin/groupware/**)을
        # 표준 v1 외부 경로에서도 그대로 전달한다. generic groupware route보다 선행.
        - id: groupware-admin-v1
          uri: lb://groupware-service
          predicates:
            - Path=/api/v1/admin/groupware/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        - id: groupware-service-v1
          uri: lb://groupware-service
          predicates:
            - Path=/api/v1/groupware/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # notification-service — 단톡방리스트는 Notion 원본 CSV 를 notification DB 로
        # 이관한 뒤 `/api/v1/notification/admin/chat-rooms` 풀패스 CRUD 로 운영한다.
        - id: notification-chat-rooms-v1
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notification/admin/chat-rooms/**
          filters:
            - JwtAuthentication

        # N3a native push token self API — controller 가 /api/v1/push-tokens 풀패스 보유.
        - id: notification-push-tokens-v1
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/push-tokens,/api/v1/push-tokens/**
          filters:
            - JwtAuthentication

        - id: notification-service-v1
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notification/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        - id: dashboard-service-v1
          uri: lb://dashboard-service
          predicates:
            - Path=/api/v1/dashboard/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # 버전관리 + 자동업데이트 V1a — 앱 버전 조회는 부팅 전 public 호출.
        # JwtAuthentication 미적용 + identity header strip 전용([[feedback_identity_header_authz_antipattern]]).
        - id: dashboard-app-version-public
          uri: lb://dashboard-service
          predicates:
            - Path=/app/version
          filters:
            - StripInboundIdentityHeaders

        # 앱 릴리스 admin CRUD — 인증 + dashboard-service @RequirePermission(admin.app-release).
        - id: dashboard-app-releases-authenticated
          uri: lb://dashboard-service
          predicates:
            - Path=/app/releases,/app/releases/**
          filters:
            - JwtAuthentication

        # DEV-2 팝업공지 — active 조회도 인증 후 호출, admin CRUD는 dashboard-service @RequirePermission(dev.popup-notice).
        - id: dashboard-app-notices-authenticated
          uri: lb://dashboard-service
          predicates:
            - Path=/app/notices,/app/notices/**
          filters:
            - JwtAuthentication

        # [RC2] arologis admin 컨트롤러는 풀패스 @RequestMapping("/api/v1/arologis/admin") → no-strip 필요.
        # generic arologis-service-v1(strip=2)보다 먼저 선언. 인증 동일(JWT 주입 + Authorization 제거).
        - id: arologis-admin-v1
          uri: lb://arologis-service
          predicates:
            - Path=/api/v1/arologis/admin/**
          filters:
            - JwtAuthentication
            - RemoveRequestHeader=Authorization

        # [RC6] arologis 는 자체 ArologisJwtFilter(arologis 전용 secret, 모바일 직접 접근용)가
        # HeaderAuthenticationFilter 보다 먼저 실행된다. 게이트웨이가 auth-service 토큰(다른 secret)을
        # Authorization 으로 그대로 전달하면 ArologisJwtFilter 가 검증 실패로 403. JwtAuthentication 이
        # X-User-* 를 주입한 뒤 Authorization 을 제거하면, ArologisJwtFilter 는 토큰 없음으로 skip 하고
        # HeaderAuthenticationFilter 가 X-User-* 로 인증한다(모바일 직접 경로는 게이트웨이 미경유라 영향 없음).
        - id: arologis-service-v1
          uri: lb://arologis-service
          predicates:
            - Path=/api/v1/arologis/**
          filters:
            - StripPrefix=2
            - JwtAuthentication
            - RemoveRequestHeader=Authorization

        # partner-order-service 공개 endpoint — 주문서 bootstrap/gate/log 는 거래처 로그인 전 접근 가능.
        - id: partner-order-public-v1
          uri: lb://partner-order-service
          predicates:
            - Path=/api/v1/partner-orders/bootstrap,/api/v1/partner-orders/gate-images,/api/v1/partner-orders/log
          filters:
            - StripInboundIdentityHeaders

        # partner-order-service — controller 측 `/api/v1/partner-orders` 풀패스 보유 → StripPrefix=0
        - id: partner-order-service-v1
          uri: lb://partner-order-service
          predicates:
            - Path=/api/v1/partner-orders/**
          filters:
            - JwtAuthentication

        # partner-auth-service — 주문서 승인 controller 가 `/api/v1/partner-approvals`
        # 풀패스를 보유하므로 StripPrefix 없음. Desktop 주문서 승인 CRUD 경로.
        - id: partner-auth-approvals-v1
          uri: lb://partner-auth-service
          predicates:
            - Path=/api/v1/partner-approvals/**
          filters:
            - JwtAuthentication

        # partner-auth-service — legacy alias. `/api/v1/partner-auth/**` 로 들어온 경우만
        # 기존 호환을 위해 prefix 를 제거한다.
        - id: partner-auth-service-v1
          uri: lb://partner-auth-service
          predicates:
            - Path=/api/v1/partner-auth/**
          filters:
            - StripInboundIdentityHeaders
            - StripPrefix=2

        # dc-config-service — DC정보는 Notion 원본 CSV 를 dc-config DB 로 이관한 뒤
        # `/api/v1/dc-config/admin` 풀패스 import endpoint 로 seed/update 한다.
        - id: dc-config-admin-v1
          uri: lb://dc-config-service
          predicates:
            - Path=/api/v1/dc-config/admin/**
          filters:
            - JwtAuthentication

        - id: dc-config-service-v1
          uri: lb://dc-config-service
          predicates:
            - Path=/api/v1/dc-config/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # dc-config-service — 데스크톱 거래처 DC 설정 화면.
        # controller 가 /api/v1/partner-dc-configs 풀패스를 보유하므로 StripPrefix 없음.
        - id: dc-config-partner-dc-configs-v1
          uri: lb://dc-config-service
          predicates:
            - Path=/api/v1/partner-dc-configs/**
          filters:
            - JwtAuthentication

        # dc-config-service — 데스크톱 종합견적서 전역 가격 설정 화면.
        # controller 가 /api/v1/estimate-config 풀패스를 보유하므로 StripPrefix 없음.
        - id: dc-config-estimate-config-v1
          uri: lb://dc-config-service
          predicates:
            - Path=/api/v1/estimate-config
          filters:
            - JwtAuthentication

        # ============================================================
        # No-prefix routes — desktop API client legacy 호환 (PR-D 이전).
        # baseURL=http://localhost:8080 + 직접 path (예: /slips/query, /inventory/transfers,
        # /accounting/*, /admin/arologis/*) 호출 client 호환. StripPrefix 없음 (BE controller
        # 가 동일 path 매핑 보유).
        # ============================================================
        - id: slip-service-noprefix
          uri: lb://slip-service
          predicates:
            - Path=/slips/**
          filters:
            - JwtAuthentication

        - id: slip-service-admin
          uri: lb://slip-service
          predicates:
            - Path=/admin/slips/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: inventory-service-noprefix
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**,/warehouse/**
          filters:
            - JwtAuthentication

        - id: accounting-service-noprefix
          uri: lb://accounting-service
          predicates:
            - Path=/accounting/**
          filters:
            - JwtAuthentication

        # [RC2] 회계 admin(현금출납 snapshot refresh 등) BE 컨트롤러는 /admin/accounting 풀패스 보유.
        - id: accounting-admin-noprefix
          uri: lb://accounting-service
          predicates:
            - Path=/admin/accounting/**
          filters:
            - JwtAuthentication

        # [#729] 매출/매입 전표 admin — SalesAccountingSlipController(/admin/sales-slips),
        # PurchaseAccountingSlipController(/admin/purchase-slips) 는 풀패스 컨트롤러 보유.
        # accounting-admin-noprefix 선례와 동일한 no-strip 방식(JwtAuthentication 만 적용).
        - id: accounting-sales-purchase-slip-admin-noprefix
          uri: lb://accounting-service
          predicates:
            - Path=/admin/sales-slips,/admin/sales-slips/**,/admin/purchase-slips,/admin/purchase-slips/**
          filters:
            - JwtAuthentication

        # [#729] 세금계산서 배치/수신 admin — TaxInvoiceBatchController(/admin/tax-invoices/batch-from-sales-slips
        # [+/candidates]), TaxInvoiceInboundController(/admin/tax-invoices/inbound[/{id}/attachments]) 는
        # 풀패스 컨트롤러 보유. accounting-sales-purchase-slip-admin-noprefix 선례와 동일한 no-strip 방식.
        - id: accounting-tax-invoice-admin-noprefix
          uri: lb://accounting-service
          predicates:
            - Path=/admin/tax-invoices,/admin/tax-invoices/**
          filters:
            - JwtAuthentication

        # [#463] slip-service 배차 보드 admin BE 컨트롤러는 /admin/dispatch-* 풀패스 보유
        #   (DispatchTaskAdminController @RequestMapping("/admin/dispatch-tasks"),
        #    DispatchBoardAdminController @RequestMapping("/admin/dispatch-board")). FE 도 /admin/dispatch-tasks
        #   직접 호출 → /api/v1/slips StripPrefix=2 와 불일치하던 갭을 no-strip 라우트로 통합
        #   (배차 보드 + 완료배차 내역 뷰 게이트웨이 실연동). accounting-admin-noprefix 선례 동일.
        - id: slip-dispatch-admin-noprefix
          uri: lb://slip-service
          predicates:
            - Path=/admin/dispatch-tasks,/admin/dispatch-tasks/**,/admin/dispatch-board,/admin/dispatch-board/**,/admin/external-carriers,/admin/external-carriers/**,/admin/external-dispatches,/admin/external-dispatches/**,/admin/slip-cutoffs,/admin/slip-cutoffs/**,/admin/slip-closing-baselines,/admin/slip-closing-baselines/**,/admin/dispatch-groups,/admin/dispatch-groups/**,/admin/carriers,/admin/carriers/**,/admin/dispatches/pre-classify
          filters:
            - JwtAuthentication

        - id: slip-collab-notification-admin-noprefix
          uri: lb://slip-service
          predicates:
            - Path=/admin/slip-collab-notifications,/admin/slip-collab-notifications/**
          filters:
            - JwtAuthentication

        - id: arologis-service-noprefix
          uri: lb://arologis-service
          predicates:
            - Path=/admin/arologis/**,/arologis/**
          filters:
            - JwtAuthentication
            - RemoveRequestHeader=Authorization

        - id: notification-service-noprefix
          uri: lb://notification-service
          predicates:
            # [RC9] AligoAddressBookController 는 단수 /admin/notification/aligo/... 매핑 → 단수도 라우팅.
            - Path=/admin/notifications/**,/admin/notification/**,/notify/**
          filters:
            - JwtAuthentication

        - id: groupware-service-noprefix
          uri: lb://groupware-service
          predicates:
            - Path=/admin/groupware/**,/groupware/**
          filters:
            - JwtAuthentication

        - id: dashboard-service-noprefix
          uri: lb://dashboard-service
          predicates:
            - Path=/dashboard/**
          filters:
            - JwtAuthentication

        - id: partner-service-noprefix
          uri: lb://partner-service
          predicates:
            - Path=/admin/partners/**
          filters:
            - JwtAuthentication

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    # gateway ingress attestation은 service-to-service internal token과 별도 자격이다.
    # 값은 로컬 infrastructure/.env.local 또는 운영 secret manager에서만 주입한다.
    gateway-attestation: ${SAMHAN_GATEWAY_ATTESTATION:}
    jwt:
      # Phase 8 2차 — SAMHAN_JWT_SECRET 우선, JWT_SECRET legacy fallback (Phase 10 cutover 시점 단일화)
      secret: ${SAMHAN_JWT_SECRET:${JWT_SECRET}}
      ttl-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  metrics:
    tags:
      application: ${spring.application.name}
