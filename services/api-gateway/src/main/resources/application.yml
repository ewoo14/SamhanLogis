# SamhanLogis — API Gateway configuration.
#
# Reactive Spring Cloud Gateway. All ingress traffic enters here; routes are
# matched by path prefix and proxied to the corresponding Eureka-registered
# service via load-balancer URIs (lb://).
#
# Each protected route applies the custom `JwtAuthentication` filter — see
# `JwtAuthenticationGatewayFilterFactory`. The auth-service login endpoint
# is intentionally exempt so users can obtain a token in the first place.
server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_API_GATEWAY_PORT:8080}}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # PR-H1 (Phase 12 Step 1) — slip-service SSE realtime endpoint
      # (/api/v1/slips/{id}/realtime) 의 30s heartbeat keep-alive 보존.
      # 기본 response-timeout (없음) 이면 일부 환경 idle timeout 으로 stream 끊김.
      # 600s = SseEmitter 무한 timeout + 30s heartbeat 와 충분한 여유.
      httpclient:
        response-timeout: 600s
      # [CORS 중복] arologis-service 등 일부 서비스가 자체 CORS(ACAO) 헤더를 설정해 게이트웨이
      # CorsWebFilter 와 중복되면 브라우저/Electron 이 "multiple values" 로 차단한다. 전 라우트 응답에서
      # ACAO/ACAC 중복을 제거(고유값 유지) — 서비스 직접접근용 CORS 는 보존된다.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # ============================================================
        # Legacy `/api/*` routes (Phase 1~9). 단일 prefix `/api`. StripPrefix=1
        # 후 controller `/{service}/...` 와 매칭. 기존 client 호환을 위해 보존.
        # 신규 client 는 아래 `/api/v1/*` 표준화 routing 사용 권장.
        # ============================================================

        # Login / token endpoints — must be reachable WITHOUT a JWT filter.
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: slip-service
          uri: lb://slip-service
          predicates:
            - Path=/api/slips/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        # Slice B (notification-slice-B) — 배송 배치 관리자 endpoint (slip-service 내부)
        - id: slip-service-delivery-batches
          uri: lb://slip-service
          predicates:
            - Path=/api/delivery-batches/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        # Slice B — 공개 모바일 endpoint (no auth, 토큰만 검증)
        # JwtAuthentication 필터 미적용 — 기사 모바일 직접 접근.
        - id: slip-service-public
          uri: lb://slip-service
          predicates:
            - Path=/api/public/**
          filters:
            - StripPrefix=1

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        - id: accounting-service
          uri: lb://accounting-service
          predicates:
            - Path=/api/accounting/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        # Issue 4 Slice 1 — 통합 알림 센터 (notification-service NotificationCenterController)
        # /api/notifications/** → StripPrefix=1 → notification-service /notifications/** mapping
        - id: notification-center
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
            - JwtAuthentication

        # Logging service — restricted to MASTER + MANAGER per audit policy.
        # 🚨 C5-3 dual review P1: allowedRoles 와 allowedGroups 를 동시 지정하면
        # 필터가 순차 검사(사실상 AND)하므로 groups claim 없는 구버전 토큰(C5-1 이전
        # 발급, TTL 1h)·그룹 미배속 MASTER/MANAGER 가 신규 차단됨(behavior-breaking).
        # → PR-1 은 allowedRoles 단독 유지, allowedGroups 로의 교체는 PR-2(C5-4)에서
        #   role 클레임 제거와 함께 단독 지정으로 전환한다.
        - id: logging-service
          uri: lb://logging-service
          predicates:
            - Path=/api/logs/**
          filters:
            - StripPrefix=1
            - name: JwtAuthentication
              args:
                allowedRoles:
                  - MASTER
                  - MANAGER

        # ============================================================
        # `/api/v1/*` 표준 routing (Phase 10 W10-6 도입). 14 service 일관.
        # StripPrefix=2 ('api', 'v1') 후 controller `/{service}/...` 매칭.
        # 일부 controller (partner-order-service, slip-service SlipPublishController
        # 등) 는 `/api/v1/...` 풀패스로 등록 → 본 gateway 에서 StripPrefix=2 후
        # 다시 controller 측 prefix 적용 필요. 해당 service 는 별도 route 분기
        # (NoStripPrefix). 기본 14 service routing 은 아래.
        # ============================================================

        # partner-auth-service — 거래처 주문서 인증 controller 가 `/api/v1/auth/*`
        # 풀패스를 보유하므로 StripPrefix 없음. auth-service `/api/v1/auth/**`
        # generic route 보다 먼저 선언해 거래처 인증 요청을 가로채지 않게 한다.
        - id: partner-auth-public-v1
          uri: lb://partner-auth-service
          predicates:
            - Path=/api/v1/auth/partner-status,/api/v1/auth/partner-register,/api/v1/auth/partner-password,/api/v1/auth/partner-login,/api/v1/auth/partner-temp-password,/api/v1/auth/partner-expiration,/api/v1/auth/partner-tutorial

        # auth-service — login/token endpoint, JWT 필터 미적용
        - id: auth-service-v1
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        # [RC1] 인증 필요 auth-service endpoint(권한 admin / 비밀번호 변경) — JwtAuthentication 필터로
        # X-User-Id/Role 헤더를 주입해야 auth-service HeaderAuthenticationFilter 가 인증을 세운다.
        # /auth/** catch-all(아래 auth-service-legacy)보다 먼저 선언(더 구체적 경로 우선 매칭).
        # login/password/policy/password-reset 등 public 은 catch-all 이 필터 없이 처리.
        - id: auth-service-admin-authenticated
          uri: lb://auth-service
          predicates:
            - Path=/auth/admin/**,/auth/password/change
          filters:
            - JwtAuthentication

        # Legacy /auth/** routing — desktop renderer 의 axios 가 baseURL=http://localhost:8080
        # + path=/auth/login (PR #100 BE controller @RequestMapping("/auth")) 호출 시 매핑.
        # PR #110 (manual Stage 2) capture-desktop.js 의 auth 자동 로그인 navigation fix 의무.
        # StripPrefix=0 으로 그대로 auth-service 에 전달 (controller 가 /auth prefix 보유).
        - id: auth-service-legacy
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        # [RC3] UserMeController 는 풀패스 @RequestMapping("/api/v1/users/me") → strip=2 면 불일치.
        # generic user-service-v1(/api/v1/users/**, strip=2)보다 먼저 no-strip 으로 선언.
        - id: user-me-v1
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/me,/api/v1/users/me/**
          filters:
            - JwtAuthentication

        - id: user-service-v1
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # [RC3] user-service AdminUserController 는 풀패스 @RequestMapping("/api/v1/admin/users")
        # 라 generic /api/v1/users/** (strip=2) 로는 도달 불가. no-strip 으로 그대로 전달.
        - id: user-admin-v1
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admin/users,/api/v1/admin/users/**
          filters:
            - JwtAuthentication

        # partner-service — 발송금지리스트는 Notion 원본 CSV 를 partner DB 로 이관한 뒤
        # `/api/v1/partners/admin/blocks` 풀패스 CRUD 로 운영한다. controller 가
        # `/api/v1/...` 를 보유하므로 generic StripPrefix route 보다 먼저 no-strip.
        - id: partner-blocks-v1
          uri: lb://partner-service
          predicates:
            - Path=/api/v1/partners/admin/blocks/**
          filters:
            - JwtAuthentication

        # [RC2] partner-service 의 /api/v1/partners 컨트롤러(4tab/revision/attachment/blocks)는 전부
        # 풀패스 @RequestMapping("/api/v1/partners...") 라 StripPrefix 를 적용하면 안 된다(strip 시
        # /partners/... 로 변형되어 "No static resource" 404/500). no-strip 으로 그대로 전달.
        - id: partner-service-v1
          uri: lb://partner-service
          predicates:
            - Path=/api/v1/partners/**
          filters:
            - JwtAuthentication

        # [RC2] product-service — admin(/api/v1/products/admin) 은 풀패스 컨트롤러라 no-strip 필요.
        # generic product-service-v1(strip=2, 카탈로그 /products 컨트롤러용)보다 먼저 선언.
        - id: product-admin-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/admin/**
          filters:
            - JwtAuthentication

        # [잔여] ProductCatalogController 풀패스(@RequestMapping("/api/v1") + /products/{code}/specs,
        # /spec-key-templates). strip=2 면 깨지므로 표적 no-strip(카탈로그 GET 은 기존 strip route 유지).
        - id: product-specs-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/*/specs,/api/v1/products/*/specs/**,/api/v1/spec-key-templates,/api/v1/spec-key-templates/**
          filters:
            - JwtAuthentication

        - id: product-service-v1
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        - id: inventory-service-v1
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        - id: slip-service-v1
          uri: lb://slip-service
          predicates:
            - Path=/api/v1/slips/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        - id: accounting-service-v1
          uri: lb://accounting-service
          predicates:
            - Path=/api/v1/accounting/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        - id: groupware-service-v1
          uri: lb://groupware-service
          predicates:
            - Path=/api/v1/groupware/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # notification-service — 단톡방리스트는 Notion 원본 CSV 를 notification DB 로
        # 이관한 뒤 `/api/v1/notification/admin/chat-rooms` 풀패스 CRUD 로 운영한다.
        - id: notification-chat-rooms-v1
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notification/admin/chat-rooms/**
          filters:
            - JwtAuthentication

        - id: notification-service-v1
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notification/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        - id: dashboard-service-v1
          uri: lb://dashboard-service
          predicates:
            - Path=/api/v1/dashboard/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # [RC2] arologis admin 컨트롤러는 풀패스 @RequestMapping("/api/v1/arologis/admin") → no-strip 필요.
        # generic arologis-service-v1(strip=2)보다 먼저 선언. 인증 동일(JWT 주입 + Authorization 제거).
        - id: arologis-admin-v1
          uri: lb://arologis-service
          predicates:
            - Path=/api/v1/arologis/admin/**
          filters:
            - JwtAuthentication
            - RemoveRequestHeader=Authorization

        # [RC6] arologis 는 자체 ArologisJwtFilter(arologis 전용 secret, 모바일 직접 접근용)가
        # HeaderAuthenticationFilter 보다 먼저 실행된다. 게이트웨이가 auth-service 토큰(다른 secret)을
        # Authorization 으로 그대로 전달하면 ArologisJwtFilter 가 검증 실패로 403. JwtAuthentication 이
        # X-User-* 를 주입한 뒤 Authorization 을 제거하면, ArologisJwtFilter 는 토큰 없음으로 skip 하고
        # HeaderAuthenticationFilter 가 X-User-* 로 인증한다(모바일 직접 경로는 게이트웨이 미경유라 영향 없음).
        - id: arologis-service-v1
          uri: lb://arologis-service
          predicates:
            - Path=/api/v1/arologis/**
          filters:
            - StripPrefix=2
            - JwtAuthentication
            - RemoveRequestHeader=Authorization

        # partner-order-service — controller 측 `/api/v1/partner-orders` 풀패스 보유 → StripPrefix=0
        - id: partner-order-service-v1
          uri: lb://partner-order-service
          predicates:
            - Path=/api/v1/partner-orders/**
          filters:
            - JwtAuthentication

        # [잔여] vendor 발주 OCR — VendorOrderController 풀패스 @RequestMapping("/api/v1/admin/partner-order/vendor").
        # /api/v1/partner-orders/** predicate 와 세그먼트가 달라 미매칭이었음 → no-strip 라우트 추가.
        - id: partner-order-admin-v1
          uri: lb://partner-order-service
          predicates:
            - Path=/api/v1/admin/partner-order/**
          filters:
            - JwtAuthentication

        # partner-auth-service — 주문서 승인 controller 가 `/api/v1/partner-approvals`
        # 풀패스를 보유하므로 StripPrefix 없음. Desktop 주문서 승인 CRUD 경로.
        - id: partner-auth-approvals-v1
          uri: lb://partner-auth-service
          predicates:
            - Path=/api/v1/partner-approvals/**
          filters:
            - JwtAuthentication

        # partner-auth-service — legacy alias. `/api/v1/partner-auth/**` 로 들어온 경우만
        # 기존 호환을 위해 prefix 를 제거한다.
        - id: partner-auth-service-v1
          uri: lb://partner-auth-service
          predicates:
            - Path=/api/v1/partner-auth/**
          filters:
            - StripPrefix=2

        # dc-config-service — DC정보는 Notion 원본 CSV 를 dc-config DB 로 이관한 뒤
        # `/api/v1/dc-config/admin` 풀패스 import endpoint 로 seed/update 한다.
        - id: dc-config-admin-v1
          uri: lb://dc-config-service
          predicates:
            - Path=/api/v1/dc-config/admin/**
          filters:
            - JwtAuthentication

        - id: dc-config-service-v1
          uri: lb://dc-config-service
          predicates:
            - Path=/api/v1/dc-config/**
          filters:
            - StripPrefix=2
            - JwtAuthentication

        # dc-config-service — 데스크톱 거래처 DC 설정 화면.
        # controller 가 /api/v1/partner-dc-configs 풀패스를 보유하므로 StripPrefix 없음.
        - id: dc-config-partner-dc-configs-v1
          uri: lb://dc-config-service
          predicates:
            - Path=/api/v1/partner-dc-configs/**
          filters:
            - JwtAuthentication

        # ============================================================
        # No-prefix routes — desktop API client legacy 호환 (PR-D 이전).
        # baseURL=http://localhost:8080 + 직접 path (예: /slips/query, /inventory/transfers,
        # /accounting/*, /admin/arologis/*) 호출 client 호환. StripPrefix 없음 (BE controller
        # 가 동일 path 매핑 보유).
        # ============================================================
        - id: slip-service-noprefix
          uri: lb://slip-service
          predicates:
            - Path=/slips/**
          filters:
            - JwtAuthentication

        - id: inventory-service-noprefix
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**,/warehouse/**
          filters:
            - JwtAuthentication

        - id: accounting-service-noprefix
          uri: lb://accounting-service
          predicates:
            - Path=/accounting/**
          filters:
            - JwtAuthentication

        # [RC2] 회계 admin(현금출납 snapshot refresh 등) BE 컨트롤러는 /admin/accounting 풀패스 보유.
        - id: accounting-admin-noprefix
          uri: lb://accounting-service
          predicates:
            - Path=/admin/accounting/**
          filters:
            - JwtAuthentication

        - id: arologis-service-noprefix
          uri: lb://arologis-service
          predicates:
            - Path=/admin/arologis/**,/arologis/**
          filters:
            - JwtAuthentication
            - RemoveRequestHeader=Authorization

        - id: notification-service-noprefix
          uri: lb://notification-service
          predicates:
            # [RC9] AligoAddressBookController 는 단수 /admin/notification/aligo/... 매핑 → 단수도 라우팅.
            - Path=/admin/notifications/**,/admin/notification/**,/notify/**
          filters:
            - JwtAuthentication

        - id: groupware-service-noprefix
          uri: lb://groupware-service
          predicates:
            - Path=/admin/groupware/**,/groupware/**
          filters:
            - JwtAuthentication

        - id: dashboard-service-noprefix
          uri: lb://dashboard-service
          predicates:
            - Path=/dashboard/**
          filters:
            - JwtAuthentication

        - id: partner-service-noprefix
          uri: lb://partner-service
          predicates:
            - Path=/admin/partners/**
          filters:
            - JwtAuthentication

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  security:
    jwt:
      # Phase 8 2차 — SAMHAN_JWT_SECRET 우선, JWT_SECRET legacy fallback (Phase 10 cutover 시점 단일화)
      secret: ${SAMHAN_JWT_SECRET:${JWT_SECRET:dev-secret-change-me-in-production-32bytes-min!}}
      ttl-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  metrics:
    tags:
      application: ${spring.application.name}
