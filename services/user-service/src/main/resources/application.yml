server:
  # 운영자 환경변수 SERVER_PORT 로 영구 우회 가능 (외부 process 가 default port 점유 시).
  port: ${SERVER_PORT:${SAMHAN_USER_PORT:8083}}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USER:samhan}
    password: ${DB_PASSWORD:samhan_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      jakarta:
        persistence:
          lock:
            timeout: 3000
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

samhan:
  audit:
    publisher:
      enabled: ${SAMHAN_AUDIT_PUBLISHER_ENABLED:true}
    request-capture:
      enabled: ${SAMHAN_AUDIT_REQUEST_CAPTURE_ENABLED:true}
  security:
    department:
      enabled: true
  auth-service:
    url: ${SAMHAN_AUTH_SERVICE_URL:http://localhost:8081}

app:
  signature:
    # 모바일 공개 서명 웹앱 origin (C2 DevOps 확정 — 기본 게이트웨이 localhost). qrUrl 결합 base.
    public-base-url: ${SAMHAN_SIGNATURE_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    internal:
      # Phase 8 2차 — SAMHAN_INTERNAL_TOKEN 우선, INTERNAL_AUTH_TOKEN legacy fallback (Phase 10 cutover 시점 단일화)
      token: ${SAMHAN_INTERNAL_TOKEN:${INTERNAL_AUTH_TOKEN:dev-internal-token-change-me}}
  user:
    # W10-5 회고 — env 변수 prefix 통일 (SAMHAN_USER_SEED_ORG 우선, USER_SEED_ORG legacy fallback).
    seed-org: ${SAMHAN_USER_SEED_ORG:${USER_SEED_ORG:false}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:user_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
