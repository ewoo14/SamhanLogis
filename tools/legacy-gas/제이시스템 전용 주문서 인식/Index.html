<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제이시스템 발주서 업로드</title>
<style>
.wrap{max-width:920px;margin:26px auto;padding:0 14px}
.row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row .f{flex:1;min-width:240px}
.label{font-size:12px;color:#64748b;display:block;margin-bottom:6px}
.input,.select{width:100%;height:42px;border:1px solid #93c5fd;border-radius:10px;padding:0 12px;outline:none;font-size:15px;background:#fff}
.box{width:100%;min-height:240px;border:2px dashed #7cc5ff;border-radius:18px;background:#e6f4ff;display:flex;align-items:center;justify-content:center;position:relative;transition:.2s ease}
.box.dragover{background:#d6eeff}
.inner{text-align:center;padding:26px 20px}
.btn{appearance:none;border:0;border-radius:12px;background:#0ea5e9;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.9;background:#94a3b8;cursor:not-allowed}
.hint{color:#2563eb;margin-top:10px}
.note{font-size:12px;color:#64748b}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px}

.progress{margin-top:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;height:10px;position:relative}
.progress .bar{height:100%;width:0%}
.progress .bar.det{background:#60a5fa;transition:width .15s ease}
.progress .bar.ind{background:linear-gradient(90deg,#93c5fd 0%,#60a5fa 50%,#93c5fa 100%);animation:ind 1.4s infinite}
@keyframes ind {0%{transform:translateX(-100%);width:30%}50%{transform:translateX(50%);width:40%}100%{transform:translateX(200%);width:30%}}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:#475569;margin-top:6px}

.filelist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fileitem{display:flex;align-items:center;gap:8px;justify-content:center}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}
.file-remove{width:22px;height:22px;border-radius:50%;background:#ef4444;color:#fff;display:inline-flex;align-items:center;justify-content:center;border:none;font-weight:900;cursor:pointer}

/* 모달 */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:14px;max-width:900px;width:100%;max-height:90vh;overflow:visible;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;position:relative}
.modal .hd{padding:14px 16px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.modal .bd{padding:16px;overflow:auto}
.modal .ft{padding:12px 16px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid #e5e7eb}

/* 태그 · 표 */
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;margin-right:6px}
.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl th,.tbl td{border:1px solid #e5e7eb;padding:8px 10px;text-align:left}
.tbl th{background:#f1f5f9}
.section{margin-top:16px}
.total{margin-top:12px;font-weight:700}
.small{font-size:12px}
.mute{color:#64748b}
.warn{color:#b45309}

#sendModal .modal{max-width:520px;text-align:center}
.hourglass{font-size:64px;line-height:1;margin:16px 0}
.send-text{white-space:pre-line;margin-top:8px}
.send-count{margin-top:6px;color:#475569;font-size:13px}

/* 캐러셀 내비 · 슬라이드 */
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:#0ea5e9;color:#fff;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 6px 16px rgba(14,165,233,.35);transition:transform .15s ease;z-index:60;display:flex;align-items:center;justify-content:center;padding:0}
.navbtn:active{transform:translateY(-50%) scale(.96)}
.navbtn.left{left:-40px}
.navbtn.right{right:-40px}
.slide-enter-right{animation:slideInRight .22s ease both}
.slide-enter-left{animation:slideInLeft .22s ease both}
@keyframes slideInRight{from{opacity:.35;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:.35;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}

/* 카운터 */
.counter{margin-top:10px;text-align:center;color:#475569;font-size:13px}

/* 세트명 병합 행 */
.tbl tr.sethead td{
  background:#f8fafc;
  font-weight:700;
  color:#0f172a;
}
.tbl tr.sethead td .sub{
  font-weight:400;
  font-size:12px;
  color:#64748b;
  margin-left:6px;
}
</style>
<script>
const CONFIG = <?!= config ?>;
let pickedFiles = [];
let preparedFiles = [];
let lastPreviews = [];
let previewNames = [];
let currentPreviewIndex = 0;

function qs(id){ return document.getElementById(id); }
function appendLog(t){ console.log(t); }

function logPreviewDebug(fileName, preview){
  const nf = new Intl.NumberFormat('ko-KR');
  const final = Array.isArray(preview?.finalItems) ? preview.finalItems : [];
  const unmatched = Array.isArray(preview?.itemsUnmatched) ? preview.itemsUnmatched : [];

  const whCd = preview?.whCd || '';
  let whName = '-';
  if (whCd === '2') whName = '상일창고';
  else if (whCd === '00003') whName = '초월창고';
  else if (whCd) whName = whCd;

  console.group(`🧾 추출 디버그: ${fileName}`);
  console.log('🗓 납기일자:', preview?.due || '-');
  console.log('📞 인수자 연락처:', preview?.tel || '-');
  console.log('📦 배송주소:', preview?.deliveryAddr || preview?.addr || '-');
  console.log('🏬 물류창고:', whName);
  console.log('📝 특이사항:', preview?.memo || '-');
  console.log('✅ 매칭 품목 수:', final.length);
  console.log('⚠️ 미매칭 품목 수:', unmatched.length);
  console.log('💰 합계:', preview?.totalFormatted || '0');

  if (final.length){
    console.table(final.map(x=>({코드또는모델:x.model,수량:x.qty,단가:nf.format(x.unit),금액:nf.format(x.line),규격:x.spec||''})));
  }
  if (unmatched.length){
    console.table(unmatched.map(x=>({추출코드:x.model,수량:x.qty})));
  }

  if (preview?.ocr?.head){
    console.log('🖨 OCR 샘플(앞부분):\n' + preview.ocr.head);
    try {
      const blob = new Blob([preview.ocr.head], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      console.log('%c⬇ OCR 텍스트 다운로드', 'background:#0ea5e9;color:#fff;padding:2px 6px;border-radius:6px;', url);
    } catch(e){}
  }
  console.groupEnd();
}

function sortFinalItemsForSend_(items){
  const src = Array.isArray(items) ? items : [];
  const tagged = src.map((it, idx)=>({ ...it, __idx: idx }));

  const isBolt = it => {
    const m = String(it.model || '').trim();
    const n = String(it.spec || '').trim();
    return /발통세트/.test(m) || /발통세트/.test(n);
  };

  const classify = it => {
    const raw = String(it.model || '').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
    if (/^AJ\d/.test(raw)) return 0;         // 홈멀티
    if (/^(AC|AP|AR|AF)\d/.test(raw)) return 1; // 싱글 세트
    return 2;                                // 기타(발통세트 등)
  };

  tagged.sort((a,b)=>{
    const ca = classify(a);
    const cb = classify(b);
    if (ca !== cb) return ca - cb;           // 홈멀티 → 싱글 세트 → 기타

    const ba = isBolt(a);
    const bb = isBolt(b);
    if (ba !== bb) return ba ? 1 : -1;       // 발통세트는 항상 맨 뒤

    return a.__idx - b.__idx;               // 나머지는 원래 순서 유지
  });

  return tagged.map(({ __idx, ...rest }) => rest);
}

/* 진행바 */
function showDeterministicProgress(pct, labelL, labelR){
  const bar = qs('progBar');
  const infoL = qs('progInfoL');
  const infoR = qs('progInfoR');
  bar.className = 'bar det';
  bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
  if (labelL != null) infoL.textContent = labelL;
  if (labelR != null) infoR.textContent = labelR;
  qs('progressWrap').style.display = 'block';
}
function showIndeterminateProgress(labelL, labelR){
  const bar = qs('progBar');
  const infoL = qs('progInfoL');
  const infoR = qs('progInfoR');
  bar.className = 'bar ind';
  bar.style.width = '30%';
  if (labelL != null) infoL.textContent = labelL;
  if (labelR != null) infoR.textContent = labelR;
  qs('progressWrap').style.display = 'block';
}
function hideProgress(){ qs('progressWrap').style.display = 'none'; }

// 선택
function populateDropdowns(){
  const custSel = qs('custSelect');
  const manSel  = qs('managerSelect');

  const customers = Array.isArray(CONFIG?.customers) ? CONFIG.customers : [];
  const managers  = Array.isArray(CONFIG?.managers)  ? CONFIG.managers  : [];

  custSel.innerHTML = '';
  customers.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.code;
    opt.textContent = c.label;
    custSel.appendChild(opt);
  });

  manSel.innerHTML = '';
  managers.forEach(m=>{
    const opt = document.createElement('option');
    opt.value = m.code;
    opt.textContent = m.name;
    opt.dataset.ecountId = m.ecountId || '';
    opt.dataset.ecountApi = m.ecountApi || '';
    manSel.appendChild(opt);
  });

  const defCust = customers.find(c=>c.label==='주식회사 제이시스템');
  if (defCust) custSel.value = defCust.code;

  const defMan = managers.find(m=>m.name==='김기철');
  if (defMan) manSel.value = defMan.code;
}

/* 파일 base64 여러 개 (이미지 전용) */
function readManyFilesToBase64(files){
  return new Promise(async (resolve)=>{
    const out = [];
    for (let i=0;i<files.length;i++){
      const f = files[i];
      const res = await new Promise((res2,rej2)=>{
        const r = new FileReader();
        r.onprogress = e=>{
          if (e.lengthComputable) {
            const pct = Math.round(((i + e.loaded/e.total) / files.length) * 100);
            showDeterministicProgress(pct, '파일 업로드 중', pct + '%');
            qs('uploadStatus').textContent = '파일 업로드 중 ' + (i+1) + ' / ' + files.length;
          }
        };
        r.onloadstart = ()=>{
          showDeterministicProgress(0, '파일 업로드 중', '0%');
          qs('uploadStatus').textContent = '파일 업로드 중 ' + (i+1) + ' / ' + files.length;
        };
        r.onloadend = ()=>{
          const pct2 = Math.round(((i+1) / files.length) * 100);
          showDeterministicProgress(pct2, '파일 업로드 완료', pct2 + '%');
          qs('uploadStatus').textContent = '파일 업로드 완료';
        };
        r.onload = () => {
          const b64 = btoa(new Uint8Array(r.result).reduce((s,b)=>s+String.fromCharCode(b),''));
          res2({ name:f.name, type:f.type||'image/png', data:b64 });
        };
        r.onerror = () => rej2(r.error);
        r.readAsArrayBuffer(f);
      }).catch(err=>{
        appendLog('>> ❌ 업로드 오류 ' + (err && err.message ? err.message : err));
        return null;
      });
      if (res) out.push(res);
    }
    resolve(out);
  });
}

/* 파일 UI */
function renderFileLine(){
  const sel = qs('sel');
  if (!pickedFiles.length){
    sel.innerHTML = '선택된 파일 없음';
    qs('note').style.display = 'block';
    qs('btnExtract').disabled = true;
    qs('uploadStatus').textContent = '';
    hideProgress();
    return;
  }
  const items = pickedFiles.map((f,i)=>`
    <div class="fileitem">
      <span class="badge">${f.name}</span>
      <button class="file-remove" title="삭제" onclick="removeFileAt(${i})">×</button>
    </div>
  `).join('');
  sel.innerHTML = `<div class="filelist">${items}</div>`;
  qs('note').style.display = 'none';
  qs('btnExtract').disabled = preparedFiles.length === 0;
}
function removeFileAt(i){
  if (i<0 || i>=pickedFiles.length) return;
  pickedFiles.splice(i,1);
  if (preparedFiles && preparedFiles.length>i) preparedFiles.splice(i,1);
  renderFileLine();
}

/* 파일 선택 */
function setFiles(fs){
  const incoming = Array.isArray(fs) ? fs : [];

  // 이미지 파일만 필터
  const valid = incoming.filter(f =>
    (f.type && f.type.startsWith('image/')) ||
    /\.(png|jpe?g|bmp|tiff?)$/i.test(f.name)
  );

  // 기존 파일에 새 파일을 이어붙이기
  pickedFiles = pickedFiles.concat(valid);

  // 미리보기 / 전송 상태 초기화
  preparedFiles = [];
  lastPreviews = [];
  previewNames = [];
  currentPreviewIndex = 0;

  renderFileLine();

  if (!pickedFiles.length){
    qs('btnExtract').disabled = true;
    return;
  }

  qs('btnExtract').disabled = true;

  // 전체 파일을 다시 base64로 준비
  readManyFilesToBase64(pickedFiles)
    .then(list=>{
      preparedFiles = list;
      qs('btnExtract').disabled = preparedFiles.length === 0;
      if (preparedFiles.length > 0){
        appendLog('>> 📦 파일 준비 완료 ' + preparedFiles.length + '건');
      } else {
        pickedFiles = [];
        renderFileLine();
      }
    })
    .catch(err=>{
      appendLog('>> ❌ 업로드 오류 ' + (err && err.message ? err.message : err));
      pickedFiles = [];
      preparedFiles = [];
      renderFileLine();
    });
}
function clearFiles(){
  pickedFiles = [];
  preparedFiles = [];
  lastPreviews = [];
  previewNames = [];
  currentPreviewIndex = 0;
  const inp = qs('file');
  inp.value = '';
  renderFileLine();
}

/* 드래그앤드롭 바인딩 */
function bindDnD(){
  const box = qs('box');
  const inp = qs('file');

  box.addEventListener('dragover', e=>{ e.preventDefault(); box.classList.add('dragover'); });
  box.addEventListener('dragleave', ()=>{ box.classList.remove('dragover'); });
  box.addEventListener('drop', e=>{
    e.preventDefault();
    box.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files||[])
      .filter(f => (f.type && f.type.startsWith('image/')) || /\.(png|jpe?g|bmp|tiff?)$/i.test(f.name));
    if (!files.length){
      appendLog('>> ⚠️ 이미지 파일만 가능합니다');
      return;
    }
    setFiles(files);
  });

  inp.addEventListener('change', e=>{
    const files = Array.from(e.target.files||[])
      .filter(f => (f.type && f.type.startsWith('image/')) || /\.(png|jpe?g|bmp|tiff?)$/i.test(f.name));
    setFiles(files);
  });
}

/* 추출하기 */
async function handleExtract(){
  if (!preparedFiles.length){
    appendLog('>> ⚠️ 먼저 이미지를 첨부하세요');
    return;
  }
  try{
    appendLog('>> 📦 파일 전송 준비');

    lastPreviews = [];
    previewNames = [];
    currentPreviewIndex = 0;

    showIndeterminateProgress('서버 파싱 중', `0 / ${preparedFiles.length}`);

    for (let i=0;i<preparedFiles.length;i++){
      showIndeterminateProgress('서버 파싱 중', `${i+1} / ${preparedFiles.length}`);
      console.log(`🚚 서버 파싱 진행 ${i+1} / ${preparedFiles.length}`);
      await new Promise((resolve)=>{
        google.script.run
          .withSuccessHandler(res=>{
            const fname = preparedFiles[i]?.name || ('파일 ' + (i+1));
            if (res && res.ok){
              const pv = res.preview || {};
              pv.finalItems = sortFinalItemsForSend_(pv.finalItems || []);
              lastPreviews.push(pv);
              previewNames.push(fname);
              console.log('🧩 서버 파싱 성공:', fname);
              logPreviewDebug(fname, pv);
            } else {
              appendLog('>> 🟥 파싱 실패 ' + (i+1));
              if (res && Array.isArray(res.logs)) res.logs.forEach(m=>console.log(m));
            }
            resolve();
          })
          .withFailureHandler(err=>{
            appendLog('>> ❌ 오류 ' + (err && err.message ? err.message : err));
            resolve();
          })
          .parseImageForPreview(preparedFiles[i]);
      });
    }

    hideProgress();

    if (!lastPreviews.length){
      appendLog('>> 🟥 미리보기 생성 실패');
      return;
    }

    openPreviewModal(lastPreviews);
  }catch(e){
    hideProgress();
    appendLog('>> ❌ 오류 ' + (e && e.message ? e.message : e));
  }
}

/* 미리보기 모달 */
function openPreviewModal(previews){
  lastPreviews = Array.isArray(previews) ? previews : (previews ? [previews] : []);
  if (!lastPreviews.length) return;
  currentPreviewIndex = 0;
  renderPreviewSlide(currentPreviewIndex, 'right');
  qs('modal').style.display = 'flex';
  syncNavButtons();
}
function closeModal(){ qs('modal').style.display = 'none'; }

// 화면
function renderPreviewSlide(idx, dir){
  const preview   = lastPreviews[idx];
  const bd        = document.getElementById('previewBody');
  const unmatched = preview.itemsUnmatched || [];
  const final     = preview.finalItems || [];
  const expanded  = preview.expandedSets || [];
  const nf        = new Intl.NumberFormat('ko-KR');
  const whCd  = preview.whCd || '';
  let whName = '-';
  if (whCd === '2') whName = '상일창고';
  else if (whCd === '00003') whName = '초월창고';
  else if (whCd) whName = whCd;

  const formatDue = (v)=>{
    const s = String(v||'').replace(/[^\d]/g,'');
    if (s.length === 8) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
    return v || '-';
  };

  const headHtml = `
    <div><span class="tag">배송 일자</span> ${formatDue(preview.due)}</div>
    <div><span class="tag">인수자 연락처</span> ${preview.tel || '-'}</div>
    <div><span class="tag">배송주소</span> ${preview.deliveryAddr || preview.addr || '-'}</div>
    <div><span class="tag">물류창고</span> ${whName}</div>
    <div><span class="tag">특이사항</span> ${preview.memo || '-'}</div>
  `;

  let tableHtml = '';
  let grandTotal = 0;

  if (expanded.length > 0) {
    let rowsHtml = '';

    expanded.forEach(set=>{
      rowsHtml += `
        <tr class="sethead">
          <td colspan="5">
            ${set.setName || '-'}
            <span class="sub">× ${set.setQty || 1}</span>
          </td>
        </tr>
      `;
      (set.parts || []).forEach(p=>{
        const line = Number(p.line)||0; grandTotal += line;
        rowsHtml += `
          <tr>
            <td>${p.model || ''}</td>
            <td>${p.spec || ''}</td>
            <td style="text-align:right">${p.qty || ''}</td>
            <td style="text-align:right">${nf.format(Number(p.unit)||0)}</td>
            <td style="text-align:right">${nf.format(line)}</td>
          </tr>
        `;
      });
    });

    // 세트에 포함된 모델명 수집
    const inSetModels = new Set();
    expanded.forEach(s => (s.parts || []).forEach(p => {
      inSetModels.add(String(p.model));
    }));

    // 세트에 한 번이라도 포함된 모델은 단독 품목에서 제거
    const singles = final.filter(x => !inSetModels.has(String(x.model)));

    console.log('>> 🔍 단독 품목 필터링', {
      inSetModels: Array.from(inSetModels),
      singlesCount: singles.length
    });

    if (singles.length){
      rowsHtml += `
        <tr class="sethead">
          <td colspan="5">단독 품목 <span class="sub">세트 외</span></td>
        </tr>
      `;
      singles.forEach(it=>{
        const line = Number(it.line)||0; grandTotal += line;
        rowsHtml += `
          <tr>
            <td>${it.model || ''}</td>
            <td>${it.spec || ''}</td>
            <td style="text-align:right">${it.qty || ''}</td>
            <td style="text-align:right">${nf.format(Number(it.unit)||0)}</td>
            <td style="text-align:right">${nf.format(line)}</td>
          </tr>
        `;
      });
    }

    tableHtml = `
      <div class="section">
        <strong>전송 대상 품목</strong>
        <table class="tbl">
          <thead>
            <tr>
              <th>모델</th>
              <th>규격</th>
              <th style="text-align:right">수량</th>
              <th style="text-align:right">납품단가</th>
              <th style="text-align:right">금액</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml || `<tr><td colspan="5">전송 대상 품목 없음</td></tr>`}
          </tbody>
        </table>
        <div class="total">합계 ${nf.format(grandTotal)}</div>
        <div class="small mute">납품단가는 전역 설정 적용 후 표시</div>
      </div>
    `;
  } else {
    const rows = (final || []).map(it=>{
      const line = Number(it.line)||0; grandTotal += line;
      return `
        <tr>
          <td>${it.model || ''}</td>
          <td>${it.spec || ''}</td>
          <td style="text-align:right">${it.qty || ''}</td>
          <td style="text-align:right">${nf.format(Number(it.unit)||0)}</td>
          <td style="text-align:right">${nf.format(line)}</td>
        </tr>
      `;
    }).join('');

    tableHtml = `
      <div class="section">
        <strong>전송 대상 품목</strong>
        <table class="tbl">
          <thead>
            <tr>
              <th>모델</th>
              <th>규격</th>
              <th style="text-align:right">수량</th>
              <th style="text-align:right">납품단가</th>
              <th style="text-align:right">금액</th>
            </tr>
          </thead>
          <tbody>
            ${rows || `<tr><td colspan="5">전송 대상 품목 없음</td></tr>`}
          </tbody>
        </table>
        <div class="total">합계 ${nf.format(grandTotal)}</div>
        <div class="small mute">납품단가는 전역 설정 적용 후 표시</div>
      </div>
    `;
  }

  const unmatchedRows = (unmatched||[]).map(it=>`
    <tr>
      <td class="warn">${it.model}</td>
      <td class="warn" style="text-align:right">${it.qty}</td>
    </tr>
  `).join('');
  const unmatchedHtml = unmatched.length ? `
    <div class="section">
      <p class="warn">모델 불일치 품목은 전송 대상에서 제외됩니다</p>
      <table class="tbl">
        <thead>
          <tr><th>모델</th><th style="text-align:right">수량</th></tr>
        </thead>
        <tbody>${unmatchedRows}</tbody>
      </table>
    </div>
  ` : '';

  bd.innerHTML = `
    <div>${headHtml}</div>
    ${tableHtml}
    ${unmatchedHtml}
    <div class="counter" id="carouselCounter">${(idx+1)} / ${lastPreviews.length}</div>
  `;

  const specCnt = final.filter(x=>x.spec && String(x.spec).trim()).length;
  console.log('>> 🧾 미리보기 규격 표시', specCnt, '/', final.length);

  bd.classList.remove('slide-enter-left','slide-enter-right'); void bd.offsetWidth;
  bd.classList.add(dir==='left' ? 'slide-enter-left' : 'slide-enter-right');
}

/* 내비 상태 */
function syncNavButtons(){
  const prev = qs('navPrev');
  const next = qs('navNext');
  if (!prev || !next) return;

  const n = lastPreviews.length;
  const i = currentPreviewIndex;

  if (n <= 1){
    prev.style.display = 'none';
    next.style.display = 'none';
    return;
  }
  prev.style.display = (i === 0) ? 'none' : 'inline-flex';
  next.style.display = (i === n-1) ? 'none' : 'inline-flex';
}

/* 이동 */
function prevSlide(){
  if (currentPreviewIndex <= 0) return;
  currentPreviewIndex -= 1;
  renderPreviewSlide(currentPreviewIndex, 'left');
  syncNavButtons();
}
function nextSlide(){
  if (currentPreviewIndex >= lastPreviews.length-1) return;
  currentPreviewIndex += 1;
  renderPreviewSlide(currentPreviewIndex, 'right');
  syncNavButtons();
}

/* 전송 진행 모달 */
function openSendModal(isDone, cur, total){
  const body = qs('sendModalBody');
  if (isDone){
    body.innerHTML = `<div class="hourglass">✅</div><div class="send-text">전송이 완료되었습니다.\n이카운트 주문서를 확인해주세요.</div>`;
    qs('sendModal').style.display = 'flex';
    appendLog('>> ✅ 전송 완료 모달 표시');
    setTimeout(()=>{
      appendLog('>> 🧹 모달 자동 닫기 실행');
      closeSendModal();
      closeModal();
    }, 2000);
  } else {
    body.innerHTML = `<div class="hourglass">⏳</div><div class="send-text">전송 중입니다.\n잠시만 기다려주세요.</div><div id="sendCounter" class="send-count">${cur||0} / ${total||0}</div>`;
    qs('sendModal').style.display = 'flex';
    appendLog('>> ⏳ 전송 진행 모달 표시');
  }
}
function updateSendCounter(cur, total){
  const el = document.getElementById('sendCounter');
  if (el) el.textContent = `${cur} / ${total}`;
}
function closeSendModal(){ qs('sendModal').style.display = 'none'; }

// 전송
async function sendNow(){
  if (!lastPreviews.length){
    return;
  }
  const custCode = qs('custSelect').value.trim();
  const manSel = qs('managerSelect');
  const managerCode = manSel.value.trim();
  const selectedOpt = manSel.options[manSel.selectedIndex];
  const ecountId = selectedOpt ? selectedOpt.dataset.ecountId : '';
  const ecountApi = selectedOpt ? selectedOpt.dataset.ecountApi : '';

  showIndeterminateProgress('이카운트 전송 중', '처리 중');

  const total = lastPreviews.length;
  let done = 0;
  let fail = 0;

  openSendModal(false, 0, total);

  for (let i=0;i<total;i++){
    const current = lastPreviews[i];
    const sortedFinal = sortFinalItemsForSend_(current.finalItems || []);
    const payload = {
      ...current,
      finalItems: sortedFinal.map(x=>({
        model: x.model,
        qty: x.qty,
        unit: x.unit,
        spec: (x.spec || ''),
        fromSet: !!x.fromSet,
        homeIdx: x.homeIdx,
        seq: x.seq,
        setGroup: x.setGroup,
        setDiscType: x.setDiscType || null,
        setDiscAmt: typeof x.setDiscAmt === 'number' ? x.setDiscAmt : 0
      }))
    };

    await new Promise((resolve)=>{
      google.script.run
        .withSuccessHandler(res=>{
          if (res && res.ok) {
            done += 1;
          } else {
            fail += 1;
          }
          updateSendCounter(done + fail, total);
          resolve();
        })
        .withFailureHandler(err=>{
          fail += 1;
          updateSendCounter(done + fail, total);
          resolve();
        })
        .sendFromPreview({ custCode: custCode, managerCode: managerCode, ecountId: ecountId, ecountApi: ecountApi }, payload);
    });
  }

  hideProgress();
  if (fail === 0){
    openSendModal(true);
  } else {
    const body = qs('sendModalBody');
    body.innerHTML = `<div class="hourglass">⚠️</div><div class="send-text">일부 전표 전송에 실패했습니다.\n성공 ${done} / 실패 ${fail}</div>`;
  }
}

window.addEventListener('DOMContentLoaded', ()=>{
  bindDnD();
  populateDropdowns();
  renderFileLine();
});
</script>
</head>
<body>

    <div class="row">
      <div class="f">
        <label class="label">거래처 선택</label>
        <select id="custSelect" class="select"></select>
      </div>
      <div class="f">
        <label class="label">담당자명</label>
        <select id="managerSelect" class="select"></select>
      </div>
    </div>

    <div id="box" class="box">
      <div class="inner">

        <button class="btn" onclick="document.getElementById('file').click()">파일 첨부하기</button>

        <div class="hint" id="sel">선택된 파일 없음</div>
        <div class="note" id="note">여기에 파일을 드래그 앤 드롭해도 됩니다</div>
        <div class="hint" id="uploadStatus" style="margin-top:6px"></div>

        <div id="progressWrap" class="progress" style="display:none">
          <div id="progBar" class="bar det"></div>
        </div>
        <div class="progress-info" style="display:flex" id="progressInfo">
          <span id="progInfoL"></span>
          <span id="progInfoR"></span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="btnExtract" class="btn" onclick="handleExtract()" disabled>추출하기</button>
    </div>
  </div>

  <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="hd">
        <strong>주문서 미리보기</strong>
        <button class="btn" onclick="closeModal()">닫기</button>
      </div>
      <div id="previewBody" class="bd"></div>
      <div class="ft">

      </div>

      <button id="navPrev" class="navbtn left" onclick="prevSlide()" aria-label="이전">&lt;</button>
      <button id="navNext" class="navbtn right" onclick="nextSlide()" aria-label="다음">&gt;</button>
    </div>
  </div>

  <div id="sendModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="bd" id="sendModalBody">
        <div class="hourglass">⏳</div>
        <div class="send-text">전송 중입니다.\n잠시만 기다려주세요.</div>
        <div id="sendCounter" class="send-count">0 / 0</div>
      </div>
    </div>
  </div>
