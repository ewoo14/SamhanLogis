# 아로로지스 (Samhan Public) 독립 분리 CI workflow
#
# 분리 사유 (spec §4, §11 — 2026-05-14):
#   - 아로로지스 = Samhan Public 의 독립 운영 단위로 분리, 같은 AWS 환경 공유.
#   - 빌드/배포 = 별도 워크플로 + 별도 Docker image (`samhanpublic/arologis-service`).
#   - 본 워크플로 는 path filter 로 `services/arologis-service/**` + arologis 전용 클라이언트만
#     트리거. Samhan Public 14 service 영향 0.
#
# 트리거 paths:
#   - services/arologis-service/**          (BE)
#   - clients/arologis-desktop/**           (Electron installer)
#   - clients/arologis-mobile/**            (Expo RN)
#   - shared/**                             (공용 모듈 변경 시 양쪽 모두 재검증)
#   - .github/workflows/arologis-ci.yml     (워크플로 자체 변경 시)
name: arologis CI

on:
  pull_request:
    paths:
      - 'services/arologis-service/**'
      - 'clients/arologis-desktop/**'
      - 'clients/web/design-system/**'
      - 'clients/arologis-mobile/**'
      - 'shared/**'
      - 'scripts/check-credential-plaintext.sh'
      - '.github/workflows/arologis-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/arologis-service/**'
      - 'clients/arologis-desktop/**'
      - 'clients/web/design-system/**'
      - 'clients/arologis-mobile/**'
      - 'shared/**'
      - 'scripts/check-credential-plaintext.sh'

permissions:
  contents: read
  checks: write          # mikepenz/action-junit-report: check run 생성
  pull-requests: write   # JUnit 결과 PR 코멘트

jobs:
  # ─── Credential Plaintext Guard (SP-08-8 + SP-10-2 INSUNG_QUICK) ─────────
  # scripts/check-credential-plaintext.sh 정적 가드 실행.
  # INSUNG_QUICK 패턴 (SP-10-2) 포함 — 빈 값 의무, placeholder 금지.
  credential-guard:
    name: 자격 평문 비공개 가드 (SP-08-8 + SP-10-2)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Credential Plaintext Guard 실행
        run: |
          chmod +x scripts/check-credential-plaintext.sh
          bash scripts/check-credential-plaintext.sh

      - name: 자격·환경 초기화 계약 테스트
        run: node --test scripts/credential-hardening.contract.test.cjs

  # 공용 CI의 동일 가드와 별도 check로 실행한다. shared/** 변경처럼 두 워크플로가
  # 함께 트리거되는 경우에도 각 워크플로가 체크아웃한 커밋을 독립적으로 검사한다.
  notion-zero-guard:
    name: Arologis Notion Runtime Zero Guard (SP-08-7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Notion runtime 의존 zero 정적 검사
        run: |
          chmod +x scripts/check-notion-zero.sh
          bash scripts/check-notion-zero.sh

  config-audit-guard:
    name: "Arologis Config Audit Guard (다운스트림 URL/포트 정합, #745)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # 아로로지스 SlipClient 8084 오배정류 #745 재발 방지용 정적 검사.
      - name: 다운스트림 URL/포트 정합 검사 (validate-config-audit.ps1)
        shell: pwsh
        run: ./infrastructure/scripts/validate-config-audit.ps1 -Detailed

  # ─── Backend ───────────────────────────────────────────────────────────────
  # arologis-service test + bootJar 산출. JAR artifact 는 후속 deploy workflow 에서 재활용 가능.
  backend:
    name: 백엔드 빌드 + 테스트 (arologis-service)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시 + Wrapper 검증
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.head_ref != 'main' }}

      - name: gradlew 실행 권한 보장 (Windows 커밋 방어)
        run: chmod +x ./gradlew

      - name: Docker 가용성 확인 (Testcontainers)
        run: |
          docker version
          docker ps

      - name: CI 임시 자격 생성 (실 개발 스택 자격 미사용)
        shell: bash
        run: |
          set -euo pipefail
          ci_secret() { openssl rand -hex 32; }
          ci_value() {
            local name="$1" value="$2"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          }
          ci_value SAMHAN_GATEWAY_ATTESTATION "$(ci_secret)"
          ci_value SAMHAN_INTERNAL_TOKEN "$(ci_secret)"
          ci_value INTERNAL_AUTH_TOKEN "$(ci_secret)"
          ci_value SAMHAN_JWT_SECRET "$(ci_secret)"
          ci_value JWT_SECRET "$(ci_secret)"
          ci_value SAMHAN_AROLOGIS_JWT_SECRET "$(ci_secret)"
          ci_value DB_USER "ci_${GITHUB_RUN_ID}"
          ci_value DB_PASSWORD "$(ci_secret)"
          ci_value SAMHAN_S3_ACCESS_KEY "ci_${GITHUB_RUN_ID}"
          ci_value SAMHAN_S3_SECRET_KEY "$(ci_secret)"

      - name: assemble (의존 모듈 포함)
        run: ./gradlew :services:arologis-service:assemble

      - name: test (arologis-service)
        run: ./gradlew :services:arologis-service:test -i

      - name: bootJar (arologis-service)
        run: ./gradlew :services:arologis-service:bootJar

      # arologis-service.jar 아티팩트 업로드는 제거됨(2026-07-06) — 배포(arologis-deploy)는
      # SSH + docker-compose pull 방식이라 이 아티팩트를 소비하지 않았고(전 워크플로 대상
      # download-artifact grep 0건), 268MB×N 의 Actions 스토리지만 낭비했다. bootJar 빌드검증은 유지.

      - name: 테스트 리포트 artifact 업로드 (실패 포함)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # 스토리지 쿼터 등 업로드 실패가 잡을 red 로 만들지 않도록(테스트 결과만 게이트)
        with:
          name: arologis-test-reports
          path: |
            services/arologis-service/build/reports/tests/test/
            shared/*/build/reports/tests/test/
          retention-days: 14

      - name: JUnit 결과 PR 코멘트 게시
        if: always() && github.event_name == 'pull_request'
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          require_tests: false
          check_name: JUnit 테스트 결과 (arologis-service)

  # ─── Desktop (Electron) ────────────────────────────────────────────────────
  # arologis-desktop = 별도 Electron installer (Arologis-Setup-1.0.0.exe).
  # design-system 공유 — 필요 시 file: dependency 사전 빌드.
  desktop:
    name: 데스크톱 빌드 (arologis-desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # design-system 사전 빌드 — file: dependency 가 있을 경우만 필요.
      # 본 step 은 graceful — design-system 미참조 시 skip.
      - name: "design-system 사전 빌드 (file: dependency, 있을 경우)"
        run: |
          if [ -f clients/web/design-system/package.json ]; then
            cd clients/web/design-system
            npm ci
            npm run build
          else
            echo 'design-system 미존재 — skip'
          fi

      - name: 의존성 설치 (arologis-desktop)
        working-directory: clients/arologis-desktop
        run: npm ci

      - name: typecheck (arologis-desktop)
        working-directory: clients/arologis-desktop
        run: npm run typecheck

      - name: lint (arologis-desktop)
        working-directory: clients/arologis-desktop
        run: npm run lint

      - name: 단위 테스트(vitest) (arologis-desktop)
        working-directory: clients/arologis-desktop
        run: npm test

      - name: build (arologis-desktop)
        working-directory: clients/arologis-desktop
        run: npm run build

  # ─── Mobile (Expo RN) ──────────────────────────────────────────────────────
  # arologis-mobile = 별도 Google Play / App Store 앱 (별도 bundle id).
  # Prebuild dry-run = native 코드 생성 가능성 사전 가드, EAS Build 진입 전 회귀 방지.
  mobile:
    name: 모바일 prebuild (arologis-mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치 (arologis-mobile)
        working-directory: clients/arologis-mobile
        run: npm ci

      - name: typecheck (arologis-mobile)
        working-directory: clients/arologis-mobile
        run: npm run typecheck
        continue-on-error: true   # 초기 스캐폴드 graceful guard

      # 🚨 continue-on-error 금지 — 이 잡은 그동안 typecheck·expo-doctor·prebuild 만 돌고
      # jest 를 실행하지 않아(그마저 typecheck 은 graceful) 드라이버 화면·API 계약 회귀가
      # CI 에서 전혀 관측되지 않았다. 로컬 실측 8 스위트/30 테스트 green (2026-07-26 하네스 배치).
      - name: 단위 테스트(jest, arologis-mobile)
        working-directory: clients/arologis-mobile
        run: npm test

      - name: Expo doctor (plugin 정합 점검)
        working-directory: clients/arologis-mobile
        run: npx expo-doctor
        continue-on-error: true

      - name: Expo prebuild dry-run (Android)
        working-directory: clients/arologis-mobile
        run: npx expo prebuild --no-install --platform android --clean
        continue-on-error: true
