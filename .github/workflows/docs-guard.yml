name: Docs Guard (docs/** 관할 가드 — ci.yml 이 무시하는 구간)

# 🚨 #851 재수렴 6차 D-1·D-2 — **가드가 관할하는 표면을 바꾸는 PR 은 그 가드를 실행한다.**
#
# ci.yml 의 `pull_request.paths-ignore` 에는 `docs/**` 가 들어 있다(순수 문서 PR 로 14 서비스
# BE 매트릭스를 돌리지 않기 위한 의도적 설정). 그런데 `docs/**` 를 **관할로 삼는 가드**가
# 있고, 그 유일 러너가 ci.yml 이었다. 즉 관할은 미치는데 실행이 0이었다.
#
# 🚨 2026-07-27 재수렴 7차 — **이 주석이 "두 개" 라고 손으로 적은 것이 열 번째 재발이었다.**
#   레포에서 도출하면 문서 본문을 단언하는 검사는 6개고, 그중 5개(D-3)가 여기 트리거 밖이었다.
#   목록은 이제 이 파일이 주장하지 않는다 — harness-false-green-guard.test.ts 의 **G12(도출식)**
#   가 `*.spec.ts`/`*.test.*` 전수에서 실재 `docs/…` 리터럴을 뽑아 아래 트리거·러너와 대조한다.
#   ⚠️ 트리거를 여는 것과 **러너를 두는 것은 별개 축**이다(실측: `docs/operational-validation/
#   README.md` 한 구절을 바꾸면 아래 두 잡은 EXIT=0 인데 sp-07 스펙은 `1 failed / 5 passed`).
#
#   D-1 (보안) `scripts/check-credential-plaintext.sh`
#       DOC_DIRS = docs/qa · docs/dev-reports · docs/operational-validation (…+ .md/.mdx/.log)
#       실측: `docs/qa/<slug>/leak.md` 에 AWS 키를 넣으면 스크립트는 EXIT=1 로 정확히 잡는다.
#       그런데 실제 main 커밋 `fa678d63a`(docs/qa 전용 10파일)의 check-runs 는
#       **total_count = 0** 이었다 — 가드가 한 번도 안 돌고 조용히 머지된 것이다.
#
#   D-2 `clients/desktop/scripts/round-910-contract.test.cjs`
#       본문이 `docs/dev-reports/2026-07-25-910-app-client-identity.md` 를 단언하는데 러너가
#       ci.yml `frontend-desktop` 이라 docs 전용 PR 은 skip 된다. 문서에 금지 서술 1줄을
#       추가하면 로컬은 R910_EXIT=1 인데 CI 는 green 이다(실측).
#
#   D-3 (2026-07-27) mock 게이트 playwright 스펙 5개가 문서 본문을 단언한다 —
#       purchase-inspection-cta · sp-05-crud-surface · sp-06-notion-db-crud ·
#       sp-07-google-sheets-source · sp-08-3-dispatch-parity. 이들의 유일 러너는
#       qa-e2e.yml `desktop-playwright` 인데 그 `paths` 에 `docs/**` 가 없다.
#       ⓐ `docs/handoff`·`docs/manual`·`docs/planning` 은 **어떤 워크플로도** 발동시키지 않았다
#          (실측: `docs/handoff/CURRENT-WORK.md` 단독 커밋 cbfe2bea2·a1aefdd20 의 check-runs
#          `total_count: 0`). 그 파일은 CLAUDE.md 가 "PC 이동 직전 반드시 갱신" 으로 규정한
#          **매 세션 main 직행 경로**이고, sp-08-3 의 secret-like 마커 스캔 대상이다.
#       ⓑ `docs/operational-validation`·`docs/dev-reports` 는 이 워크플로를 발동시켰지만
#          아래 두 잡이 그 스펙을 안 돌려 **CI green 인데 계약이 깨졌다**.
#
# ⚠️ 왜 harness-guard.yml / qa-e2e.yml 에 합치지 않는가 — 워크플로의 `on.paths` 는 **잡별이 아니라
#   파일 전체**에 적용된다. harness-guard.yml 에 `docs/**` 를 넣으면 design-system 빌드가 붙은
#   잡이 QA 스크린샷 PNG 커밋마다 돌고, qa-e2e.yml 의 `paths` 를 열면 **macOS 러너 Detox 잡 2개
#   + 60분 Playwright 잡**까지 문서 커밋마다 돈다(비용 차가 크다). 그래서 여기에 셋째 잡을 둔다.
#
# 💰 아래 `docs-contract-specs` 만 `npm ci` 를 쓴다(나머지 둘은 checkout(+node) 경량 유지).
#   그 스펙 5개는 `@playwright/test` + node 빌트인만 import 하는 **fs 단언 전용**이라
#   브라우저 설치·design-system 빌드·vite dev server 가 전부 불필요하다
#   (실측: 브라우저 0개 상태에서 `30 passed (1.6s)`).
#
# 🔒 이 트리거와 가드들의 관할이 어긋나면 harness-false-green-guard.test.ts 의 **G11·G12 가 RED** 다.
#   G11 은 셸 스크립트의 CODE_DIRS/DOC_DIRS 를, G12 는 `*.spec.ts`/`*.test.*` **전수**에서 실재
#   `docs/…` 리터럴을 도출해 대조한다 — 손으로 동기화하는 목록이 아니다.
# ⚠️ `push` 와 `pull_request` 는 **항상 같은 목록**을 유지한다 — `docs/handoff/CURRENT-WORK.md`
#   처럼 PR 없이 main 으로 직행하는 파일이 있어서, 한쪽만 열면 그 경로가 통째로 미검사가 된다.
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/qa/**'
      - 'docs/dev-reports/**'
      - 'docs/handoff/**'
      - 'docs/manual/**'
      - 'docs/operational-validation/**'
      - 'docs/planning/**'
      - 'scripts/check-credential-plaintext.sh'
      - 'clients/desktop/scripts/round-910-contract.test.cjs'
      - '.github/workflows/docs-guard.yml'
  push:
    branches: [main]
    paths:
      - 'docs/qa/**'
      - 'docs/dev-reports/**'
      - 'docs/handoff/**'
      - 'docs/manual/**'
      - 'docs/operational-validation/**'
      - 'docs/planning/**'
      - 'scripts/check-credential-plaintext.sh'
      - 'clients/desktop/scripts/round-910-contract.test.cjs'
      - '.github/workflows/docs-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-plaintext-guard-docs:
    name: 자격 평문 비공개 가드 (docs 관할, SP-08-8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # ci.yml `credential-plaintext-guard` 와 **같은 스크립트**를 돌린다. 스크립트가 레포 전체를
      # 스캔하므로 docs 전용 PR 에서도 CODE_DIRS 까지 함께 검사된다(비용은 수십 초).
      - name: 자격 평문 비공개 정적 검사 (shell guard)
        run: |
          chmod +x scripts/check-credential-plaintext.sh
          bash scripts/check-credential-plaintext.sh

  round-910-doc-contract:
    name: "#910 문서 계약 테스트 (docs/dev-reports 관할)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 이 파일의 나머지 테스트는 electron-vite 빌드를 spawn 하므로 `npm ci` 가 필요하고, 그래서
      # 전체는 ci.yml `frontend-desktop` 이 계속 담당한다. 여기서는 **문서 본문을 단언하는
      # 테스트만** 이름으로 좁혀 돌린다 — node:test 빌트인 + fs 만 쓰므로 설치가 필요 없다
      # (그러려면 electron-vite 를 최상위에서 resolve 하면 안 된다 — 그래서 lazy 로 바꿨다).
      # 🔒 이 `--test-name-pattern` 이 문서 단언 테스트를 실제로 잡는지는 G12 가 검사한다.
      #    안 잡히면 "0건 실행 후 exit 0" 이라는 새 거짓 green 이 되기 때문이다.
      - name: "#910 문서 계약 테스트 (round-910-contract 문서 단언)"
        run: node --test --test-name-pattern='문서는' clients/desktop/scripts/round-910-contract.test.cjs

  docs-contract-specs:
    name: "문서 본문 단언 스펙 (mock 게이트 중 docs/** 를 읽는 것)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/desktop/package-lock.json

      # `@playwright/test` 만 있으면 된다. 아래 스펙들은 node 빌트인(fs/path/url) 외에는
      # 아무것도 import 하지 않으므로 design-system 빌드도, `npx playwright install` 도,
      # vite dev server 도 필요 없다. 브라우저를 쓰는 테스트가 이 목록에 새로 들어오면
      # 그때는 여기서 명시적으로 실패한다 — 조용히 skip 되는 것보다 낫다.
      - name: 의존성 설치 (@playwright/test — 브라우저 미설치)
        working-directory: clients/desktop
        run: npm ci

      # 🔒 이 목록이 도출 결과와 어긋나면 G12(도출식)가 RED 다. 여기에 손으로 적힌 것은
      #    "무엇을 돌릴지" 이고, "무엇을 돌려야 하는지" 의 권위는 레포 도출에 있다.
      - name: 문서 본문을 단언하는 mock 게이트 스펙 실행
        working-directory: clients/desktop
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'
        run: |
          npx playwright test --reporter=line \
            playwright/purchase-inspection-cta/purchase-inspection-cta.spec.ts \
            playwright/sp-05-crud-surface/sp-05-crud-surface.spec.ts \
            playwright/sp-06-notion-db-crud/sp-06-notion-db-crud.spec.ts \
            playwright/sp-07-google-sheets-source/sp-07-google-sheets-source.spec.ts \
            playwright/sp-08-3-dispatch-parity/sp-08-3-dispatch-parity.spec.ts
