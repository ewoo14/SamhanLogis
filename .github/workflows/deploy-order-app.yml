name: Deploy order-app v4 to Cloudflare Pages

# clients/web/order-app (vite + PWA SPA, dist 산출) auto-deploy.
# main 푸시 또는 수동 dispatch 시 build → Cloudflare Pages publish → smoke test.
on:
  push:
    branches: [main]
    paths:
      - 'clients/web/order-app/**'
      - '.github/workflows/deploy-order-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build + Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/web/order-app

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/web/order-app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: 단위 테스트 gate (있는 경우만)
        # Phase 7 2차 — deploy 직전 test gate. test script 미정의 시 silent skip.
        run: npm test --if-present

      - name: 릴리스 wrapper build + dist 버전 사후검증
        env:
          VITE_APP_VERSION: ${{ vars.SAMHAN_RELEASE_VERSION }}
        run: npm run build:release

      - name: Cloudflare 토큰 설정 여부 확인
        id: cfcheck
        # CLOUDFLARE_API_TOKEN 미설정 시 배포 단계를 skip 하여 chronic false-red 를 제거한다.
        # (build/typecheck/test 게이트는 항상 수행). 토큰 등록 시 자동으로 배포가 재활성화된다.
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare 배포 skip::CLOUDFLARE_API_TOKEN 미설정 — order-app Cloudflare 배포 단계를 건너뜁니다. 활성화하려면 저장소 시크릿 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 를 등록하세요."
          fi

      - name: Cloudflare Pages 배포
        if: steps.cfcheck.outputs.ready == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: samhan-order-app
          directory: clients/web/order-app/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 배포 후 smoke test
        if: steps.cfcheck.outputs.ready == 'true'
        # CDN 전파 대기 후 root HTML 안에 "주문서" 문자열 존재 검증.
        run: |
          sleep 30
          curl -fsS "https://order.samhan-air.com/" -o /tmp/index.html
          grep -q "주문서" /tmp/index.html || { echo "smoke test FAIL — 주문서 문자열 없음"; exit 1; }
          echo "smoke test PASS"
