name: Deploy order-app v4 to Cloudflare Pages

# clients/web/order-app (vite + PWA SPA, dist 산출) auto-deploy.
# main 푸시 또는 수동 dispatch 시 build → Cloudflare Pages publish → smoke test.
on:
  push:
    branches: [main]
    paths:
      - 'clients/web/order-app/**'
      - '.github/workflows/deploy-order-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build + Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/web/order-app

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/web/order-app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: 단위 테스트 gate (있는 경우만)
        # Phase 7 2차 — deploy 직전 test gate. test script 미정의 시 silent skip.
        run: npm test --if-present

      - name: 릴리스 wrapper build + dist 버전 사후검증
        env:
          # GitHub repository variable가 릴리스 번호의 정본이다. 공통 resolver가
          # YYYY/MM/DD-{번호} 형식을 검증하므로 임의의 날짜/run 번호를 생성하지 않는다.
          VITE_APP_VERSION: ${{ vars.SAMHAN_RELEASE_VERSION }}
          VITE_API_BASE_URL: https://api.samhan-air.com/api/v1
        run: npm run build:release

      - name: Cloudflare 자격 증명 필수 확인
        # 자격 누락은 배포 skip이 아니라 job 실패여야 한다. account ID도 Pages action의
        # 필수 입력이므로 토큰과 함께 fail-fast 검증한다.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required for Cloudflare Pages deployment" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required for Cloudflare Pages deployment" >&2; exit 1; }

      - name: Cloudflare Pages 배포
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: samhan-order-app
          directory: clients/web/order-app/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 배포 후 smoke test
        # CDN 전파 대기 후 root HTML 안에 "주문서" 문자열 존재 검증.
        run: |
          sleep 30
          curl -fsS "https://order.samhan-air.com/" -o /tmp/index.html
          grep -q "주문서" /tmp/index.html || { echo "smoke test FAIL — 주문서 문자열 없음"; exit 1; }
          echo "smoke test PASS"
