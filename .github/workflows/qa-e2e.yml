name: QA E2E (Playwright + Detox)

on:
  pull_request:
    paths:
      - 'qa/**'
      - 'clients/**'
      - 'services/arologis-service/**'
      # [#851 G1] BE 계약 변경도 FE 게이트 발동 — accounting/slip 은 데스크톱 FE 가 직접
      # 소비하는 계약(controller payload/DTO)의 원천. BE-only PR(#823 실측)이 Desktop
      # Playwright 를 한 번도 돌리지 않아 FE 배분 차단을 CI 가 못 잡은 공백의 수선.
      - 'services/accounting-service/**'
      - 'services/slip-service/**'
      - '.github/workflows/qa-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  playwright:
    name: Playwright (web + electron + mobile emul)
    runs-on: ubuntu-latest
    # 시나리오 30 → 60 cell 확장 (DC 3 + 재고 3 + 이력 3 + 튜토리얼 3 추가) → 약 2배 시간
    timeout-minutes: 60

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: qa/playwright/package-lock.json

      - name: Playwright 의존성 설치
        working-directory: qa/playwright
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Playwright 브라우저 설치 (system deps 포함)
        working-directory: qa/playwright
        run: npx playwright install --with-deps

      - name: typecheck (시나리오 + utils)
        working-directory: qa/playwright
        run: npx tsc --noEmit

      - name: Playwright dry-run (backend 미가동 시 it.skip 동작)
        working-directory: qa/playwright
        env:
          QA_API_BASE_URL: http://localhost:8080
        run: npx playwright test --reporter=list || true

      - name: ProductCatalog 권한 계약 hard-gate
        working-directory: qa/playwright
        run: npx playwright test tests/catalog/product-catalog-permission-retrofit.spec.ts --project=web-order-app --reporter=line

      - name: HTML 리포트 업로드 (실패 + always)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # 스토리지 쿼터 등 업로드 실패가 잡을 red 로 만들지 않도록(테스트 결과만 게이트)
        with:
          name: playwright-report
          path: qa/playwright/playwright-report/
          retention-days: 7

      - name: JUnit 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # 스토리지 쿼터 등 업로드 실패가 잡을 red 로 만들지 않도록(테스트 결과만 게이트)
        with:
          name: playwright-junit
          path: qa/playwright/test-results/
          retention-days: 7

  desktop-playwright:
    name: Desktop Playwright (mock 회귀 hard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/desktop/package-lock.json
      - name: "design-system 사전 빌드 (file: dependency — vite entry 해석)"
        working-directory: clients/web/design-system
        run: |
          npm ci
          npm run build
      - name: 의존성 설치
        working-directory: clients/desktop
        run: npm ci
      # #851 S2 I-1~I-5: 모든 resolver 사본과 qa/playwright 직접 캡처 표면을
      # 동적으로 발견해 검사한다. 이 step에는 continue-on-error/|| true를 두지 않는다.
      - name: QA 출력 경로·덮어쓰기 가드 (전체 resolver coverage)
        working-directory: clients/desktop
        run: node --test scripts/qa-output-path-guard.test.cjs
      - name: Playwright 브라우저 설치
        working-directory: clients/desktop
        run: npx playwright install --with-deps chromium
      - name: Playwright 실행 (mock 회귀 hard gate — 실패 시 CI fail)
        working-directory: clients/desktop
        run: npx playwright test
      - name: silent-skip 가드 (false-green 2차 방어)
        if: always()
        working-directory: clients/desktop
        run: node scripts/assert-playwright-ran.mjs
      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # 스토리지 쿼터 등 업로드 실패가 잡을 red 로 만들지 않도록(테스트 결과만 게이트)
        with:
          name: desktop-playwright-report
          path: clients/desktop/playwright-report/
          retention-days: 7

  detox-android:
    name: Detox Android (mobile v4, AVD)
    runs-on: macos-latest
    timeout-minutes: 60
    # iOS 는 별도 self-hosted macOS runner 또는 EAS Build 통합 후속
    # Android 는 macos-latest 의 hardware accel 가능 AVD 사용 가능

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detox 의존성 설치
        working-directory: qa/detox
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: typecheck (e2e 시나리오)
        working-directory: qa/detox
        run: npx tsc --noEmit

      # Android emulator 부팅 + detox build/test 는 후속 실 빌드 PR 에서 enable
      # 본 PR 은 셋업 + typecheck 까지만 검증
      - name: Detox config 검증
        working-directory: qa/detox
        run: npx detox config --configuration android.emu.release || true

  detox-android-arologis:
    name: Detox Android (arologis-mobile, AVD)
    runs-on: macos-latest
    timeout-minutes: 60
    # 아로로지스 기사 어플 (Phase 10) Detox 스모크 — Android 14 (API 34) AVD.
    # 부팅 + 로그인 화면 표시 + Pretendard 폰트 로드 확인.
    # Android emulator 실 구동은 후속 실 빌드 PR 에서 enable.
    # 현재는 typecheck + Detox config 검증까지만 수행.

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cycle 2 fix (Claude DevOps D-01): npm cache 추가 (CI 캐시 효율).
          cache: 'npm'
          cache-dependency-path: qa/detox/package-lock.json

      - name: Detox 의존성 설치
        working-directory: qa/detox
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: typecheck (arologis-mobile e2e 시나리오 포함)
        working-directory: qa/detox
        run: npx tsc --noEmit

      - name: Detox config 검증 (arologis-mobile)
        working-directory: qa/detox
        # Cycle 2 fix (Codex DevOps): `|| true` 제거 — config 파싱 fail 을 gating.
        run: npx detox config --configuration arologis.android.release

      - name: 스모크 테스트 결과 업로드 (실패 + always)
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # 스토리지 쿼터 등 업로드 실패가 잡을 red 로 만들지 않도록(테스트 결과만 게이트)
        with:
          name: detox-arologis-report
          path: qa/detox/artifacts/
          retention-days: 7
          # Cycle 2 fix (Claude DevOps D-02): 실 에뮬레이터 미구동 시 빈 디렉토리 경고 회피.
          if-no-files-found: ignore
