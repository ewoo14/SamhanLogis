name: Deploy estimate-app v2 (Render)

# clients/web/estimate-app v2 = Node.js + Express + EJS server-side rendering.
# 호스팅: Render.com Web Service Starter ($7/mo, Singapore region, always-on, 512MB RAM)
# Blueprint 정의: infrastructure/render/render.yaml
#
# === 워크플로우 역할 분담 ===
#  - Render manual deploy : dashboard 또는 workflow_dispatch 로 수동 trigger
#                            (render.yaml autoDeploy: false — main 머지 즉시 배포 회피)
#  - GitHub Actions       : 빌드 검증 + 단위 테스트 + syntax 게이트 (PR 시점)
#
# 본 workflow 는 Render 측 배포를 trigger 하지 않는다 (빌드 검증만).
# 실 배포는 Render dashboard "Manual Deploy" 또는 별도 workflow_dispatch 로 수행한다.
# 절차: infrastructure/render/deploy-checklist.md "수동 deploy trigger" 섹션 참조.

on:
  pull_request:
    paths:
      - 'clients/web/estimate-app/**'
      - 'clients/web/legacy-quantity-golden/**'
      - 'infrastructure/render/**'
      - '.github/workflows/deploy-estimate-app.yml'
  push:
    branches: [main]
    paths:
      - 'clients/web/estimate-app/**'
      - 'clients/web/legacy-quantity-golden/**'
      - '.github/workflows/deploy-estimate-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 빌드 검증 + 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/web/estimate-app

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/web/estimate-app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 단위 테스트
        run: npm test

      - name: JavaScript typecheck
        run: npm run typecheck

      - name: 무주입 개발 빌드
        run: npm run build
