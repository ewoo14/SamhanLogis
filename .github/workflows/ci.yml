name: CI

# 아로로지스 분리 (spec 2026-05-14, plan DO2):
#   - `services/arologis-service/**` + `clients/arologis-{desktop,mobile}/**` 변경은
#     별도 워크플로 `arologis-ci.yml` 에서 처리. 본 워크플로 에서 제외하여 중복 빌드 방지.
#   - shared/** 변경 시는 양 쪽 (samhan-public + arologis) 모두 재검증 필요 → 양쪽 모두 트리거.
#   - workflow_dispatch = 수동 트리거 (manual full run 보장).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'services/arologis-service/**'
      - 'clients/arologis-desktop/**'
      - 'clients/arologis-mobile/**'
      - '.github/workflows/arologis-ci.yml'
      - '.github/workflows/arologis-deploy.yml'
      # Grafana 대시보드 JSON 변경만으로 BE 빌드+테스트 재실행 불필요 (SP-D5)
      - 'infrastructure/grafana/**'
      # 문서 변경만으로 BE 빌드+테스트 재실행 불필요 (audit-slice-3).
      # docs/migration/** 은 Flyway SQL 이 아닌 마이그레이션 계획 문서이므로 함께 무시 안전.
      # Flyway SQL 은 각 service 의 src/main/resources/db/migration/ 경로에 있으므로 영향 없음.
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'services/arologis-service/**'
      - 'clients/arologis-desktop/**'
      - 'clients/arologis-mobile/**'
      - '.github/workflows/arologis-ci.yml'
      - '.github/workflows/arologis-deploy.yml'
      # Grafana 대시보드 JSON 변경만으로 BE 빌드+테스트 재실행 불필요 (SP-D5)
      - 'infrastructure/grafana/**'
      # 문서 변경만으로 BE 빌드+테스트 재실행 불필요 (audit-slice-3).
      # docs/migration/** 은 Flyway SQL 이 아닌 마이그레이션 계획 문서이므로 함께 무시 안전.
      # Flyway SQL 은 각 service 의 src/main/resources/db/migration/ 경로에 있으므로 영향 없음.
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write          # mikepenz/action-junit-report: check run 생성
  pull-requests: write   # JUnit 결과 PR 코멘트 게시

jobs:
  build-and-test:
    name: 빌드 + 테스트 (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group.timeout }}  # group 별 timeout (slip 60분, 그 외 30분)
    strategy:
      fail-fast: false  # 1 group fail 시 다른 group 도 결과 확인
      matrix:
        group:
          - name: shared+auth+gateway
            timeout: 30
            test-tasks: ':shared:common:test :shared:security:test :shared:collab-core:test :shared:realtime-abstraction:test :shared:user-client-abstraction:test :shared:discovery-abstraction:test :shared:approval-core:test :shared:ecount-io:test :shared:notification-publisher:test :services:eureka-server:test :services:api-gateway:test :services:auth-service:test'
          - name: user+product+inventory+logging
            timeout: 30
            test-tasks: ':services:user-service:test :services:product-service:test :services:inventory-service:test :services:logging-service:test'
          - name: slip-units
            # slip-service 단위 + 빠른 client mock 만 (큰 IT 제외)
            timeout: 30
            # Gradle --tests 의 * 는 점(.) 경계를 구분하지 않는 text wildcard 이므로 상위 패키지 필터도 하위 패키지를 매치한다.
            # 하위 패키지 토큰은 CI 커버리지 inventory 를 명시적으로 드러내기 위해 유지하며, 상위 패키지 토큰과 중복 매치될 수 있다.
            #   (R1: price.repository.* 는 테스트 클래스 부재 패키지로 판명되어 제거 — 실재는 price.domain/price.service 뿐)
            # #809 R4-O4: slip.config.* 등재 — 어느 slip job 필터에도 없어 HeaderAuthenticationFilterTest 가
            #   영구 미실행이던 것 해소 (레포 concrete 테스트 182 vs CI 실행 181 전수 대조로 특정, 차집합이 이 1건뿐).
            # #809 R4 통합: slip.price.config.* 를 coverage inventory 에 명시해 AsyncConfig 테스트의 소속을 고정한다.
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.attachment.*" --tests "com.samhanair.logis.slip.audit.service.*" --tests "com.samhanair.logis.slip.client.*" --tests "com.samhanair.logis.slip.comment.service.*" --tests "com.samhanair.logis.slip.config.*" --tests "com.samhanair.logis.slip.domain.*" --tests "com.samhanair.logis.slip.delivery.domain.*" --tests "com.samhanair.logis.slip.delivery.service.*" --tests "com.samhanair.logis.slip.editrequest.service.*" --tests "com.samhanair.logis.slip.estimate.domain.*" --tests "com.samhanair.logis.slip.estimate.revision.*" --tests "com.samhanair.logis.slip.estimate.service.*" --tests "com.samhanair.logis.slip.estimate.web.*" --tests "com.samhanair.logis.slip.price.config.*" --tests "com.samhanair.logis.slip.price.domain.*" --tests "com.samhanair.logis.slip.price.service.*" --tests "com.samhanair.logis.slip.realtime.*" --tests "com.samhanair.logis.slip.revision.*" --tests "com.samhanair.logis.slip.revision.service.*" --tests "com.samhanair.logis.slip.seed.*" --tests "com.samhanair.logis.slip.service.*" --tests "com.samhanair.logis.slip.service.dispatch.*" --tests "com.samhanair.logis.slip.web.*" --tests "com.samhanair.logis.slip.collab.*" --tests "com.samhanair.logis.slip.mobile.dto.*" --tests "com.samhanair.logis.slip.mobile.service.*"'
          # W10-5 회고 — slip-it-public + slip-it-core PR matrix 재활성.
          # 사유: PR #102 V11 CONCURRENTLY 제거 fix 로 idle in transaction deadlock 근본 차단 →
          # 30분 안에 통과 예상. 보강 회귀 검증은 nightly-slip-it.yml (60분 timeout, 매일 02:00 KST)
          # 가 main + 활성 feature branch 에 대해 별도로 수행. PR fast-feedback + nightly deep
          # regression 2-track 패턴 (PR #99 5/6/7차 회고 정착).
          - name: slip-it-public
            timeout: 30
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.delivery.it.*" --tests "com.samhanair.logis.slip.publish.*"'
          - name: slip-it-core
            timeout: 30
            # Gradle * 는 점(.)도 매치하므로 slip.it.* 와 하위 패키지 토큰은 중복될 수 있다. 하위 토큰은 coverage inventory 가시성을 위해 유지한다.
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.comment.it.*" --tests "com.samhanair.logis.slip.estimate.it.*" --tests "com.samhanair.logis.slip.estimate.it.collab.*" --tests "com.samhanair.logis.slip.estimate.snapshot.it.*" --tests "com.samhanair.logis.slip.it.*" --tests "com.samhanair.logis.slip.it.collab.*" --tests "com.samhanair.logis.slip.it.cutoff.*" --tests "com.samhanair.logis.slip.it.dispatch.*" --tests "com.samhanair.logis.slip.it.schedule.*" --tests "com.samhanair.logis.slip.repository.dispatch.*" --tests "com.samhanair.logis.slip.dispatch.*"'
          - name: accounting+partner
            timeout: 30
            test-tasks: ':services:accounting-service:test :services:partner-service:test :services:partner-auth-service:test :services:partner-order-service:test :services:dc-config-service:test'
          - name: accounting-codef-it
            # BC1 CODEF 은행·카드 거래내역 연동과 #825 슬5 null-semantics 신규 회귀를 명시 등재.
            # accounting+partner 전체 테스트에도 포함되지만, 필터 false-green 방지를 위해 좁은 회귀 job 을 별도 유지.
            timeout: 30
            test-tasks: ':services:accounting-service:test --tests "com.samhanair.logis.accounting.it.CodefImportControllerIT" --tests "com.samhanair.logis.accounting.it.UserCodefImportScopeMigrationIT" --tests "com.samhanair.logis.accounting.it.CodefAccountSelectionIT" --tests "com.samhanair.logis.accounting.it.CodefConnectionRepositoryIT" --tests "com.samhanair.logis.accounting.it.CodefConnectionServiceIT" --tests "com.samhanair.logis.accounting.it.CodefConnectionControllerIT" --tests "com.samhanair.logis.accounting.service.CodefImportScopedServiceTest" --tests "com.samhanair.logis.accounting.service.UserCodefImportScopeServiceTest" --tests "com.samhanair.logis.accounting.domain.UserCodefImportScopeDomainTest" --tests "com.samhanair.logis.accounting.web.dto.CodefImportScopeRequestTest" --tests "com.samhanair.logis.accounting.web.dto.CodefImportScopedRequestTest" --tests "com.samhanair.logis.accounting.web.dto.CodefImportScopeResponseSerializationTest"'
          - name: accounting-cash-receipt-it
            # E3 S1~S3 입금보고서 도메인 기반 + #712 MIG-9 linkCash 링크 IT: 신규 IT 명시 등재로 Gradle --tests false-green 방지.
            timeout: 30
            test-tasks: ':services:accounting-service:test --tests "com.samhanair.logis.accounting.it.CashReceiptControllerIT" --tests "com.samhanair.logis.accounting.it.BankDepositReceiptIT" --tests "com.samhanair.logis.accounting.editrequest.lock.AccountingLockPoliciesTest" --tests "com.samhanair.logis.accounting.service.Mig9CashJournalServiceTest" --tests "com.samhanair.logis.accounting.it.Mig9CashJournalLinkIT" :services:auth-service:test --tests "com.samhanair.logis.auth.it.AuthFlywayV80SeedIT"'
          - name: accounting-deposit-mapping-it
            # #810 CODEX LUNA: 신규 매핑 package/CRUD/provenance 테스트를 명시 allowlist하여
            # accounting 전체 테스트에 우연히 포함된 것으로 끝나는 filter false-green을 차단한다.
            timeout: 30
            # #810 R3: DepositMatchShellIT 추가 — KFTC 행격리(UNAVAILABLE) 회귀를 좁은 job 에도 명시 등재.
            test-tasks: ':services:accounting-service:test --tests "com.samhanair.logis.accounting.it.BankDepositorPartnerMappingControllerIT" --tests "com.samhanair.logis.accounting.it.BankDepositorPartnerMappingMigrationIT" --tests "com.samhanair.logis.accounting.it.BankDepositorPartnerMappingPermissionEnforcementIT" --tests "com.samhanair.logis.accounting.it.BankTransactionControllerIT" --tests "com.samhanair.logis.accounting.it.BankTransactionPermissionEnforcementIT" --tests "com.samhanair.logis.accounting.it.DepositMatchShellIT" --tests "com.samhanair.logis.accounting.domain.BankDepositorPartnerMappingTest" --tests "com.samhanair.logis.accounting.service.DepositorMappingServiceTest" --tests "com.samhanair.logis.accounting.client.PartnerLookupClientTest" --tests "com.samhanair.logis.accounting.util.DepositorNameNormalizerTest" --tests "com.samhanair.logis.accounting.domain.BankTransactionDomainTest" :services:auth-service:test --tests "com.samhanair.logis.auth.domain.PageCodeTest" --tests "com.samhanair.logis.auth.it.PageCodeSeedConsistencyIT" --tests "com.samhanair.logis.auth.it.AuthFlywayV87SeedIT" --tests "com.samhanair.logis.auth.it.AuthFlywayV88SeedIT"'
          # 아로로지스 분리 (spec 2026-05-14, plan DO2):
          #   `:services:arologis-service:test` 는 별도 워크플로 `arologis-ci.yml` 의 backend job
          #   으로 이관. 본 그룹에서는 제외. Samhan Public 14 service 만 커버.
          - name: phase9-10 (groupware+notification+dashboard)
            timeout: 30
            test-tasks: ':services:groupware-service:test :services:notification-service:test :services:dashboard-service:test'
          - name: accounting-partner-integrity-it
            # B2 D-B2-01/02: V63 폭·MIG-11 86자·세금계산서 partner 교체 audit hard gate.
            timeout: 30
            test-tasks: ':services:accounting-service:test --tests "com.samhanair.logis.accounting.it.PartnerCodeWidthMigrationIT" --tests "com.samhanair.logis.accounting.it.PartnerCodeWidthUpgradeIT" --tests "com.samhanair.logis.accounting.it.Mig11LedgerPartnerCodeWidthImportIT" --tests "com.samhanair.logis.accounting.it.TaxInvoicePartnerChangeAuditIT" --tests "com.samhanair.logis.accounting.service.TaxInvoiceServiceTest"'

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시 + Wrapper 검증
        uses: gradle/actions/setup-gradle@v4   # 5차 fix: v3 cache-restore HTTP 400 회피
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.head_ref != 'main' }}

      - name: gradlew 실행 권한 보장 (Windows 커밋 방어)
        run: chmod +x ./gradlew

      - name: Docker 가용성 확인 (Testcontainers 용)
        run: |
          docker version
          docker ps

      # 5차 fix: --no-daemon 제거 — assemble→test 사이 JVM 워밍업 재활용 (52s 절약).
      - name: assemble (전 모듈)
        run: ./gradlew assemble

      - name: test (${{ matrix.group.name }})
        run: ./gradlew ${{ matrix.group.test-tasks }}

      - name: "#848 DocumentTemplateIT skipped=0 hard gate"
        if: matrix.group.name == 'phase9-10 (groupware+notification+dashboard)'
        run: |
          report='services/groupware-service/build/test-results/test/TEST-com.samhanair.logis.groupware.it.DocumentTemplateIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::#848 DocumentTemplateIT JUnit report not found; document template boundary IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::#848 DocumentTemplateIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: "#845 DS-3a GroupwareAdminControllerIT skipped=0 hard gate"
        if: matrix.group.name == 'phase9-10 (groupware+notification+dashboard)'
        # R3 PM 발견 — ACTIVE-0 각인(document_template_default_pinned)을 지키는 유일한
        # 방어선이 이 IT 1건뿐인데(뮤테이션 실측), 형제 IT(DocumentTemplateIT)와 달리 CI
        # 등재가 0건이었다. AbstractPostgresIT 계열은 Docker 미가용 시 조용히 skip 되므로,
        # 이 gate 없이는 핵심 방어선이 미실행인 채로도 CI green 이 될 수 있었다.
        run: |
          report='services/groupware-service/build/test-results/test/TEST-com.samhanair.logis.groupware.it.GroupwareAdminControllerIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::#845 GroupwareAdminControllerIT JUnit report not found; admin endpoint IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          tests="$(grep -o 'tests="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${tests:-0}" -lt 1 ] || [ "${skipped:-missing}" != "0" ]; then
            echo "::error::#845 GroupwareAdminControllerIT hard gate failed: tests=${tests:-missing} skipped=${skipped:-missing}"
            exit 1
          fi

      - name: "#850 SalesAccountingSlipConcurrencyIT skipped=0 hard gate"
        if: matrix.group.name == 'accounting+partner'
        run: |
          report='services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.SalesAccountingSlipConcurrencyIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::#850 SalesAccountingSlipConcurrencyIT JUnit report not found; 배분 동시성 IT 가 필터/스킵되었을 수 있음."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::#850 SalesAccountingSlipConcurrencyIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: "#850 PurchaseAccountingSlipConcurrencyIT skipped=0 hard gate"
        if: matrix.group.name == 'accounting+partner'
        run: |
          report='services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.PurchaseAccountingSlipConcurrencyIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::#850 PurchaseAccountingSlipConcurrencyIT JUnit report not found; 배분 동시성 IT 가 필터/스킵되었을 수 있음."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::#850 PurchaseAccountingSlipConcurrencyIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: "#854 SlipPublishOutboxProcessorIT tests>=25 failures=0 errors=0 skipped=0 hard gate"
        if: matrix.group.name == 'accounting+partner'
        run: |
          report='services/partner-order-service/build/test-results/test/TEST-com.samhanair.logis.partnerorder.it.SlipPublishOutboxProcessorIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::#854 SlipPublishOutboxProcessorIT JUnit report not found; outbox tx/동시성 IT 가 필터/스킵되었을 수 있음."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          tests="$(grep -o 'tests="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          failures="$(grep -o 'failures="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          errors="$(grep -o 'errors="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${tests:-0}" -lt 25 ] || [ "${failures:-missing}" != "0" ] || [ "${errors:-missing}" != "0" ] || [ "${skipped:-missing}" != "0" ]; then
            echo "::error::#854 SlipPublishOutboxProcessorIT hard gate failed: tests=${tests:-missing} failures=${failures:-missing} errors=${errors:-missing} skipped=${skipped:-missing}"
            exit 1
          fi

      - name: "#863 N-3 TaskSchedulerPoolSizeIT tests>=1 failures=0 errors=0 skipped=0 hard gate"
        if: matrix.group.name == 'accounting+partner'
        run: |
          report='services/partner-order-service/build/test-results/test/TEST-com.samhanair.logis.partnerorder.config.TaskSchedulerPoolSizeIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::#863 TaskSchedulerPoolSizeIT JUnit report not found; spring.task.scheduling.pool.size 회귀 IT 가 필터/스킵되었을 수 있음."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          tests="$(grep -o 'tests="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          failures="$(grep -o 'failures="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          errors="$(grep -o 'errors="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${tests:-0}" -lt 1 ] || [ "${failures:-missing}" != "0" ] || [ "${errors:-missing}" != "0" ] || [ "${skipped:-missing}" != "0" ]; then
            echo "::error::#863 TaskSchedulerPoolSizeIT hard gate failed: tests=${tests:-missing} failures=${failures:-missing} errors=${errors:-missing} skipped=${skipped:-missing}"
            exit 1
          fi

      - name: "#848 ApprovalLineConfigInstantiationIT skipped=0 hard gate"
        if: matrix.group.name == 'phase9-10 (groupware+notification+dashboard)'
        run: |
          report='services/groupware-service/build/test-results/test/TEST-com.samhanair.logis.groupware.it.ApprovalLineConfigInstantiationIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::#848 ApprovalLineConfigInstantiationIT JUnit report not found; approval-line instantiation IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::#848 ApprovalLineConfigInstantiationIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: "#848 ApprovalLineConfigControllerIT skipped=0 hard gate"
        if: matrix.group.name == 'shared+auth+gateway'
        run: |
          report='services/auth-service/build/test-results/test/TEST-com.samhanair.logis.auth.it.ApprovalLineConfigControllerIT.xml'
          if [ ! -f "$report" ]; then
            echo "::error::#848 ApprovalLineConfigControllerIT JUnit report not found; auth approval-line boundary IT may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::#848 ApprovalLineConfigControllerIT skipped count must be 0, got ${skipped:-missing}."
            exit 1
          fi

      - name: E2 CollectionRealtimePublisherTest skipped=0 hard gate
        if: matrix.group.name == 'shared+auth+gateway'
        run: |
          report='shared/realtime-abstraction/build/test-results/test/TEST-com.samhanair.logis.shared.realtime.collection.CollectionRealtimePublisherTest.xml'
          if [ ! -f "$report" ]; then
            echo "::error::CollectionRealtimePublisherTest JUnit report not found; E2 realtime-abstraction tests may have been filtered out."
            exit 1
          fi
          skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
