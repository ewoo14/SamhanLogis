            skipped="$(grep -o 'skipped="[0-9]*"' "$report" | head -n 1 | sed 's/[^0-9]//g')"
            if [ "${tests:-0}" -le 0 ] || [ "${failures:-missing}" != "0" ] || [ "${errors:-missing}" != "0" ] || [ "${skipped:-missing}" != "0" ]; then
              echo "::error::B2 JUnit hard gate failed: $report tests=${tests:-missing} failures=${failures:-missing} errors=${errors:-missing} skipped=${skipped:-missing}"
