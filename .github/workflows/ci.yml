          require_tests: ${{ matrix.group.name == 'accounting-codef-it' || matrix.group.name == 'accounting-cash-receipt-it' || matrix.group.name == 'accounting-deposit-mapping-it' || matrix.group.name == 'accounting-partner-integrity-it' }}
          check_name: JUnit 테스트 결과 (${{ matrix.group.name }})

  notion-zero-guard:
    name: Notion Runtime Zero Guard (SP-08-7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Notion runtime 의존 zero 정적 검사
        run: |
          chmod +x scripts/check-notion-zero.sh
          bash scripts/check-notion-zero.sh

  credential-plaintext-guard:
    name: Credential Plaintext Guard (SP-08-8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 자격 평문 비공개 정적 검사 (shell guard)
        run: |
          chmod +x scripts/check-credential-plaintext.sh
          bash scripts/check-credential-plaintext.sh

      # Playwright spec hard gate 는 후속 슬라이스 — 본 PR 에서는 shell guard 단독
      # (SP-08-7 notion-zero-guard 패턴 일관). spec testDir 외부 testMatch 이슈 (No tests found)
      # 해결은 별도 PR (qa/playwright testDir 확장 또는 spec 이전).

  config-audit-guard:
    name: "Config Audit Guard (다운스트림 URL/포트 정합, #745)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # SAMHAN_*_SERVICE_URL / samhan.*-service.url 기본 포트가 각 compose 파일의 실 서비스
      # 포트와 정합하는지 정적 검사 (arologis SlipClient 8084 오배정류 #745 재발 회귀 게이트).
      # ubuntu-latest 내장 pwsh (PowerShell 7) 사용 — 별도 설치 불필요.
      - name: 다운스트림 URL/포트 정합 검사 (validate-config-audit.ps1)
        shell: pwsh
        run: ./infrastructure/scripts/validate-config-audit.ps1 -Detailed

  frontend-ds:
    name: Frontend DS (typecheck + lint + build + storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/web/design-system

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/web/design-system/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: typecheck (build config)
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: typecheck (dev config — stories/tests 포함)
        run: npx tsc -p tsconfig.json --noEmit

      - name: 단위 테스트(vitest)
        run: npm test

      - name: lint
        run: npm run lint
        continue-on-error: true   # legacy 코드 사전 존재 오류 허용 — feature 브랜치별 신규 코드 검증은 PR 검토에서

      - name: vite build
        run: npm run build

      - name: storybook 정적 빌드
        run: npm run build-storybook

      - name: storybook 정적 산출 업로드 (PR 미리보기)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true  # 스토리지 쿼터 등 업로드 실패가 잡을 red 로 만들지 않도록(테스트 결과만 게이트)
        with:
          name: storybook-static-${{ github.run_number }}
          path: clients/web/design-system/storybook-static
          retention-days: 7

