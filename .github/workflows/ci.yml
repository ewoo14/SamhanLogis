      - name: "B2 partner integrity IT tests>0 failures=0 errors=0 skipped=0 hard gate"
        if: matrix.group.name == 'accounting-partner-integrity-it'
        run: |
          reports=(
            'services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.PartnerCodeWidthMigrationIT.xml'
            'services/accounting-service/build/test-results/test/TEST-com.samhanair.logis.accounting.it.PartnerCodeWidthUpgradeIT.xml'
