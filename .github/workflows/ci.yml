name: CI

# 아로로지스 분리 (spec 2026-05-14, plan DO2):
#   - `services/arologis-service/**` + `clients/arologis-{desktop,mobile}/**` 변경은
#     별도 워크플로 `arologis-ci.yml` 에서 처리. 본 워크플로 에서 제외하여 중복 빌드 방지.
#   - shared/** 변경 시는 양 쪽 (samhan-public + arologis) 모두 재검증 필요 → 양쪽 모두 트리거.
#   - workflow_dispatch = 수동 트리거 (manual full run 보장).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'services/arologis-service/**'
      - 'clients/arologis-desktop/**'
      - 'clients/arologis-mobile/**'
      - '.github/workflows/arologis-ci.yml'
      - '.github/workflows/arologis-deploy.yml'
      # Grafana 대시보드 JSON 변경만으로 BE 빌드+테스트 재실행 불필요 (SP-D5)
      - 'infrastructure/grafana/**'
      # 문서 변경만으로 BE 빌드+테스트 재실행 불필요 (audit-slice-3).
      # docs/migration/** 은 Flyway SQL 이 아닌 마이그레이션 계획 문서이므로 함께 무시 안전.
      # Flyway SQL 은 각 service 의 src/main/resources/db/migration/ 경로에 있으므로 영향 없음.
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'services/arologis-service/**'
      - 'clients/arologis-desktop/**'
      - 'clients/arologis-mobile/**'
      - '.github/workflows/arologis-ci.yml'
      - '.github/workflows/arologis-deploy.yml'
      # Grafana 대시보드 JSON 변경만으로 BE 빌드+테스트 재실행 불필요 (SP-D5)
      - 'infrastructure/grafana/**'
      # 문서 변경만으로 BE 빌드+테스트 재실행 불필요 (audit-slice-3).
      # docs/migration/** 은 Flyway SQL 이 아닌 마이그레이션 계획 문서이므로 함께 무시 안전.
      # Flyway SQL 은 각 service 의 src/main/resources/db/migration/ 경로에 있으므로 영향 없음.
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write          # mikepenz/action-junit-report: check run 생성
  pull-requests: write   # JUnit 결과 PR 코멘트 게시

jobs:
  build-and-test:
    name: 빌드 + 테스트 (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group.timeout }}  # group 별 timeout (slip 60분, 그 외 30분)
    strategy:
      fail-fast: false  # 1 group fail 시 다른 group 도 결과 확인
      matrix:
        group:
          - name: shared+auth+gateway
            timeout: 30
            test-tasks: ':shared:common:test :shared:security:test :shared:user-client-abstraction:test :shared:discovery-abstraction:test :services:eureka-server:test :services:api-gateway:test :services:auth-service:test'
          - name: user+product+inventory+logging
            timeout: 30
            test-tasks: ':services:user-service:test :services:product-service:test :services:inventory-service:test :services:logging-service:test'
          - name: slip-units
            # slip-service 단위 + 빠른 client mock 만 (큰 IT 제외)
            timeout: 30
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.client.*" --tests "com.samhanair.logis.slip.domain.*" --tests "com.samhanair.logis.slip.delivery.domain.*" --tests "com.samhanair.logis.slip.delivery.service.*" --tests "com.samhanair.logis.slip.service.*"'
          # W10-5 회고 — slip-it-public + slip-it-core PR matrix 재활성.
          # 사유: PR #102 V11 CONCURRENTLY 제거 fix 로 idle in transaction deadlock 근본 차단 →
          # 30분 안에 통과 예상. 보강 회귀 검증은 nightly-slip-it.yml (60분 timeout, 매일 02:00 KST)
          # 가 main + 활성 feature branch 에 대해 별도로 수행. PR fast-feedback + nightly deep
          # regression 2-track 패턴 (PR #99 5/6/7차 회고 정착).
          - name: slip-it-public
            timeout: 30
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.delivery.it.*" --tests "com.samhanair.logis.slip.publish.*"'
          - name: slip-it-core
            timeout: 30
            test-tasks: ':services:slip-service:test --tests "com.samhanair.logis.slip.it.*"'
          - name: accounting+partner
            timeout: 30
            test-tasks: ':services:accounting-service:test :services:partner-service:test :services:partner-auth-service:test :services:partner-order-service:test :services:dc-config-service:test'
          # 아로로지스 분리 (spec 2026-05-14, plan DO2):
          #   `:services:arologis-service:test` 는 별도 워크플로 `arologis-ci.yml` 의 backend job
          #   으로 이관. 본 그룹에서는 제외. Samhan Public 14 service 만 커버.
          - name: phase9-10 (groupware+notification+dashboard)
            timeout: 30
            test-tasks: ':services:groupware-service:test :services:notification-service:test :services:dashboard-service:test'

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 캐시 + Wrapper 검증
        uses: gradle/actions/setup-gradle@v4   # 5차 fix: v3 cache-restore HTTP 400 회피
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.head_ref != 'main' }}

      - name: gradlew 실행 권한 보장 (Windows 커밋 방어)
        run: chmod +x ./gradlew

      - name: Docker 가용성 확인 (Testcontainers 용)
        run: |
          docker version
          docker ps

      # PR-F2 (Phase 10 step-13) — Tesseract OCR native binary + 한국어 traineddata 사전 설치.
      # partner-order-service 의 TesseractOcrEngine 통합 회귀 테스트 가 부팅 시점에
      # @ConditionalOnProperty(samhan.partner-order.ocr.enabled) 활성 케이스를 검증할 수 있도록
      # accounting+partner 그룹에서만 사전 설치. 단위 테스트는 default disabled (mock) 격리이므로
      # 미설치 환경에서도 통과하지만, 향후 IT 회귀 추가 시 본 step 이 가드 역할.
      - name: Tesseract OCR 설치 (PR-F2 — accounting+partner 그룹만)
        if: matrix.group.name == 'accounting+partner'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs

      # 5차 fix: --no-daemon 제거 — assemble→test 사이 JVM 워밍업 재활용 (52s 절약).
      - name: assemble (전 모듈)
        run: ./gradlew assemble

      - name: test (${{ matrix.group.name }})
        run: ./gradlew ${{ matrix.group.test-tasks }}

      - name: 테스트 리포트 아티팩트 업로드 (실패 포함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.group.name }}
          path: |
            services/*/build/reports/tests/test/
            shared/*/build/reports/tests/test/
          retention-days: 14

      - name: JUnit 결과 PR 코멘트로 게시
        if: always() && github.event_name == 'pull_request'
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          require_tests: false
          check_name: JUnit 테스트 결과 (${{ matrix.group.name }})

  notion-zero-guard:
    name: Notion Runtime Zero Guard (SP-08-7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Notion runtime 의존 zero 정적 검사
        run: |
          chmod +x scripts/check-notion-zero.sh
          bash scripts/check-notion-zero.sh

  credential-plaintext-guard:
    name: Credential Plaintext Guard (SP-08-8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 자격 평문 비공개 정적 검사 (shell guard)
        run: |
          chmod +x scripts/check-credential-plaintext.sh
          bash scripts/check-credential-plaintext.sh

      # Playwright spec hard gate 는 후속 슬라이스 — 본 PR 에서는 shell guard 단독
      # (SP-08-7 notion-zero-guard 패턴 일관). spec testDir 외부 testMatch 이슈 (No tests found)
      # 해결은 별도 PR (qa/playwright testDir 확장 또는 spec 이전).

  frontend-ds:
    name: Frontend DS (typecheck + lint + build + storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/web/design-system

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/web/design-system/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: typecheck (build config)
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: typecheck (dev config — stories/tests 포함)
        run: npx tsc -p tsconfig.json --noEmit

      - name: lint
        run: npm run lint
        continue-on-error: true   # legacy 코드 사전 존재 오류 허용 — feature 브랜치별 신규 코드 검증은 PR 검토에서

      - name: vite build
        run: npm run build

      - name: storybook 정적 빌드
        run: npm run build-storybook

      - name: storybook 정적 산출 업로드 (PR 미리보기)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ github.run_number }}
          path: clients/web/design-system/storybook-static
          retention-days: 7

  frontend-desktop:
    name: Frontend Desktop (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-ds]   # design-system 빌드 후 desktop (file: dependency)
    defaults:
      run:
        working-directory: clients/desktop

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            clients/web/design-system/package-lock.json
            clients/desktop/package-lock.json

      - name: "design-system 사전 빌드 (file: dependency)"
        working-directory: clients/web/design-system
        run: |
          npm ci
          npm run build

      - name: desktop 의존성 설치
        run: npm ci

      - name: typecheck (Electron node + web)
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build (electron-vite)
        run: npm run build

  frontend-mobile-staff:
    name: Frontend Mobile-Staff (typecheck + expo doctor + prebuild dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/mobile-staff

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clients/mobile-staff/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      # P1-4 영업 native 앱 (Phase 11+1개월 예정) 빌드 분기 검증.
      # app.config.js 의 BUILD_ENV / APP_VARIANT 환경변수 분기 및 EAS Build 프로파일 정합 사전 가드.
      # CI 에서는 BUILD_ENV=development (default) 로 실행하여 로컬 개발 경로 검증.
      - name: app.config.js 환경변수 분기 점검 (node 직접 실행)
        run: |
          node -e "
            const cfg = require('./app.config.js');
            const expo = cfg.expo;
            if (!expo.name || !expo.version) { console.error('app.config.js: name/version 누락'); process.exit(1); }
            if (!expo.extra || !expo.extra.buildEnv) { console.error('app.config.js: extra.buildEnv 누락'); process.exit(1); }
            if (!expo.ios || !expo.ios.bundleIdentifier) { console.error('app.config.js: ios.bundleIdentifier 누락'); process.exit(1); }
            if (!expo.android || !expo.android.package) { console.error('app.config.js: android.package 누락'); process.exit(1); }
            console.log('app.config.js 검증 통과:', expo.name, 'v' + expo.version, '/', expo.extra.buildEnv);
          "

      # W10-3 종합 TM 채택 fix (O-DEVOPS-1) — Expo plugin 정합 사전 가드.
      # P1-4 보강 — app.config.js 동적 설정 병행 후에도 expo-doctor 플러그인 정합 유지 확인.
      # continue-on-error = true — graceful guard (asset 부분 누락 / expo-doctor SDK patch 버전 경고 허용).
      - name: Expo doctor (plugin 정합 점검)
        run: npx expo-doctor
        continue-on-error: true

      # Expo prebuild dry-run — native 코드 생성 가능성 사전 가드 (EAS Build 진입 전 회귀 방지).
      # P1-4 EAS Build 프로파일 (eas.json) 추가 후 native 디렉토리 생성 경로 이상 없음 확인.
      # --no-install --clean = node_modules 미변형 + native 디렉토리 임시 생성.
      - name: Expo prebuild dry-run
        run: npx expo prebuild --no-install --clean
        continue-on-error: true

      # eas.json 구문 유효성 — Phase 11 EAS Build 활성 전 사전 가드.
      # jq 로 JSON 파싱만 확인 (EAS CLI 미설치 환경에서도 동작).
      - name: eas.json 구문 검증
        run: |
          if [ -f eas.json ]; then
            node -e "
              const eas = require('./eas.json');
              const profiles = Object.keys(eas.build || {});
              if (profiles.length === 0) { console.error('eas.json: build 프로파일 없음'); process.exit(1); }
              console.log('eas.json 검증 통과. 프로파일:', profiles.join(', '));
            "
          else
            echo 'eas.json 없음 — skip'
          fi
