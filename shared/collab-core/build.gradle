/*
 * shared:collab-core — shared collaborative-document subsystem skeleton.
 *
 * Shared module boundary:
 *   * @MappedSuperclass bases only (comment / suggestion / revision)
 *   * generic services over consumer-provided repository abstractions
 *   * autoconfiguration registration only
 *
 * Concrete @Entity / @Table / Flyway migrations stay in each consuming service.
 */

plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

dependencies {
    api project(':shared:common')
    api project(':shared:realtime-abstraction')

    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot'
    api 'org.springframework.data:spring-data-jpa'
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework:spring-webmvc'
    api 'org.springframework:spring-context'

    api 'jakarta.annotation:jakarta.annotation-api'
    api 'org.slf4j:slf4j-api'

    compileOnly 'org.hibernate.orm:hibernate-core'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 루트 build.gradle 의 leafProjects 리스트에 collab-core 가 없어 useJUnitPlatform() 이 적용되지 않으므로 자가 선언(approval-core 패턴 미러).
// 누락 시 test task 가 JUnit4 기본으로 동작해 JUnit5 Jupiter @Test 를 0건 발견 → BUILD SUCCESSFUL false-green.
test {
    useJUnitPlatform()
}
