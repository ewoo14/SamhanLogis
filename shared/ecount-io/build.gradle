/*
 * shared:ecount-io — POI 기반 이카운트/Excel IO 전용 library.
 *
 * shared:common 에서 Apache POI 의존성을 분리하여 공통 DTO/exception 소비 서비스 전체로
 * POI 가 전이되지 않도록 한다.
 */

plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
}

dependencies {
    api project(':shared:common')

    // POI 타입을 직접 사용하는 기존 accounting XLSX export 코드가 direct POI 의존 없이 컴파일되도록 노출.
    api 'org.apache.poi:poi-ooxml:5.4.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework:spring-web'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
