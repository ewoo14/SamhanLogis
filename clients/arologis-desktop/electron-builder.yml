# arologis-desktop — electron-builder 설정
#
# Samhan Public 의 desktop 패턴을 복제하되 app id / productName 만 변경.
# 별도 installer (Arologis-Setup-<version>-x64.exe) 로 배포한다.
appId: com.samhanair.arologis.desktop
productName: Arologis Desktop
copyright: Copyright (c) 2026 (주)삼한공조시스템
artifactName: ${productName}-${env.SAMHAN_RELEASE_ARTIFACT_VERSION}-${arch}.${ext}
forceCodeSigning: true

directories:
  output: release/${env.SAMHAN_RELEASE_ARTIFACT_VERSION}
  buildResources: build

# electron-updater 비교용 package semver는 release wrapper가
# --config.extraMetadata.version으로 주입한다. renderer/정책 버전은 VITE_APP_VERSION을 사용한다.

files:
  - out/**/*
  - package.json

extraResources:
  - from: build/arologis-internal-release.cer
    to: arologis-internal-release.cer

asar: true
asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  publisherName: Samhan Internal Release
  requestedExecutionLevel: asInvoker  # 관리자 권한 불필요 (UAC 회피)

nsis:
  oneClick: false
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  perMachine: false  # 사용자별 설치 — UAC 회피, 사내 일반 사원 권한 OK
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Arologis Desktop
  installerLanguages:
    - ko_KR
  language: '1042'  # Korean

portable:
  artifactName: ${productName}-${env.SAMHAN_RELEASE_ARTIFACT_VERSION}-${arch}-portable.${ext}

# private GitHub Releases 대신 아로로지스 전용 HTTPS 정적 피드를 사용한다.
# 삼한 데스크톱 피드와 섞이지 않도록 별도 환경변수로 주입한다.
publish:
  provider: generic
  url: ${env.AROLOGIS_UPDATE_URL}
  channel: latest
