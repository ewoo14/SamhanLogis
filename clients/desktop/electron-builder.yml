# SamhanLogis Desktop — electron-builder 설정
#
# Windows NSIS installer + portable .exe (Q6=A 사내 환경 Windows 우선).
# 자동 업데이트는 NSIS 설치본에서 동작한다. portable은 기존 배포 호환용으로 유지하며
# electron-updater의 설치/재시작 대상이 아니므로 운영 배포는 NSIS를 사용해야 한다.
#
# 빌드 명령:
#   npm run build:win    # electron-vite build → electron-builder --win
# 결과물:
#   release/<version>/Samhan Public-<version>-x64.exe              (NSIS installer)
#   release/<version>/Samhan Public-<version>-x64-portable.exe     (portable)
appId: com.samhanair.logis.desktop
productName: Samhan Public
copyright: Copyright (c) 2026 (주)삼한공조시스템
artifactName: ${productName}-${env.SAMHAN_RELEASE_ARTIFACT_VERSION}-${arch}.${ext}
# publisherName만으로는 서명되지 않는다. 인증서가 없으면 빌드를 실패시켜
# SmartScreen/업데이트 서명 검증이 우회되지 않도록 한다.
forceCodeSigning: true

directories:
  output: release/${env.SAMHAN_RELEASE_ARTIFACT_VERSION}
  buildResources: build

# electron-updater 비교용 package semver. renderer/정책 버전은 VITE_APP_VERSION을 사용한다.
extraMetadata:
  version: ${env.SAMHAN_RELEASE_PACKAGE_VERSION}

beforePack: scripts/validate-desktop-release.cjs

files:
  - out/**/*
  - package.json

extraResources:
  # 설치 후 사용자 머신에 함께 배포할 정적 리소스 (현재 비어있음).
  # 후속 슬라이스에서 사내 매뉴얼 PDF / 한국어 폰트 등 추가 가능.
  - from: ../../docs/PM/project_plan.md
    to: docs/project_plan.md
    filter: ["**/*"]

asar: true
asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico  # 미존재 시 electron-builder default 아이콘 fallback
  publisherName: Samhan Air Systems Co., Ltd.
  requestedExecutionLevel: asInvoker  # 관리자 권한 불필요 (UAC 회피)

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false  # 사용자별 설치 — UAC 회피, 사내 일반 사원 권한 OK
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Samhan Public
  installerLanguages:
    - ko_KR
  language: '1042'  # Korean

portable:
  artifactName: ${productName}-${env.SAMHAN_RELEASE_ARTIFACT_VERSION}-${arch}-portable.${ext}

# private GitHub Releases는 클라이언트에 토큰을 배포해야 하므로 사용하지 않는다.
# 빌드 환경에서 DESKTOP_UPDATE_URL을 HTTPS 사내 정적 피드 주소로 주입한다.
publish:
  provider: generic
  url: ${env.DESKTOP_UPDATE_URL}
  channel: latest
