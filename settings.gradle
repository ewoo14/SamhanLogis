/*
 * SamhanLogis — root multi-project Gradle settings
 *
 * Shared library:
 *   shared:common                  — BaseEntity, Role enum, JWT util, common DTO/exception
 *   shared:discovery-abstraction   — ServiceDiscoveryClient interface (Eureka default + AWS Cloud Map placeholder)
 *   shared:user-client-abstraction — UserVerifier interface + DefaultUserVerifier impl (Caffeine TTL 60s, W3 backlog #1 채택, Phase 9 W4)
 *   shared:security                — X-Internal-Token InternalTokenFilter + InternalAuthProperties + InternalTokenGuard
 *                                     (Phase 10 W10-4 PR #99 DV-3 채택, 13 service 통합)
 *
 * Phase 1 services:
 *   services:eureka-server     — service discovery
 *   services:api-gateway       — Spring Cloud Gateway (reactive)
 *   services:auth-service      — JWT issuer + accounts
 *   services:logging-service   — Elasticsearch-backed audit log
 *
 * Phase 9 services (W1 ~):
 *   services:partner-service       — 거래처 마스터 + M5 partnerId lookup endpoint (W1)
 *   services:groupware-service     — 결재선 + 메신저 + 일정 (W2)
 *   services:notification-service  — 푸시 / 이메일 / SMS 통합 라우터 (W3, FCM + SES + Aligo)
 *   services:dashboard-service     — KPI / 실시간 재고 / 매출 + 4 client + materialized view (W4)
 *
 * Phase 10 services (W10-1 ~) — arologis 배차 마이크로서비스 (Phase 10/11 renumber, 사용자 결정 2026-05-07):
 *   services:arologis-service      — 배차 (Dispatch/Vehicle/Stop) + KakaoDispatchParser + DriverMatcher 추상화 +
 *                                    GPS 추적 + 4 client (partner/user/slip/notification) (W10-1)
 *
 * Add additional services here as `include 'services:<name>'` and ensure
 * each service directory contains its own build.gradle.
 */

