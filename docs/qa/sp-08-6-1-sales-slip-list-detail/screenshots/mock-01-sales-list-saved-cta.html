<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1280"/>
<title>SP-08-6-1 PNG 01 — 매출 목록 (SAVED 행 + 출고 CTA secondary)</title>
<style>
  /* design-system token subset (tokens.css 인용) */
  :root {
    --color-brand-500: #2D77A8;
    --color-brand-600: #235F88;
    --color-neutral-0:   #FFFFFF;
    --color-neutral-50:  #F7F8FA;
    --color-neutral-100: #EDF0F4;
    --color-neutral-200: #D6DCE3;
    --color-neutral-300: #B8C0CB;
    --color-neutral-400: #8E97A4;
    --color-neutral-500: #6B7280;
    --color-neutral-600: #4D5562;
    --color-neutral-700: #363D49;
    --color-neutral-900: #0F1216;
    --color-bg:           var(--color-neutral-0);
    --color-bg-subtle:    var(--color-neutral-50);
    --color-bg-muted:     var(--color-neutral-100);
    --color-border:       var(--color-neutral-200);
    --color-border-strong:var(--color-neutral-300);
    --color-text:         var(--color-neutral-900);
    --color-text-muted:   var(--color-neutral-600);
    --font-family-sans: "Pretendard Variable", Pretendard, -apple-system, "Noto Sans KR", sans-serif;
    --font-size-base: 14px;
    --font-size-sm: 13px;
    --font-size-xl: 18px;
    --font-weight-semibold: 600;
    --font-weight-regular: 400;
    --radius-md: 4px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
    /* status badge tokens */
    --badge-radius: 4px;
    --badge-font-size: 12px;
    /* secondary button */
    --btn-secondary-bg: var(--color-neutral-0);
    --btn-secondary-border: var(--color-neutral-300);
    --btn-secondary-color: var(--color-neutral-700);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family-sans);
    font-size: var(--font-size-base);
    background: var(--color-bg-subtle);
    color: var(--color-text);
    padding: 32px 40px;
    min-height: 900px;
  }
  .page-title { font-size: 24px; font-weight: var(--font-weight-semibold); color: var(--color-neutral-900); }
  .page-subtitle { font-size: var(--font-size-sm); color: var(--color-text-muted); margin-top: 4px; }

  /* filter bar */
  .filter-bar {
    display: flex; gap: 16px; align-items: flex-end;
    margin-top: 20px; margin-bottom: 20px;
  }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-label { font-size: 12px; color: var(--color-text-muted); }
  .filter-input {
    height: 36px; padding: 0 12px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    font-family: inherit; font-size: var(--font-size-sm);
    background: var(--color-bg);
    color: var(--color-text);
    min-width: 140px;
  }
  .filter-select {
    height: 36px; padding: 0 10px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    font-family: inherit; font-size: var(--font-size-sm);
    background: var(--color-bg);
    min-width: 140px;
  }
  .page-size-btn {
    height: 36px; padding: 0 16px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    background: var(--color-bg-subtle);
    font-family: inherit; font-size: var(--font-size-sm);
    color: var(--color-brand-500); cursor: pointer;
  }

  /* table */
  .table-wrap {
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 12px 16px;
    background: var(--color-bg-subtle);
    border-bottom: 1px solid var(--color-border);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--color-text-muted);
    text-align: left;
  }
  tbody tr { border-bottom: 1px solid var(--color-border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--color-bg-subtle); }
  tbody td {
    padding: 12px 16px;
    font-size: var(--font-size-base);
    color: var(--color-text);
    vertical-align: middle;
  }

  /* slip no — brand link style */
  .slip-no {
    color: var(--color-brand-500); cursor: pointer;
    font-weight: var(--font-weight-semibold);
    text-decoration: none;
  }
  .slip-no:hover { color: var(--color-brand-600); text-decoration: underline; }

  /* amount — tabular numerals */
  .amount { font-feature-settings: "tnum" 1; }

  /* status badge */
  .badge {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    border-radius: var(--badge-radius);
    font-size: var(--badge-font-size);
    font-weight: 600;
    line-height: 1.4;
  }
  .badge-draft    { background: #F0F4F8; color: var(--color-neutral-600); }
  .badge-saved    { background: #DBEAFE; color: #1E40AF; }   /* SAVED = brand-blue info — 저장완료 */
  .badge-sent     { background: #FEF3C7; color: #92400E; }   /* SENT = amber — 전송완료 */
  .badge-accepted { background: #D1FAE5; color: #065F46; }   /* ACCEPTED = green — 수락 */
  .badge-shipping { background: #E0E7FF; color: #3730A3; }   /* SHIPPING = indigo — 배송중 */
  .badge-completed{ background: #D1FAE5; color: #065F46; }   /* COMPLETED = green — 처리완료 */
  .badge-confirmed{ background: #D1FAE5; color: #047857; }   /* CONFIRMED = dark-green — 확정 */
  .badge-canceled { background: #FEE2E2; color: #991B1B; }   /* CANCELED = red — 취소 */

  /* secondary CTA button — SP-08-5-1 05 패턴 일치 */
  .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center;
    height: 28px; padding: 0 12px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    background: var(--color-bg);
    font-family: inherit; font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    color: var(--color-neutral-700); cursor: pointer;
    white-space: nowrap;
  }
  .btn-secondary:hover { background: var(--color-bg-subtle); border-color: var(--color-neutral-400); }

  /* dash for no-action */
  .no-action { color: var(--color-neutral-400); }

  /* footnote */
  .footnote {
    margin-top: 24px; font-size: 12px; color: var(--color-brand-500);
  }
</style>
</head>
<body>
<h1 class="page-title">매출관리</h1>
<p class="page-subtitle">출고 전표 목록</p>

<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">시작일</span>
    <input class="filter-input" type="text" value="2026-05-01" readonly/>
  </div>
  <div class="filter-group">
    <span class="filter-label">종료일</span>
    <input class="filter-input" type="text" value="2026-05-18" readonly/>
  </div>
  <div class="filter-group">
    <span class="filter-label">거래처명</span>
    <select class="filter-select"><option>전체</option></select>
  </div>
  <div class="filter-group">
    <span class="filter-label">매출번호</span>
    <input class="filter-input" type="text" value="" placeholder="2026/05/18-1"/>
  </div>
  <button class="page-size-btn">50/page</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>매출번호</th>
        <th>거래처</th>
        <th>금액</th>
        <th>수량</th>
        <th>출고창고</th>
        <th>상태</th>
        <th>출고</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><a class="slip-no">2026/05/18-1</a></td>
        <td>삼한공조</td>
        <td class="amount">480,000원</td>
        <td>4</td>
        <td>본사창고</td>
        <td><span class="badge badge-saved">저장완료</span></td>
        <td><button class="btn-secondary">출고</button></td>
      </tr>
      <tr>
        <td><a class="slip-no">2026/05/17-3</a></td>
        <td>서울냉열</td>
        <td class="amount">240,000원</td>
        <td>2</td>
        <td>2창고</td>
        <td><span class="badge badge-shipping">배송중</span></td>
        <td><span class="no-action">-</span></td>
      </tr>
      <tr>
        <td><a class="slip-no">2026/05/16-2</a></td>
        <td>동부설비</td>
        <td class="amount">360,000원</td>
        <td>3</td>
        <td>본사창고</td>
        <td><span class="badge badge-confirmed">확정</span></td>
        <td><button class="btn-secondary">출고</button></td>
      </tr>
      <tr>
        <td><a class="slip-no">2026/05/15-1</a></td>
        <td>한강설비</td>
        <td class="amount">120,000원</td>
        <td>1</td>
        <td>본사창고</td>
        <td><span class="badge badge-draft">임시저장</span></td>
        <td><span class="no-action">-</span></td>
      </tr>
    </tbody>
  </table>
</div>

<p class="footnote">내부 UUID 는 표시하지 않고 매출번호(slipNo)만 노출. SAVED 행만 출고 CTA secondary 활성.</p>
</body>
</html>
