<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SP-08-6-3 PNG 01 — 매출 전표 삭제 확인 modal</title>
<style>
  /* Pretendard (self-hosted — design-system fonts/) via stack fallback */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif;
    font-size: 14px;
    background: #f3f4f6;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }

  /* ---- modal backdrop ---- */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
  }

  /* ---- modal shell (sm = 400px max, design-system Modal size="sm") ---- */
  .modal {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    width: min(400px, calc(100vw - 32px));
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* modal head — 18px semibold 한국어 typography */
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid #e5e7eb;
    background: #f9fafb;
  }
  .modal-title { font-size: 18px; font-weight: 600; color: #111827; }
  .modal-close {
    appearance: none; background: transparent; border: 0;
    font-size: 20px; cursor: pointer; color: #6b7280; line-height: 1;
  }

  /* modal body */
  .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 0; }
  .modal-body .q {
    font-size: 15px; font-weight: 600; color: #111827;
    margin-bottom: 8px;
  }
  .modal-body .slip-info {
    font-size: 13px; color: #6b7280; margin-bottom: 16px;
  }
  .modal-body .slip-info strong { color: #111827; }

  /* danger-text (global.css .danger-text — color: var(--color-danger-700) #B91C1C) */
  .danger-text {
    font-size: 13px;
    color: #B91C1C; /* --color-danger-700 */
    margin-bottom: 0;
  }

  /* modal footer */
  .modal-foot {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 14px 16px;
    border-top: 1px solid #e5e7eb;
    background: #fff;
  }

  /* Button variant="ghost" — 취소 */
  .btn-ghost {
    appearance: none; border: 1px solid #cbd5e1; background: transparent;
    color: #111827; border-radius: 8px; padding: 8px 16px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit;
  }
  .btn-ghost:hover { background: #f9fafb; }

  /* Button variant="danger" — 삭제 CTA (design-system token primary-error) */
  .btn-danger {
    appearance: none; border: 0;
    background: #B91C1C; /* --color-danger-700 / error token */
    color: #fff; border-radius: 8px; padding: 8px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .btn-danger:hover { background: #991B1B; }

  /* card wrapper (design-system Card padding=4 shadow="none") */
  .card { padding: 16px; background: #fff; }
</style>
</head>
<body>
<div class="backdrop">
  <div class="modal" role="dialog" aria-modal="true"
       aria-labelledby="delete-modal-title"
       data-testid="sales-slip-delete-confirm">

    <div class="modal-head">
      <span class="modal-title" id="delete-modal-title">매출 전표 삭제</span>
      <button class="modal-close" aria-label="닫기">&#x2715;</button>
    </div>

    <div class="modal-body">
      <div class="card">
        <p class="q">정말 삭제하시겠습니까?</p>
        <p class="slip-info">
          전표번호: <strong>SL-2026-00142</strong><br>
          거래처: <strong>세종전자</strong>
        </p>
        <!-- danger-text: global.css .danger-text — color: --color-danger-700 -->
        <p class="danger-text">삭제된 전표는 복구할 수 없습니다.</p>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn-ghost" data-testid="sales-slip-delete-confirm-no">취소</button>
      <button class="btn-danger" data-testid="sales-slip-delete-confirm-yes">삭제</button>
    </div>

  </div>
</div>
</body>
</html>
