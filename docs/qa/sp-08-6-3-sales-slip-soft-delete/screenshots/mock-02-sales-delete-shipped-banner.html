<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SP-08-6-3 PNG 02 — 422 SHIPPED 차단 danger-banner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif;
    font-size: 14px;
    background: #f3f4f6;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }

  .backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
  }

  .modal {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    width: min(400px, calc(100vw - 32px));
    display: flex; flex-direction: column; overflow: hidden;
  }

  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid #e5e7eb;
    background: #f9fafb;
  }
  .modal-title { font-size: 18px; font-weight: 600; color: #111827; }
  .modal-close {
    appearance: none; background: transparent; border: 0;
    font-size: 20px; cursor: pointer; color: #6b7280; line-height: 1;
  }

  .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 0; }
  .modal-body .q {
    font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 8px;
  }
  .modal-body .slip-info {
    font-size: 13px; color: #6b7280; margin-bottom: 16px;
  }
  .modal-body .slip-info strong { color: #111827; }
  .danger-text {
    font-size: 13px; color: #B91C1C; margin-bottom: 0;
  }

  /*
   * danger-banner — global.css L3444 SP-08-5-3 등록 토큰
   * border: --color-danger-300 (#FCA5A5)
   * background: --color-danger-50 (#FEF2F2)
   * color: --color-danger-800 (#991B1B)
   * SP-08-5-3 designer cycle1 D-4 Note: 800 vs 700 — 800 통일 적용
   */
  .danger-banner {
    padding: 10px 12px;
    margin-top: 12px;
    margin-bottom: 0;
    border-radius: 6px;
    border: 1px solid #FCA5A5; /* --color-danger-300 */
    background: #FEF2F2;       /* --color-danger-50  */
    color: #991B1B;             /* --color-danger-800 */
    font-size: 14px;
  }
  .danger-banner strong { display: block; margin-bottom: 4px; font-weight: 700; }
  .danger-banner p { font-size: 13px; margin: 0; }

  .modal-foot {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 14px 16px;
    border-top: 1px solid #e5e7eb;
    background: #fff;
  }

  .btn-ghost {
    appearance: none; border: 1px solid #cbd5e1; background: transparent;
    color: #111827; border-radius: 8px; padding: 8px 16px;
    font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  /* 삭제 버튼 비활성 — 422 차단 시 disabled */
  .btn-danger-disabled {
    appearance: none; border: 0;
    background: #B91C1C; color: #fff; border-radius: 8px; padding: 8px 16px;
    font-size: 14px; font-weight: 600; cursor: not-allowed; font-family: inherit;
    opacity: 0.35;
  }

  .card { padding: 16px; background: #fff; }
</style>
</head>
<body>
<div class="backdrop">
  <div class="modal" role="dialog" aria-modal="true"
       aria-labelledby="delete-modal-title"
       data-testid="sales-slip-delete-confirm">

    <div class="modal-head">
      <span class="modal-title" id="delete-modal-title">매출 전표 삭제</span>
      <button class="modal-close" aria-label="닫기">&#x2715;</button>
    </div>

    <div class="modal-body">
      <div class="card">
        <p class="q">정말 삭제하시겠습니까?</p>
        <p class="slip-info">
          전표번호: <strong>SL-2026-00188</strong><br>
          거래처: <strong>한라유통</strong>
        </p>
        <p class="danger-text">삭제된 전표는 복구할 수 없습니다.</p>

        <!--
          422 SHIPPED 차단 배너
          data-testid="sales-slip-delete-shipped-banner"
          SP-08-5-3 purchaseDeleteInspectionAlert 패턴 1:1 이식
          한국어 라벨: "출고 진행 중이거나 완료된 매출 전표는 삭제할 수 없습니다"
        -->
        <div class="danger-banner"
             role="alert"
             data-testid="sales-slip-delete-shipped-banner">
          <strong>삭제 불가</strong>
          <p>출고 진행 중이거나 완료된 매출 전표는 삭제할 수 없습니다.</p>
        </div>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn-ghost">취소</button>
      <!-- 422 차단 시 삭제 버튼 disabled -->
      <button class="btn-danger-disabled" disabled
              data-testid="sales-slip-delete-confirm-yes">삭제</button>
    </div>

  </div>
</div>
</body>
</html>
