<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SP-08-6-3 PNG 03 — 삭제 성공 + redirect success-banner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif;
    font-size: 14px;
    background: #f3f4f6;
  }

  /* ---- 상단 nav stub ---- */
  .topbar {
    height: 56px;
    background: #111827;
    display: flex; align-items: center; padding: 0 20px; gap: 12px;
  }
  .topbar-brand { color: #fff; font-weight: 700; font-size: 16px; }
  .topbar-breadcrumb { color: #9ca3af; font-size: 13px; }

  /* ---- page shell ---- */
  .page {
    max-width: 1280px; margin: 0 auto; padding: 24px 16px;
  }

  /* ---- page header ---- */
  .page-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }
  .page-title { font-size: 20px; font-weight: 700; color: #111827; }
  .back-link {
    font-size: 13px; color: #2563eb; text-decoration: none;
    border: 1px solid #93c5fd; border-radius: 6px; padding: 4px 10px;
  }

  /*
   * success-banner (global.css / sales.module.css .successBanner)
   * border: --state-success (#10b981)
   * background: --state-success-bg (#d1fae5)
   * color: --state-success-text (#065f46)
   * 3초 toast → SP-08-5-3 패턴 일관
   * data-testid="sales-slip-delete-success-banner"
   */
  .success-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #10b981;       /* --state-success */
    background: #d1fae5;             /* --state-success-bg */
    color: #065f46;                  /* --state-success-text */
    font-size: 14px; font-weight: 600;
  }
  .success-banner .close-btn {
    appearance: none; background: transparent; border: 0;
    color: #065f46; font-size: 18px; cursor: pointer; padding: 0 4px;
  }

  /* list table stub */
  .list-table {
    width: 100%; border-collapse: collapse; background: #fff;
    font-size: 13px; border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .list-table th {
    background: #f9fafb; font-weight: 700; font-size: 12px;
    color: #374151; text-transform: uppercase; letter-spacing: 0.4px;
    border-bottom: 1px solid #e5e7eb; padding: 10px 12px; text-align: left;
  }
  .list-table td {
    border-bottom: 1px solid #e5e7eb; padding: 10px 12px;
  }
  .list-table tbody tr:hover { background: #f9fafb; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
  }
  .badge-saved { background: #dbeafe; color: #1e40af; }
  .badge-canceled { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">삼한물류</span>
  <span class="topbar-breadcrumb">/ 매출관리 / 매출전표목록</span>
</div>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">매출전표 목록</h1>
  </div>

  <!--
    삭제 성공 toast/banner
    data-testid="sales-slip-delete-success-banner"
    3초 자동 소멸 or 닫기 버튼으로 dismiss — SP-08-5-3 onSuccess 패턴 1:1
  -->
  <div class="success-banner"
       role="status"
       data-testid="sales-slip-delete-success-banner">
    <span>전표가 삭제되었습니다. (SL-2026-00142)</span>
    <button class="close-btn" aria-label="닫기">&#x2715;</button>
  </div>

  <!-- 매출 전표 목록 stub — 삭제된 SL-2026-00142 미노출 확인 포인트 -->
  <table class="list-table">
    <thead>
      <tr>
        <th>전표번호</th>
        <th>전표일자</th>
        <th>거래처</th>
        <th>담당자</th>
        <th>합계 (원)</th>
        <th>상태</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>SL-2026-00145</td>
        <td>2026-05-18</td>
        <td>한라유통</td>
        <td>이영업</td>
        <td style="text-align:right">1,240,000</td>
        <td><span class="badge badge-saved">저장</span></td>
      </tr>
      <tr>
        <td>SL-2026-00143</td>
        <td>2026-05-17</td>
        <td>강남상사</td>
        <td>박매니저</td>
        <td style="text-align:right">880,000</td>
        <td><span class="badge badge-saved">저장</span></td>
      </tr>
      <!-- SL-2026-00142 (삭제됨) — soft delete 이므로 목록에서 미노출 -->
    </tbody>
  </table>
</div>

</body>
</html>
