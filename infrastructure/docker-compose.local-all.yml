      SAMHAN_PARTNER_ORDER_SEED_TEST_DATA: "true"
    ports:
      - "127.0.0.1:8088:8088"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes: *service-volumes
    networks:
      - samhan-net

  dc-config-service:
    build:
      <<: *spring-build
      args:
        JAR_FILE: services/dc-config-service/build/libs/dc-config-service.jar
    container_name: samhan-dc-config-service
