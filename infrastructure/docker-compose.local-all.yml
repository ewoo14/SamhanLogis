  partner-order-service:
    build:
      <<: *spring-build
      args:
        JAR_FILE: services/partner-order-service/build/libs/partner-order-service.jar
    container_name: samhan-partner-order-service
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      <<: *spring-env
      SERVER_PORT: "8088"
      SAMHAN_PARTNER_ORDER_DB_HOST: postgres
      SAMHAN_PARTNER_ORDER_DB_PORT: "5432"
      SAMHAN_PARTNER_ORDER_DB_NAME: partner_order_db
      SAMHAN_PARTNER_ORDER_DB_USER: samhan
      SAMHAN_PARTNER_ORDER_DB_PASSWORD: samhan_dev_pw
      SAMHAN_AUTH_SERVICE_URL: http://auth-service:8081
      SAMHAN_PARTNER_SERVICE_URL: http://partner-service:8095
      SAMHAN_PRODUCT_SERVICE_URL: http://product-service:8084
      BOOTSTRAP_CACHE_REFRESH_MINUTES: ${BOOTSTRAP_CACHE_REFRESH_MINUTES:-10}
      # dev 시드 toggle — partner/accounting/arologis 와 일관. PartnerOrderSeeder
