    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8097/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 75s
    volumes:
      - ../docs/migration/ecount-data/raw:/workspace/docs/migration/ecount-data/raw:ro
