      SAMHAN_DC_CONFIG_DB_PORT: "5432"
      SAMHAN_DC_CONFIG_DB_NAME: dc_config_db
      SAMHAN_DC_CONFIG_DB_USER: samhan
      SAMHAN_DC_CONFIG_DB_PASSWORD: samhan_dev_pw
      SAMHAN_AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "127.0.0.1:8089:8089"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8089/actuator/health || exit 1"]
