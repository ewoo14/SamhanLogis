# SamhanLogis MIG-23 local-all overlay.
#
# Usage:
#   docker compose -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.local-all.yml up -d
#
# This overlay adds Eureka, gateway, and the 14 Spring services on top of the
# existing infra compose file. JAR artifacts are produced by scripts/launch-local-stack.*
# before docker compose builds these runtime images.

x-spring-build: &spring-build
  context: ..
  dockerfile: infrastructure/docker/spring-service.Dockerfile

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: dev
  TZ: "Asia/Seoul"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: samhan
  DB_PASSWORD: samhan_dev_pw
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  RABBIT_HOST: rabbitmq
  RABBIT_PORT: "5672"
  RABBIT_USER: samhan
  RABBIT_PASSWORD: samhan_dev_pw
  EUREKA_URL: http://eureka-server:8761/eureka/
  SAMHAN_DISCOVERY_PROVIDER: eureka
  SAMHAN_INTERNAL_TOKEN: dev-internal-token-change-me
  ECOUNT_REIMPORT_RAW_DIR: /workspace/docs/migration/ecount-data/raw
  LOGGING_FILE_PATH: /logs/samhan-service.log
  # MIG-23 사이클 1e fix (Codex Performance MAJOR) — Container heap 비율 cap.
  # Docker Desktop 8GB + 14 service + 8 client 환경에서 OOM 차단.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=30.0 -Duser.timezone=Asia/Seoul"

# MIG-23 사이클 1e fix (Codex Performance MAJOR) — Container memory hard cap.
x-service-memory: &service-memory
  mem_limit: 1g
  mem_reservation: 512m

x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  eureka-server:
    condition: service_healthy
  api-gateway:
    condition: service_healthy

x-service-volumes: &service-volumes
  - ../docs/migration/ecount-data/raw:/workspace/docs/migration/ecount-data/raw:ro
  - ../logs/local-stack:/logs

services:
  grafana:
    ports:
      - "127.0.0.1:3000:3000"

  eureka-server:
    build:
      <<: *spring-build
      args:
        JAR_FILE: services/eureka-server/build/libs/eureka-server.jar
    container_name: samhan-eureka
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: "Asia/Seoul"
      SERVER_PORT: "8761"
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=30.0 -Duser.timezone=Asia/Seoul"
    ports:
      - "127.0.0.1:8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ../logs/local-stack:/logs
    networks:
      - samhan-net

  api-gateway:
    build:
      <<: *spring-build
      args:
        JAR_FILE: services/api-gateway/build/libs/api-gateway.jar
    container_name: samhan-api-gateway
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      TZ: "Asia/Seoul"
      SERVER_PORT: "8080"
      EUREKA_URL: http://eureka-server:8761/eureka/
      SAMHAN_JWT_SECRET: dev-only-secret-must-be-64-chars-or-longer-for-hmac-sha256-min-x
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=30.0 -Duser.timezone=Asia/Seoul"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    volumes:
      - ../logs/local-stack:/logs
    networks:
      - samhan-net

  auth-service:
    build:
      <<: *spring-build
      args:
        JAR_FILE: services/auth-service/build/libs/auth-service.jar
    container_name: samhan-auth-service
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      <<: *spring-env
      SERVER_PORT: "8081"
      DB_NAME: auth_db
      SAMHAN_JWT_SECRET: dev-only-secret-must-be-64-chars-or-longer-for-hmac-sha256-min-x
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    volumes: *service-volumes
    networks:
      - samhan-net

  user-service:
    build:
      <<: *spring-build
      args:
        JAR_FILE: services/user-service/build/libs/user-service.jar
    container_name: samhan-user-service
    restart: unless-stopped
