# SamhanLogis Phase 11 — Production docker-compose (AWS EC2 m5.xlarge)
#
# 사용법:
#   # EC2 /opt/samhanlogis/ 에서 실행 (user_data.sh 가 자동 기동)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# 전제 조건:
#   - .env.production 에 ECR_REGISTRY, SAMHAN_DB_HOST, SAMHAN_DB_PASSWORD 등 설정 완료
#   - ECR 로그인 완료 (aws ecr get-login-password | docker login ...)
#   - RDS 15 DB 초기화 완료 (init-rds.sql 실행 또는 user_data.sh 자동 처리)
#
# 아키텍처 결정:
#   - PostgreSQL → RDS (컨테이너 없음)
#   - MinIO      → AWS S3 (SAMHAN_S3_ENDPOINT=https://s3.ap-northeast-2.amazonaws.com)
#   - Prometheus/Grafana → CloudWatch (컨테이너 없음)
#   - Nginx      → ALB (컨테이너 없음)
#   - RabbitMQ   → 컨테이너 유지 (logging-service RabbitMQ 의존)
#   - Elasticsearch → 컨테이너 유지 (logging-service ES 의존)
#
# KST 전역 표준화 (project_kst_timezone_standard.md #479):
#   - TZ=Asia/Seoul + JAVA_TOOL_OPTIONS -Duser.timezone=Asia/Seoul
#   - RDS timezone 는 rds.tf parameter group timezone=Asia/Seoul

networks:
  samhan-prod-net:
    driver: bridge
    name: samhan-prod-net

volumes:
  rabbitmq_data:
  es_data:
  arologis_signature_copies:

# ─── 공통 앵커 ───────────────────────────────────────────────────────────────

x-spring-prod: &spring-prod
  SPRING_PROFILES_ACTIVE: production
  TZ: "Asia/Seoul"
  # RDS 공통 DB 접속 (서비스별 DB_NAME / SAMHAN_*_DB_{HOST,NAME} 으로 오버라이드)
  DB_HOST: ${SAMHAN_DB_HOST}
  DB_PORT: "5432"
  DB_USER: ${SAMHAN_DB_USERNAME}
  DB_PASSWORD: ${SAMHAN_DB_PASSWORD}
  RABBIT_HOST: rabbitmq
  RABBIT_PORT: "5672"
  RABBIT_USER: samhan
  RABBIT_PASSWORD: ${RABBIT_PASSWORD}
  EUREKA_URL: http://eureka-server:8761/eureka/
  SAMHAN_DISCOVERY_PROVIDER: eureka
  SAMHAN_INTERNAL_TOKEN: ${SAMHAN_INTERNAL_TOKEN}
  INTERNAL_AUTH_TOKEN: ${SAMHAN_INTERNAL_TOKEN}
  # 게이트웨이와 downstream 서비스가 동일한 운영 attestation을 참조한다.
  # 값은 .env.production/Secrets Manager 주입으로만 전달하며 저장소에 두지 않는다.
  SAMHAN_GATEWAY_ATTESTATION: ${SAMHAN_GATEWAY_ATTESTATION:-}
  # KST + 컨테이너 메모리 cap (m5.xlarge 16GB, 17 service × max 1GB)
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=30.0 -Duser.timezone=Asia/Seoul"
  # S3 — 운영은 AWS S3 endpoint + Secrets Manager 주입 키 사용
  SAMHAN_S3_ENDPOINT: ${SAMHAN_S3_ENDPOINT:-https://s3.ap-northeast-2.amazonaws.com}
  SAMHAN_S3_ACCESS_KEY: ${SAMHAN_S3_ACCESS_KEY}
  SAMHAN_S3_SECRET_KEY: ${SAMHAN_S3_SECRET_KEY}
  SAMHAN_S3_BUCKET: samhan-attachments
  SAMHAN_S3_PATH_STYLE_ACCESS: "false"
  SAMHAN_S3_PRESIGNED_EXPIRY: "300"
  AWS_DEFAULT_REGION: ${SAMHAN_AWS_REGION:-ap-northeast-2}
  # us-east-1 fallback presigned 403 회피 — 전 서비스 명시 주입 (slip-service 포함)
  SAMHAN_AWS_REGION: ${SAMHAN_AWS_REGION:-ap-northeast-2}

x-service-memory: &service-memory
  mem_limit: 1g
  mem_reservation: 512m

# 공통 의존 (RabbitMQ + Elasticsearch + Eureka)
# api-gateway service_healthy 의존 제거: 기동 직렬화 7분+ 회피 — 각 서비스는 Eureka 등록 기반 라우팅
# 단일 앵커 사용 — YAML 이중 << 머지 문제 회피 (Docker Compose Go YAML 파서 호환)
x-app-depends: &app-depends
  rabbitmq:
    condition: service_healthy
  elasticsearch:
    condition: service_healthy
  eureka-server:
    condition: service_healthy

services:

  # ===========================================================================
  # 인프라 서비스 (RabbitMQ + Elasticsearch)
  # ===========================================================================

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: samhan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: samhan
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - samhan-prod-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: samhan-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - samhan-prod-net

  # ===========================================================================
  # Spring Services (17 services, ECR 이미지, RDS 연결)
  # 이미지: ${ECR_REGISTRY}/samhanlogis-production-{service}:{IMAGE_TAG:-latest}
  # ECR_REGISTRY = <account_id>.dkr.ecr.ap-northeast-2.amazonaws.com (.env.production 주입)
  # ===========================================================================

  # ─── eureka-server (8761) ──────────────────────────────────────────────────
  eureka-server:
    image: ${ECR_REGISTRY}/samhanlogis-production-eureka-server:${IMAGE_TAG:-latest}
    container_name: samhan-eureka
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      SPRING_PROFILES_ACTIVE: production
      TZ: "Asia/Seoul"
      SERVER_PORT: "8761"
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=30.0 -Duser.timezone=Asia/Seoul"
    ports:
      - "127.0.0.1:8761:8761"
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - samhan-prod-net

  # ─── api-gateway (8080) ────────────────────────────────────────────────────
  api-gateway:
    image: ${ECR_REGISTRY}/samhanlogis-production-api-gateway:${IMAGE_TAG:-latest}
    container_name: samhan-api-gateway
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      SPRING_PROFILES_ACTIVE: production
      TZ: "Asia/Seoul"
      SERVER_PORT: "8080"
      EUREKA_URL: http://eureka-server:8761/eureka/
      SAMHAN_JWT_SECRET: ${SAMHAN_JWT_SECRET}
      JWT_SECRET: ${SAMHAN_JWT_SECRET}
      SAMHAN_GATEWAY_ATTESTATION: ${SAMHAN_GATEWAY_ATTESTATION:-}
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: "600s"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=30.0 -Duser.timezone=Asia/Seoul"
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - samhan-prod-net

  # ─── auth-service (8081) ───────────────────────────────────────────────────
  auth-service:
    image: ${ECR_REGISTRY}/samhanlogis-production-auth-service:${IMAGE_TAG:-latest}
    container_name: samhan-auth-service
    restart: unless-stopped
    <<: *service-memory
    environment:
      <<: *spring-prod
      SERVER_PORT: "8081"
      DB_NAME: auth_db
      SAMHAN_JWT_SECRET: ${SAMHAN_JWT_SECRET}
      JWT_SECRET: ${SAMHAN_JWT_SECRET}
      COOKIE_SECURE: "true"
      SAMHAN_SMTP_HOST: ${SAMHAN_SMTP_HOST}
      SAMHAN_SMTP_PORT: ${SAMHAN_SMTP_PORT}
      SAMHAN_SMTP_AUTH: "true"
      SAMHAN_SMTP_STARTTLS: "true"
      SAMHAN_SMTP_USERNAME: ${SAMHAN_SMTP_USERNAME}
      SAMHAN_SMTP_PASSWORD: ${SAMHAN_SMTP_PASSWORD}
      SAMHAN_PASSWORD_RESET_FROM_EMAIL: no-reply@samhan-air.com
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      <<: *app-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - samhan-prod-net

  # ─── logging-service (8082) ────────────────────────────────────────────────
  # DB 없음 — Elasticsearch + RabbitMQ 전용
  logging-service:
    image: ${ECR_REGISTRY}/samhanlogis-production-logging-service:${IMAGE_TAG:-latest}
    container_name: samhan-logging-service
    restart: unless-stopped
    <<: *service-memory
    environment:
      SPRING_PROFILES_ACTIVE: production
      TZ: "Asia/Seoul"
      SERVER_PORT: "8082"
      EUREKA_URL: http://eureka-server:8761/eureka/
      ES_URI: http://elasticsearch:9200
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: samhan
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      SAMHAN_GATEWAY_ATTESTATION: ${SAMHAN_GATEWAY_ATTESTATION:-}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=30.0 -Duser.timezone=Asia/Seoul"
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - samhan-prod-net

  # ─── user-service (8083) ───────────────────────────────────────────────────
  user-service:
    image: ${ECR_REGISTRY}/samhanlogis-production-user-service:${IMAGE_TAG:-latest}
    container_name: samhan-user-service
    restart: unless-stopped
    <<: *service-memory
    environment:
      <<: *spring-prod
      SERVER_PORT: "8083"
      DB_NAME: user_db
      SAMHAN_AUTH_SERVICE_URL: http://auth-service:8081
      SAMHAN_SIGNATURE_PUBLIC_BASE_URL: https://api.samhan-air.com
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      <<: *app-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - samhan-prod-net

  # ─── product-service (8084) ────────────────────────────────────────────────
  product-service:
    image: ${ECR_REGISTRY}/samhanlogis-production-product-service:${IMAGE_TAG:-latest}
    container_name: samhan-product-service
    restart: unless-stopped
    <<: *service-memory
    environment:
      <<: *spring-prod
      SERVER_PORT: "8084"
      DB_NAME: product_db
      SAMHAN_AUTH_SERVICE_URL: http://auth-service:8081
      # Google Sheets sync — Phase 11 cutover 후 GCP Service Account 실 키 등록 시 true 전환
      PRODUCT_SYNC_SCHEDULING_ENABLED: "false"
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      <<: *app-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - samhan-prod-net

  # ─── inventory-service (8085) ──────────────────────────────────────────────
  inventory-service:
    image: ${ECR_REGISTRY}/samhanlogis-production-inventory-service:${IMAGE_TAG:-latest}
    container_name: samhan-inventory-service
    restart: unless-stopped
    <<: *service-memory
    environment:
      <<: *spring-prod
      SERVER_PORT: "8085"
      DB_NAME: inventory_db
      SAMHAN_AUTH_SERVICE_URL: http://auth-service:8081
      # Phase 11 운영: S3 호환 MinIO client 활성. NoopInspectionStorage 운영 가드 회피.
      SAMHAN_INVENTORY_MINIO_ENABLED: "true"
      SAMHAN_INVENTORY_MINIO_ENDPOINT: ${SAMHAN_S3_ENDPOINT:-https://s3.ap-northeast-2.amazonaws.com}
      SAMHAN_INVENTORY_MINIO_ACCESS_KEY: ${SAMHAN_S3_ACCESS_KEY}
      SAMHAN_INVENTORY_MINIO_SECRET_KEY: ${SAMHAN_S3_SECRET_KEY}
      SAMHAN_INVENTORY_MINIO_BUCKET: samhan-attachments
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      <<: *app-depends
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - samhan-prod-net

  # ─── slip-service (8086) ───────────────────────────────────────────────────
  slip-service:
    image: ${ECR_REGISTRY}/samhanlogis-production-slip-service:${IMAGE_TAG:-latest}
    container_name: samhan-slip-service
    restart: unless-stopped
    <<: *service-memory
    # #809 R6-H5: 가격기억 alarm 2건(monitoring.tf metric filter)의 로그 원천 보장.
    # CloudWatch Agent 의 json 와일드카드 tail 은 AWS 문서상 "최신 수정 파일만 push"
    # 라 17개 컨테이너 동시 기록에서 slip WARN 라인이 유실될 수 있어, slip-service 만
    # awslogs driver 로 CloudWatch Logs 에 직접 전달한다 (파일 tail 경합 자체가 없음).
    # - 인증: dockerd 가 EC2 instance role 사용 (iam.tf logs:CreateLogStream/PutLogEvents)
    # - log group 은 Terraform(aws_cloudwatch_log_group.docker) 선생성 — create-group 불필요
    # - 시작 결합: awslogs 는 컨테이너 시작 시 CreateLogStream 호출 — 실패 시 기동 실패
    #   (CUTOVER.md M-19 ⓪ 선행 조건 참조). 로컬 실행 금지 파일이므로 로컬 영향 없음.
    # - mode=non-blocking: CloudWatch 지연이 앱 stdout 을 블록하지 않음 (극단 burst 시
    #   드롭 허용 — alarm 은 반복 WARN 감지 목적이라 수용).
    # - docker logs 는 Docker 20.10+ dual logging 기본값으로 계속 동작.
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /samhanlogis/production/docker
        awslogs-stream: slip-service
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 4m
    environment:
      <<: *spring-prod
      SERVER_PORT: "8086"
      DB_NAME: slip_db
      WAREHOUSE_MAPPING_MODE: ${WAREHOUSE_MAPPING_MODE:-}
      WAREHOUSE_UUID_ECOUNT_00003: ${WAREHOUSE_UUID_ECOUNT_00003:-}
      WAREHOUSE_UUID_ECOUNT_2: ${WAREHOUSE_UUID_ECOUNT_2:-}
      WAREHOUSE_UUID_ECOUNT_14: ${WAREHOUSE_UUID_ECOUNT_14:-}
      WAREHOUSE_UUID_ECOUNT_1: ${WAREHOUSE_UUID_ECOUNT_1:-}
      SAMHAN_AUTH_SERVICE_URL: http://auth-service:8081
      SAMHAN_PRODUCT_SERVICE_URL: http://product-service:8084
      SAMHAN_PARTNER_SERVICE_URL: http://partner-service:8095
      SAMHAN_NOTIFICATION_SERVICE_URL: http://notification-service:8093
      SAMHAN_AROLOGIS_DISPATCH_URL: http://arologis-service:8097
      SAMHAN_REALTIME_BROKER: in-memory
      SAMHAN_REALTIME_HEARTBEAT_SECONDS: "30"
      # #809 운영 노브: user_data.sh 가 생성한 .env.production 값을 컨테이너에 명시 전달.
      SAMHAN_AUTH_CONNECT_TIMEOUT_MS: ${SAMHAN_AUTH_CONNECT_TIMEOUT_MS:-2000}
      SAMHAN_AUTH_READ_TIMEOUT_MS: ${SAMHAN_AUTH_READ_TIMEOUT_MS:-3000}
      SAMHAN_PRICE_MEMORY_LOCK_TIMEOUT_MS: ${SAMHAN_PRICE_MEMORY_LOCK_TIMEOUT_MS:-1000}
      SAMHAN_PRICE_MEMORY_STATEMENT_TIMEOUT_MS: ${SAMHAN_PRICE_MEMORY_STATEMENT_TIMEOUT_MS:-3000}
      SAMHAN_PRICE_MEMORY_TRANSACTION_TIMEOUT_SECONDS: ${SAMHAN_PRICE_MEMORY_TRANSACTION_TIMEOUT_SECONDS:-4}
      SAMHAN_PRICE_MEMORY_ASYNC_CORE_POOL_SIZE: ${SAMHAN_PRICE_MEMORY_ASYNC_CORE_POOL_SIZE:-2}
      SAMHAN_PRICE_MEMORY_ASYNC_MAX_POOL_SIZE: ${SAMHAN_PRICE_MEMORY_ASYNC_MAX_POOL_SIZE:-4}
      SAMHAN_PRICE_MEMORY_ASYNC_QUEUE_CAPACITY: ${SAMHAN_PRICE_MEMORY_ASYNC_QUEUE_CAPACITY:-100}
      SAMHAN_PRICE_MEMORY_ASYNC_SHUTDOWN_AWAIT_SECONDS: ${SAMHAN_PRICE_MEMORY_ASYNC_SHUTDOWN_AWAIT_SECONDS:-5}
      # R6-M2 + D-R8-2: Hikari 커넥션 획득 대기 상한(ms).
      # DB_CONNECTION_TIMEOUT_MS = slip-service 메인 DataSource 전역 — fleet 표준 30000 복원.
      # 종전 4000 전역화는 pool 포화 시 사용자 요청을 4초 만에 500 으로 끊었다(R6-M1 blast radius).
      # 가격기억의 4초 fail-soft 정책은 전용 pool(SAMHAN_PRICE_MEMORY_DB_*)로 격리했다.
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      # 가격기억 전용 pool (app.slip.price-memory.datasource.hikari) — 메인과 별개.
      SAMHAN_PRICE_MEMORY_DB_CONNECTION_TIMEOUT_MS: ${SAMHAN_PRICE_MEMORY_DB_CONNECTION_TIMEOUT_MS:-4000}
      SAMHAN_PRICE_MEMORY_DB_POOL_MAX: ${SAMHAN_PRICE_MEMORY_DB_POOL_MAX:-4}
      SAMHAN_PRICE_MEMORY_DB_POOL_MIN_IDLE: ${SAMHAN_PRICE_MEMORY_DB_POOL_MIN_IDLE:-0}
      # Phase 11 운영: slip attachment 는 AWS S3 endpoint + Secrets Manager 주입 키 사용
      SAMHAN_SLIP_MINIO_ENABLED: "true"
      SAMHAN_SLIP_MINIO_ENDPOINT: ${SAMHAN_S3_ENDPOINT:-https://s3.ap-northeast-2.amazonaws.com}
      SAMHAN_SLIP_MINIO_ACCESS_KEY: ${SAMHAN_S3_ACCESS_KEY}
      SAMHAN_SLIP_MINIO_SECRET_KEY: ${SAMHAN_S3_SECRET_KEY}
      SAMHAN_SLIP_MINIO_BUCKET: samhan-attachments
      # 시리얼 보상 운영 활성 — Phase 11 체크리스트 M-15 참조
      SAMHAN_COMPENSATION_RETENTION_ENABLED: "true"
      SAMHAN_COMPENSATION_PURGE_ENABLED: "true"
      SAMHAN_COMPENSATION_ALERT_ENABLED: "true"
      SAMHAN_COMPENSATION_ALERT_RECIPIENT_USER_ID: ${SAMHAN_COMPENSATION_ALERT_RECIPIENT_USER_ID:-}
      SAMHAN_COMPENSATION_RETRY_ENABLED: "true"
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      <<: *app-depends
    healthcheck:
      # readiness에는 inventory 권위 alias 검증 결과가 포함된다.
      # alias 0행/부분 누락/조회 실패 시 Docker가 healthy를 선언하지 않는다.
      test: ["CMD-SHELL", "curl -fs http://localhost:8086/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - samhan-prod-net

  # ─── accounting-service (8087) ─────────────────────────────────────────────
  accounting-service:
    image: ${ECR_REGISTRY}/samhanlogis-production-accounting-service:${IMAGE_TAG:-latest}
    container_name: samhan-accounting-service
    restart: unless-stopped
    <<: *service-memory
    environment:
      <<: *spring-prod
      SERVER_PORT: "8087"
      DB_NAME: accounting_db
      SAMHAN_USER_SERVICE_URL: http://user-service:8083
      SAMHAN_PRODUCT_SERVICE_URL: http://product-service:8084
      SAMHAN_PARTNER_SERVICE_URL: http://partner-service:8095
      SAMHAN_SLIP_SERVICE_URL: http://slip-service:8086
      SAMHAN_DASHBOARD_SERVICE_URL: http://dashboard-service:8094
      # 외부 API — DRY_RUN 유지 또는 sandbox 키 발급 후 전환
      ETAX_SUBMIT_METHOD: ${ETAX_SUBMIT_METHOD:-DRY_RUN}
      NTS_API_KEY: ${NTS_API_KEY:-}
