# Samhan Public renderer web build SPA fallback 예시.
# Phase 11 정적 배포 시 BrowserRouter deep-link 404 방지를 위해 try_files 로 index.html 에 위임한다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
