# 아로로지스 (Samhan Public) Nginx host-header 라우팅 (spec §8.3 — 2026-05-14)
#
# 배치: EC2 운영 환경에서 `/etc/nginx/conf.d/arologis.conf` 로 마운트.
#       infrastructure/docker-compose.yml 의 nginx service 가 ./nginx/conf.d 를 마운트하므로
#       본 파일은 `infrastructure/nginx/arologis.conf` 에 두고, 운영 배포 시
#       conf.d/arologis.conf 로 symlink/copy.
#
# 라우팅 규칙:
#   - api.samhan-air.com           → api-gateway:8080   (Samhan Public 본진, 영향 0 — 참조 기재)
#   - api.arologis.samhan-air.com  → arologis-service:8097  (gateway 우회, 직접 라우팅)
#   - app.arologis.samhan-air.com  → /var/www/arologis-desktop (Electron installer 다운로드)
#   - mobile.arologis.samhan-air.com → /var/www/arologis-mobile (Store deeplink)
#
# 영향 검증 (spec D-AX-04):
#   - 기존 `api.samhan-air.com` server block 은 Samhan Public 측 conf.d/ 에 그대로 유지 — 변경 0.
#   - 본 파일은 arologis 전용 3 server block 만 추가 — 기존 라우팅 영향 0.
#
# ACM SAN 주의:
#   - 현재 ACM = wildcard *.samhan-air.com — *.arologis.samhan-air.com 미커버.
#   - ACM 갱신 시 SAN 추가 필요 ([ "*.samhan-air.com", "*.arologis.samhan-air.com" ]).
#   - 04-aws-deployment.md 의 cutover 절차 step 0 참조.

# ─── arologis API (gateway 우회 — 직접 라우팅) ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.arologis.samhan-air.com;

    ssl_certificate     /etc/nginx/ssl/samhan-air.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/samhan-air.com.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 헬스체크 expose — Lambda + ALB target group 용.
    location = /actuator/health {
        proxy_pass http://arologis-service:8097/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location / {
        proxy_pass         http://arologis-service:8097;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        client_max_body_size 300m;   # multi-vendor xlsx (spec 50MB × 6)
        proxy_read_timeout   300s;
    }
}

# ─── arologis 데스크톱 installer 다운로드 페이지 ────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.arologis.samhan-air.com;

    ssl_certificate     /etc/nginx/ssl/samhan-air.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/samhan-air.com.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/arologis-desktop;
    index index.html;

    # installer .exe 등 큰 바이너리 효율 전송
    location ~* \.(exe|dmg|AppImage|zip)$ {
        sendfile        on;
        tcp_nopush      on;
        expires         1h;
        add_header      Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── arologis 모바일 store deeplink 페이지 ──────────────────────────────────
server {
    listen 443 ssl http2;
    server_name mobile.arologis.samhan-air.com;

    ssl_certificate     /etc/nginx/ssl/samhan-air.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/samhan-air.com.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/arologis-mobile;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── HTTP → HTTPS redirect (3 도메인 일괄) ──────────────────────────────────
server {
    listen 80;
    server_name api.arologis.samhan-air.com
                app.arologis.samhan-air.com
                mobile.arologis.samhan-air.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 참조: 기존 api.samhan-air.com (Samhan Public 본진) ─────────────────────
# 본 server block 은 Samhan Public 측 conf.d/ 에 그대로 유지 (변경 0).
# 참고용 주석으로만 기재 — 본 파일에서 정의하지 않음.
