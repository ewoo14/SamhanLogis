# SamhanLogis - Prometheus scrape config (Phase 1).
# Targets resolve via Docker DNS on the samhan-net network.
# NOTE: the Phase-1 services (eureka, gateway, auth, logging) are not yet
# deployed onto samhan-net, so Prometheus will report them as DOWN until
# their containers boot. This is expected during the infra-only stand-up.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: samhan-local
    env: dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: logging-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["logging-service:8082"]

  # Phase 9 W2 — DevOps Follow-up #12 (W3 통합 PR 시점 채택)
  - job_name: groupware-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["groupware-service:8092"]

  # Phase 9 W3
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8093"]

  # Phase 9 W4
  - job_name: dashboard-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dashboard-service:8094"]

  # Phase 9 W5 — DevOps-3 채택 (P10-3 cutover 사전 대비, 14 service scrape 매트릭스 보강)
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8083"]

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service:8084"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8085"]

  - job_name: slip-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["slip-service:8086"]

  - job_name: accounting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["accounting-service:8087"]

  - job_name: partner-order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["partner-order-service:8088"]

  - job_name: dc-config-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dc-config-service:8089"]

  - job_name: partner-auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["partner-auth-service:8091"]

  - job_name: partner-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["partner-service:8095"]

  # Phase 10 W10-1 — arologis-service 신규 (D-P10-01 / D-P10-02). 18 scrape target (prometheus 자체 포함).
  - job_name: arologis-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["arologis-service:8097"]
