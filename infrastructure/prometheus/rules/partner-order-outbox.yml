groups:
  - name: partner-order-outbox
    rules:
      # 상태 기반 1차 알람. 기존 partner_order_slip_publish_terminal_total counter는
      # 추이 분석용 보조 지표이며, 단발 이벤트/로그를 알람 원천으로 사용하지 않는다.
      - alert: PartnerOrderOutboxPendingBacklog
        expr: outbox_pending_depth{application="partner-order-service"} > 0
        for: 10m
        labels:
          severity: warning
          service: partner-order-service
        annotations:
          summary: "partner-order-service 전표 발행 outbox backlog 지속"
          description: "스케줄러 주기 300초의 두 배인 600초 동안 미처리 outbox가 남아 있습니다. oldest age와 heartbeat를 함께 확인하십시오."
          runbook: "docs/runbooks/partner-order-outbox-terminal-failure.md"

      - alert: PartnerOrderOutboxOldestPendingTooOld
        expr: outbox_oldest_pending_age_seconds{application="partner-order-service"} > 86100
        for: 5m
        labels:
          severity: critical
          service: partner-order-service
        annotations:
          summary: "partner-order-service outbox 재시도 상한 임박"
          description: "가장 오래된 미처리 outbox가 86100초(24시간-5분)를 넘었습니다. 다음 scheduler tick의 24시간 종결 전에 조치하십시오."
          runbook: "docs/runbooks/partner-order-outbox-terminal-failure.md"

      - alert: PartnerOrderOutboxSchedulerStalled
        expr: outbox_scheduler_heartbeat_seconds{application="partner-order-service"} > 600
        for: 1m
        labels:
          severity: critical
          service: partner-order-service
        annotations:
          summary: "partner-order-service outbox scheduler 정지"
          description: "마지막 scheduler tick 이후 600초(5분 주기의 두 배)가 경과했습니다."
          runbook: "docs/runbooks/partner-order-outbox-terminal-failure.md"
