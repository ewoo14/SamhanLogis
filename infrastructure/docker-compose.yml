# SamhanLogis - Local development infrastructure stack
# Phase 1: data services + monitoring (Prometheus / Grafana / Nginx stub)
# All credentials below are DEV-ONLY. Do NOT use in staging or production.

networks:
  samhan-net:
    driver: bridge
    name: samhan-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  es_data:
  minio_data:
  prometheus_data:
  grafana_data:

services:
  # ---------------------------------------------------------------------------
  # Data services
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: samhan-postgres
    restart: unless-stopped
    # W10-6 회고 — default max_connections=100 부족.
    # 14 service × Hikari default 10 = 140 → "FATAL: sorry, too many clients already".
    # 300 으로 상향하여 14 service 동시 startup + IT/E2E + psql 검증 동시 진행 시 여유 확보.
    # shared_buffers 256MB — alpine default 128MB 대비 query plan cache hit 향상 (개발 편의).
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "timezone=Asia/Seoul"
    environment:
      POSTGRES_USER: samhan
      POSTGRES_PASSWORD: samhan_dev_pw   # DEV-ONLY
      POSTGRES_DB: postgres
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samhan"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  redis:
    image: redis:7-alpine
    container_name: samhan-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: samhan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: samhan
      RABBITMQ_DEFAULT_PASS: samhan_dev_pw   # DEV-ONLY
      TZ: Asia/Seoul
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - samhan-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: samhan-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
    networks:
      - samhan-net

  minio:
    image: minio/minio:latest
    container_name: samhan-minio
    restart: unless-stopped
    # P1 사진 첨부 bucket 목록 (멱등 생성 = infrastructure/scripts/setup-minio-buckets.ps1).
    # start-local-full.ps1 이 docker-compose up 직후 setup-minio-buckets.ps1 을 자동 호출.
    #
    #   - partner-attachments : 거래처 첨부 (P0-3, partner-service)
    #                           presigned TTL 3600s | private
    #   - slip-attachments    : 슬립 첨부 / 배송 현장 사진 (P1-8, slip-service)
    #                           presigned TTL 300s  | private
    #   - samhan-attachments  : P1 범용 첨부 (P1-photo, 공통 AttachmentService)
    #                           presigned TTL 300s  | private
    #                           Phase 11 AWS cutover 시 → S3 bucket samhan-attachments (ap-northeast-2)
    #                           (SAMHAN_S3_ENDPOINT 빈 값 → AWS SDK default endpoint 자동 전환)
    #
    # 정책: 모든 버킷 anonymous read 금지 (private). 다운로드는 presigned URL 만 허용.
    # Console: http://localhost:9001  (samhan / samhan_dev_pw — DEV-ONLY)
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: samhan
      MINIO_ROOT_PASSWORD: samhan_dev_pw   # DEV-ONLY
      TZ: Asia/Seoul
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  # ---------------------------------------------------------------------------
  # Monitoring stack
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: samhan-prometheus
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: samhan-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: samhan_dev_pw   # DEV-ONLY
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Seoul
    ports:
      - "3100:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net

  nginx:
    image: nginx:1.27-alpine
    container_name: samhan-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - samhan-net
