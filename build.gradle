/*
 * SamhanLogis — root build script
 *
 * Applies common conventions to every leaf subproject:
 *   - Java 17 toolchain
 *   - Spring Boot 3.3.5 / Spring Cloud 2023.0.3
 *   - Maven Central + Spring milestone repos
 *   - JUnit 5 test platform
 *
 * Subprojects override their own dependencies for service-specific libs.
 * Aggregator parents (':shared', ':services') are NOT given the java plugin
 * so they don't produce empty jars.
 */

plugins {
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'org.springframework.boot' version '3.3.5' apply false
}

ext {
    set('javaVersion', JavaVersion.VERSION_17)
    set('springCloudVersion', '2023.0.3')
    set('lombokVersion', '1.18.34')
    set('jjwtVersion', '0.12.6')
}

allprojects {
    group = 'com.samhanair.logis'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
}

def leafProjects = [
        ':shared:common',
        ':shared:discovery-abstraction',
        ':shared:user-client-abstraction',
        ':shared:security',
        ':shared:realtime-abstraction',
        ':shared:collab-core',
        ':shared:approval-core',
        ':shared:ecount-io',
        ':shared:notification-publisher',
        ':shared:audit-contract',
        ':shared:audit-publisher',
        ':services:eureka-server',
        ':services:api-gateway',
        ':services:auth-service',
        ':services:user-service',
        ':services:product-service',
        ':services:inventory-service',
        ':services:slip-service',
        ':services:accounting-service',
        ':services:logging-service',
        ':services:partner-auth-service',
        ':services:dc-config-service',
        ':services:partner-order-service',
        ':services:partner-service',
        ':services:groupware-service',
        ':services:notification-service',
        ':services:dashboard-service',
        ':services:arologis-service',
]

configure(leafProjects.collect { project(it) }) {
    apply plugin: 'java'
    apply plugin: 'eclipse'

    // JDT task tag 비활성화 — TODO/FIXME/XXX 키워드 information 진단 noise 제거
    // (XXX-XX-XXXXX 사업자번호 마스크 / Phase 11 TODO JavaDoc 등 의도된 텍스트가 JDT info 로 보고되는 회귀 차단)
    eclipse {
        jdt {
            file {
                withProperties { props ->
                    props.setProperty('org.eclipse.jdt.core.compiler.taskTags', '')
                    props.setProperty('org.eclipse.jdt.core.compiler.taskPriorities', '')
                }
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'file.encoding', 'UTF-8'
    }

    dependencies {
        constraints {
            implementation('commons-beanutils:commons-beanutils:1.11.0') {
                because 'CVE-2025-48734 대응: OpenCSV transitive commons-beanutils 하한 고정'
            }
        }
    }
}

def declaredLeafProjects = leafProjects as Set
def discoveredLeafProjects = subprojects
        .findAll { it.buildFile.isFile() }
        .collect { it.path } as Set
def missingLeafProjects = discoveredLeafProjects - declaredLeafProjects
def unexpectedLeafProjects = declaredLeafProjects - discoveredLeafProjects
if (!missingLeafProjects.isEmpty() || !unexpectedLeafProjects.isEmpty()) {
    throw new GradleException(
            "leafProjects 불일치: 누락=${missingLeafProjects.sort()}, " +
                    "예상 외=${unexpectedLeafProjects.sort()}"
    )
}
